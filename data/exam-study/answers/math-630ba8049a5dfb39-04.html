article{max-width:100%}</style></head><body><article><h1>2024年北京市中考数学试题 · 数学解答题 第18题 · 对应解析</h1><section data-question="18" id="q18"><p>18. 解不等式组：<img src="../assets/aecc288a32f1f2c78ebd.png" style="width:180.00px" alt="原卷公式或图表"></p><p>【答案】<img src="../assets/3297d3e4da81cd04c18b.png" style="width:102.00px" alt="原卷公式或图表"></p><p>【解析】</p><p>【分析】先求出每一个不等式的解集，在根据不等式解集的取值方法“同大取大，同小取小，大小小大中间找，大大小小无解”的方法确定不等式组的解集．本题考查了一元一次不等式组的解法，熟练进行不等式求解是解题的关键．</p><p>【详解】∵<img src="../assets/7a2f52b3063a4efd6c8c.png" style="width:198.00px" alt="原卷公式或图表"></p><p>∴解不等式①，得<img src="../assets/4c491813606919aa6fc0.png" style="width:55.50px" alt="原卷公式或图表">，解不等式,②，得<img src="../assets/5a4407e057a389d6e7f5.png" style="width:67.50px" alt="原卷公式或图表">， </p><p>∴不等式组的解集为<img src="../assets/3297d3e4da81cd04c18b.png" style="width:102.00px" alt="原卷公式或图表">．</p></section></article></body></html>
