article{max-width:100%}</style></head><body><article><h1>2024年北京市中考数学试题 · 数学解答题 第19题 · 对应解析</h1><section data-question="19" id="q19"><p>19. 已知<img src="../assets/6555011704951ca0acf8.png" style="width:120.00px" alt="原卷公式或图表">，求代数式<img src="../assets/afe97a1f9577f1ad271b.png" style="width:144.00px" alt="原卷公式或图表"><img src="../assets/e3e5b93c7ed7ecf7843b.png" style="width:21.00px" alt="原卷公式或图表">值.</p><p>【答案】3</p><p>【解析】</p><p>【分析】本题考查了分式的化简求值，熟练掌握知识点是解题的关键．</p><p>先利用完全平方公式和整式的加法，乘法对分母分子化简，再对<img src="../assets/6555011704951ca0acf8.png" style="width:120.00px" alt="原卷公式或图表">化简得到<img src="../assets/7e3d73da855c835c8835.png" style="width:84.00px" alt="原卷公式或图表">，再整体代入求值即可．</p><p>【详解】解：原式<img src="../assets/eccc20f2c556c39c2e8b.png" style="width:141.00px" alt="原卷公式或图表"></p><p><img src="../assets/ad78e0d09ec4da6ad9e5.png" style="width:108.00px" alt="原卷公式或图表"></p><p><img src="../assets/831866d24d7d0c227951.png" style="width:76.50px" alt="原卷公式或图表">，</p><p>∵<img src="../assets/6555011704951ca0acf8.png" style="width:120.00px" alt="原卷公式或图表">，</p><p>∴<img src="../assets/7e3d73da855c835c8835.png" style="width:84.00px" alt="原卷公式或图表">，</p><p>∴原式<img src="../assets/bf324f56da15ec249564.png" style="width:72.00px" alt="原卷公式或图表">．</p></section></article></body></html>
