article{max-width:100%}</style></head><body><article><h1>2015年北京市中考数学试题 · 数学解答题 第19题 · 对应解析</h1><section data-question="19" id="q19"><p>19．（5分）（2015•北京）解不等式组<img src="../assets/1da1bfba3ab79c4d0b47.png" style="width:198.00px" alt="原卷公式或图表">，并写出它的所有非负整数解．</p><p>【解答】解：<img src="../assets/5771a5a46c280b03eebe.png" style="width:222.00px" alt="原卷公式或图表">，</p><p>由①得：x≥﹣2；</p><p>由②得：x＜<img src="../assets/ae3663b88b234117c064.png" style="width:15.00px" alt="原卷公式或图表">，</p><p>∴不等式组的解集为﹣2≤x＜<img src="../assets/ae3663b88b234117c064.png" style="width:15.00px" alt="原卷公式或图表">，</p><p>则不等式组的所有非负整数解为：0，1，2，3．</p></section></article></body></html>
