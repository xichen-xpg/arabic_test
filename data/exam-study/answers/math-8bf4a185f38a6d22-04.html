article{max-width:100%}</style></head><body><article><h1>2025年北京市中考数学真题 · 数学解答题 第18题 · 对应解析</h1><section data-question="18" id="q18"><p>18. 解不等式组：<img src="../assets/2c72beac41b45328e1a4.png" style="width:160.50px" alt="原卷公式或图表"></p><p>【答案】<img src="../assets/c360cfe5c43eb8de7f4c.png" style="width:97.50px" alt="原卷公式或图表"></p><p>【解析】</p><p>【分析】本题主要考查了解一元一次不等式组，先求出每个不等式的解集，再根据 “同大取大，同小取小，大小小大中间找，大大小小找不到（无解）”求出不等式组的解集即可．</p><p>【详解】解：<img src="../assets/c1dfa68a33b248b294b1.png" style="width:184.50px" alt="原卷公式或图表"></p><p>解不等式①得：<img src="../assets/9c96d52c5651f4726e57.png" style="width:67.50px" alt="原卷公式或图表">，</p><p>解不等式②得：<img src="../assets/78a6325cf6ee1618e01c.png" style="width:49.50px" alt="原卷公式或图表">，</p><p>∴原不等式组的解集为<img src="../assets/c360cfe5c43eb8de7f4c.png" style="width:97.50px" alt="原卷公式或图表">．</p></section></article></body></html>
