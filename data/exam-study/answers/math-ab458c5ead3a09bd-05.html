article{max-width:100%}</style></head><body><article><h1>2018年北京市中考数学试题 · 数学解答题 第19题 · 对应解析</h1><section data-question="19" id="q19"><p>19．（5.00分）解不等式组：<img src="../assets/537b8c1e50c3faca0a27.png" style="width:150.00px" alt="原卷公式或图表"></p><p>【分析】先求出每个不等式的解集，再求出不等式组的解集即可．</p><p>【解答】解：<img src="../assets/853e20dca2b00678a6f9.png" style="width:174.00px" alt="原卷公式或图表"></p><p>∵解不等式①得：x＞﹣2，</p><p>解不等式②得：x＜3，</p><p>∴不等式组的解集为﹣2＜x＜3．</p><p>【点评】本题考查了解一元一次不等式组，能根据不等式的解集得出不等式组的解集是解此题的关键．</p></section></article></body></html>
