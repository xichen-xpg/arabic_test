article{max-width:100%}</style></head><body><article><h1>2016年北京市中考数学试题 · 数学解答题 第18题 · 对应解析</h1><section data-question="18" id="q18"><p>18．（5分）（2016•北京）解不等式组：<img src="../assets/2d176dd8468a215ec40f.png" style="width:174.00px" alt="原卷公式或图表">．</p><p>【解答】解：解不等式2x+5＞3（x﹣1），得：x＜8，</p><p>解不等式4x＞<img src="../assets/8ced5235ce4daacce3a2.png" style="width:43.50px" alt="原卷公式或图表">，得：x＞1，</p><p>∴不等式组的解集为：1＜x＜8．</p></section></article></body></html>
