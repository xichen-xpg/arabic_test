article{max-width:100%}</style></head><body><article><h1>2016年北京市中考数学试题 · 数学解答题 第21题 · 对应解析</h1><section data-question="21" id="q21"><p>21．（5分）（2016•北京）如图，在平面直角坐标系xOy中，过点A（﹣6，0）的直线l<sub>1</sub>与直线l<sub>2</sub>：y=2x相交于点B（m，4）．</p><p>（1）求直线l<sub>1</sub>的表达式；</p><p>（2）过动点P（n，0）且垂于x轴的直线与l<sub>1</sub>，l<sub>2</sub>的交点分别为C，D，当点C位于点D上方时，写出n的取值范围．</p><p><img src="../assets/143ba07661e6c4d10673.png" style="width:280.50px" alt="原卷公式或图表"></p><p>【解答】解：（1）∵点B在直线l<sub>2</sub>上，</p><p>∴4=2m，</p><p>∴m=2，点B（2，4）</p><p>设直线l<sub>1</sub>的表达式为y=kx+b，</p><p>由题意<img src="../assets/385c77c4f71e02b0c70d.png" style="width:114.00px" alt="原卷公式或图表">，解得<img src="../assets/502f04875fd45e985a90.png" style="width:61.50px" alt="原卷公式或图表">，</p><p>∴直线l<sub>1</sub>的表达式为y=<img src="../assets/11bcd0a859a76f7c0735.png" style="width:19.50px" alt="原卷公式或图表">x+3．</p><p>（2）与图象可知n＜2．</p></section></article></body></html>
