article{max-width:100%}</style></head><body><article><h1>2016年北京市中考数学试题 · 数学解答题 第20题 · 对应解析</h1><section data-question="20" id="q20"><p>20．（5分）（2016•北京）关于x的一元二次方程x<sup>2</sup>+（2m+1）x+m<sup>2</sup>﹣1=0有两个不相等的实数根．</p><p>（1）求m的取值范围；</p><p>（2）写出一个满足条件的m的值，并求此时方程的根．</p><p>【解答】解：（1）∵关于x的一元二次方程x<sup>2</sup>+（2m+1）x+m<sup>2</sup>﹣1=0有两个不相等的实数根，</p><p>∴△=（2m+1）<sup>2</sup>﹣4×1×（m<sup>2</sup>﹣1）=4m+5＞0，</p><p>解得：m＞﹣<img src="../assets/da993cdd7254b5c81c9b.png" style="width:19.50px" alt="原卷公式或图表">．</p><p>（2）m=1，此时原方程为x<sup>2</sup>+3x=0，</p><p>即x（x+3）=0，</p><p>解得：x<sub>1</sub>=0，x<sub>2</sub>=﹣3．</p></section></article></body></html>
