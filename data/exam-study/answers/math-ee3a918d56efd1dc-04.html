article{max-width:100%}</style></head><body><article><h1>2017年北京市中考数学试题 · 数学解答题 第18题 · 对应解析</h1><section data-question="18" id="q18"><p>18．（5分）（2017•北京）解不等式组：
<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>{</mo><mrow><mtable><mtr><mtd><mrow><maligngroup></maligngroup><malignmark></malignmark><mn>2</mn><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>＞</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>7</mn></mrow></mtd></mtr><mtr><mtd><mrow><maligngroup></maligngroup><malignmark></malignmark><mfrac><mrow><mi>x</mi><mo>+</mo><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>＞</mo><mn>2</mn><mi>x</mi></mrow></mtd></mtr></mtable></mrow><mo></mo></mrow></math>
．</p><p>【考点】CB：解一元一次不等式组．菁优网版权所有</p><p>【分析】利用不等式的性质，先求出两个不等式的解集，再求其公共解．</p><p>【解答】解：
<math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>{</mo><mrow><mtable><mtr><mtd><mrow><maligngroup></maligngroup><malignmark></malignmark><mn>2</mn><mo>(</mo><mi>x</mi><mo>+</mo><mn>1</mn><mo>)</mo><mo>＞</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>7</mn><mi>①</mi></mrow></mtd></mtr><mtr><mtd><mrow><maligngroup></maligngroup><malignmark></malignmark><mfrac><mrow><mi>x</mi><mo>+</mo><mn>10</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>＞</mo><mn>2</mn><mi>x</mi><mi>②</mi></mrow></mtd></mtr></mtable></mrow><mo></mo></mrow></math>
，</p><p>由①式得x＜3；</p><p>由②式得x＜2，</p><p>所以不等式组的解为x＜2．</p><p>【点评】此题考查解不等式组；求不等式组的解集，要遵循以下原则：同大取较大，同小取较小，小大大小中间找，大大小小解不了．</p></section></article></body></html>
