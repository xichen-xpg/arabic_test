article{max-width:100%}</style></head><body><article><h1>2015年北京市中考数学试题 · 数学解答题 第18题 · 对应解析</h1><section data-question="18" id="q18"><p>18．（5分）（2015•北京）已知2a<sup>2</sup>+3a﹣6=0．求代数式3a（2a+1）﹣（2a+1）（2a﹣1）的值．</p><p>【解答】解：∵2a<sup>2</sup>+3a﹣6=0，即2a<sup>2</sup>+3a=6，</p><p>∴原式=6a<sup>2</sup>+3a﹣4a<sup>2</sup>+1=2a<sup>2</sup>+3a+1=6+1=7．</p></section></article></body></html>
