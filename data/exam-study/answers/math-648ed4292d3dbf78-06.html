article{max-width:100%}</style></head><body><article><h1>2014年北京市中考数学试题 · 数学解答题 第16题 · 对应解析</h1><section data-question="16" id="q16"><p>16．（5分）（2014•北京）已知x﹣y=<img src="../assets/e25c155d4d6d087765c6.png" style="width:30.00px" alt="原卷公式或图表">，求代数式（x+1）<sup>2</sup>﹣2x+y（y﹣2x）的值．</p><p>考点： 整式的混合运算—化简求值．菁优网版权所有</p><p>分析： 先把代数式计算，进一步化简，再整体代入x﹣y=<img src="../assets/e25c155d4d6d087765c6.png" style="width:30.00px" alt="原卷公式或图表">，求得数值即可．</p><p>解答： 解：∵x﹣y=<img src="../assets/2d04cb640e4d6268cb77.png" style="width:30.00px" alt="原卷公式或图表">，</p><p>∴（x+1）<sup>2</sup>﹣2x+y（y﹣2x）</p><p>=x<sup>2</sup>+2x+1﹣2x+y<sup>2</sup>﹣2xy</p><p>=x<sup>2</sup>+y<sup>2</sup>﹣2xy+1</p><p>=（x﹣y）<sup>2</sup>+1</p><p>=（<img src="../assets/2d04cb640e4d6268cb77.png" style="width:30.00px" alt="原卷公式或图表">）<sup>2</sup>+1</p><p>=3+1</p><p>=4．</p><p>点评： 此题考查整式的混合运算与化简求值，注意先化简，再整体代入求值．</p></section></article></body></html>
