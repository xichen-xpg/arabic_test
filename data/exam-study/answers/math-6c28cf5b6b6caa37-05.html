article{max-width:100%}</style></head><body><article><h1>2016年北京市中考数学试题 · 数学解答题 第19题 · 对应解析</h1><section data-question="19" id="q19"><p>19．（5分）（2016•北京）如图，四边形ABCD是平行四边形，AE平分∠BAD，交DC的延长线于点E．求证：DA=DE．</p><p><img src="../assets/07cb0bec6243dc2e34f9.png" style="width:241.50px" alt="原卷公式或图表"></p><p>【解答】证明：∵四边形ABCD是平行四边形，</p><p>∴AB∥CD，</p><p>∴∠E=∠BAE，</p><p>∵AE平分∠BAD，</p><p>∴∠BAE=∠DAE，</p><p>∴∠E=∠DAE，</p><p>∴DA=DE．</p></section></article></body></html>
