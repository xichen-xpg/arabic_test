article{max-width:100%}</style><article><h1>2022年北京市中考数学真题 · 数学解答题 第28题</h1><p>28. 在平面直角坐标系<img src="../assets/5a7ec3f936be0ce94288.png" style="width:47.50px" alt="原卷公式或图表">中，已知点<img src="../assets/b8d44efe5b8e730946ef.png" style="width:113.40px" alt="原卷公式或图表">对于点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">给出如下定义：将点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">向右<img src="../assets/fbbe6d3d6b8c0d0f1cd6.png" style="width:72.00px" alt="原卷公式或图表">或向左<img src="../assets/60246bdeecc931bac8f8.png" style="width:72.00px" alt="原卷公式或图表">平移<img src="../assets/1daec5a4c6f9911714e3.png" style="width:29.10px" alt="原卷公式或图表">个单位长度，再向上<img src="../assets/a8ea9178ae495c64f5bd.png" style="width:70.50px" alt="原卷公式或图表">或向下<img src="../assets/218f8ae41a415d5e9a02.png" style="width:64.30px" alt="原卷公式或图表">平移<img src="../assets/9a80532d71594dc4e197.png" style="width:26.00px" alt="原卷公式或图表">个单位长度，得到点<img src="../assets/5c403d9a28995d42cb3a.png" style="width:30.60px" alt="原卷公式或图表">，点<img src="../assets/5c403d9a28995d42cb3a.png" style="width:30.60px" alt="原卷公式或图表">关于点<img src="../assets/e9a7dd70966ba8904195.png" style="width:29.10px" alt="原卷公式或图表">的对称点为<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:24.50px" alt="原卷公式或图表">，称点<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:24.50px" alt="原卷公式或图表">为点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">的“对应点”．</p><p>（1）如图，点<img src="../assets/90bd6e662743cbfe7c97.png" style="width:78.10px" alt="原卷公式或图表">点<img src="../assets/e9a7dd70966ba8904195.png" style="width:29.10px" alt="原卷公式或图表">在线段<img src="../assets/226d87c7267a3d3d6c80.png" style="width:44.40px" alt="原卷公式或图表">的延长线上，若点<img src="../assets/6e4080b7c372948b620a.png" style="width:91.90px" alt="原卷公式或图表">点<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:24.50px" alt="原卷公式或图表">为点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">的“对应点”．</p><p><img src="../assets/13368be1fc97be825737.png" style="width:447.00px" alt="原卷公式或图表"></p><p>①在图中画出点<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:24.50px" alt="原卷公式或图表">；</p><p>②连接<img src="../assets/339ea029897f5b3708f2.png" style="width:46.00px" alt="原卷公式或图表">交线段<img src="../assets/255dbb2e98657b38dab7.png" style="width:36.80px" alt="原卷公式或图表">于点<img src="../assets/49ea7b42737dfb904bca.png" style="width:24.50px" alt="原卷公式或图表">求证：<img src="../assets/299c6dce86630dce6bfb.png" style="width:128.70px" alt="原卷公式或图表"></p><p>（2）<img src="../assets/0a26f354762929042454.png" style="width:44.40px" alt="原卷公式或图表">的半径为1，<img src="../assets/c82ef4c26f65ac10c507.png" style="width:29.10px" alt="原卷公式或图表">是<img src="../assets/0a26f354762929042454.png" style="width:44.40px" alt="原卷公式或图表">上一点，点<img src="../assets/e9a7dd70966ba8904195.png" style="width:29.10px" alt="原卷公式或图表">在线段<img src="../assets/226d87c7267a3d3d6c80.png" style="width:44.40px" alt="原卷公式或图表">上，且<img src="../assets/a2ed0077719bd75c8850.png" style="width:170.00px" alt="原卷公式或图表">，若<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">为<img src="../assets/0a26f354762929042454.png" style="width:44.40px" alt="原卷公式或图表">外一点，点<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:24.50px" alt="原卷公式或图表">为点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:23.00px" alt="原卷公式或图表">的“对应点”，连接<img src="../assets/daf23d2162b91ff7b075.png" style="width:44.40px" alt="原卷公式或图表">当点<img src="../assets/c82ef4c26f65ac10c507.png" style="width:29.10px" alt="原卷公式或图表">在<img src="../assets/0a26f354762929042454.png" style="width:44.40px" alt="原卷公式或图表">上运动时直接写出<img src="../assets/03f04d011d117a535bb0.png" style="width:36.80px" alt="原卷公式或图表">长的最大值与最小值的差（用含<img src="../assets/f6a5985a74ee796ba475.png" style="width:15.30px" alt="原卷公式或图表">的式子表示）</p></article></html>
