article{max-width:100%}</style><article><h1>2026年北京市中考语文试题 · 名著阅读 第14题</h1><p><b>三、名著阅读（5分）</b></p><p>14. 探索就是多方寻求答案、解决疑问。经典作品常常有探索自然、社会、人生的内容。从《朝花夕拾》《海底两万里》《红星照耀中国》《昆虫记》中<span class="emphasis">任选一部</span>，谈谈你读出的相关内容以及从中获得的启迪。（要求：写出书中人物产生的疑问、探索的过程和你得到的启迪。100字左右）</p></article></html>
