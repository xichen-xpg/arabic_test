article{max-width:100%}</style><article><h1>2020年北京市中考数学试题 · 数学解答题 第27题</h1><p>27.在<img src="../assets/a0524f134e83a2ab1467.png" style="width:67.60px" alt="原卷公式或图表">中，<img src="../assets/0bda7c7e9ad91393813a.png" style="width:100.40px" alt="原卷公式或图表">，<img src="../assets/4590edb6e1b2946f9017.png" style="width:97.60px" alt="原卷公式或图表">，<img src="../assets/6b57e23d36b9adcdd9f9.png" style="width:24.90px" alt="原卷公式或图表">是<img src="../assets/1e2b2505e3ee7fff8f61.png" style="width:40.40px" alt="原卷公式或图表">的中点．<img src="../assets/200cb778aac87e67dc06.png" style="width:23.90px" alt="原卷公式或图表">为直线<img src="../assets/c65b68be4ef1d956117e.png" style="width:42.40px" alt="原卷公式或图表">上一动点，连接<img src="../assets/02f15ba1915550a5687d.png" style="width:41.90px" alt="原卷公式或图表">，过点<img src="../assets/6b57e23d36b9adcdd9f9.png" style="width:24.90px" alt="原卷公式或图表">作<img src="../assets/26c5cc6df45891c66f51.png" style="width:105.00px" alt="原卷公式或图表">，交直线<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">于点<img src="../assets/bb2b04a1e9826027c6d4.png" style="width:25.50px" alt="原卷公式或图表">，连接<img src="../assets/202adffaa8c55dbadedc.png" style="width:38.90px" alt="原卷公式或图表">．</p><p><img src="../assets/d470c6591fe70ff5fde4.png" style="width:409.50px" alt="原卷公式或图表"></p><p>（1）如图1，当<img src="../assets/200cb778aac87e67dc06.png" style="width:23.90px" alt="原卷公式或图表">是线段<img src="../assets/c65b68be4ef1d956117e.png" style="width:42.40px" alt="原卷公式或图表">的中点时，设<img src="../assets/b6c7220299f6ee87bd64.png" style="width:76.50px" alt="原卷公式或图表">，<img src="../assets/77b991920d71a8d05760.png" style="width:76.50px" alt="原卷公式或图表">，求<img src="../assets/202adffaa8c55dbadedc.png" style="width:38.90px" alt="原卷公式或图表">的长（用含<img src="../assets/d2098085ccb868f2b205.png" style="width:40.00px" alt="原卷公式或图表">的式子表示）；</p><p>（2）当点<img src="../assets/200cb778aac87e67dc06.png" style="width:23.90px" alt="原卷公式或图表">在线段<img src="../assets/dac3f3e86449c5349d82.png" style="width:37.40px" alt="原卷公式或图表">的延长线上时，依题意补全图2，用等式表示线段<img src="../assets/3a4048aba8c1d56daeec.png" style="width:38.90px" alt="原卷公式或图表">，<img src="../assets/202adffaa8c55dbadedc.png" style="width:38.90px" alt="原卷公式或图表">，<img src="../assets/da1001c684875c65a778.png" style="width:38.90px" alt="原卷公式或图表">之间的数量关系，并证明．</p></article></html>
