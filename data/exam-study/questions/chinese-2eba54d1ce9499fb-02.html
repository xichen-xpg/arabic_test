article{max-width:100%}</style><article><h1>2025年北京市中考语文真题 · 默写 第8题</h1><p><b>（一）默写（共4分）</b></p><p>8. 默写填空。</p><p>①纷纷暮雪下辕门，______。（岑参《白雪歌送武判官归京》）</p><p>②亭亭净植，______<img src="../assets/1baf20f8af57cc611c65.png" style="width:20.00px" alt="原卷公式或图表">（周敦颐《爱莲说》）</p><p>③古人常用竹子制作乐器，很多乐器名称使用带“竹字头”的字。如古诗词中的“_______”一句，就出现了这样的乐器名称。（本试卷中出现的句子除外）</p></article></html>
