article{max-width:100%}</style><article><h1>2020年北京市中考化学试题 · 选择题 第1、2、3、4、5题</h1><p><b>每小题</b><b>1</b><b>分。在每小题给出的四个选项中，选出最符合题目要求的一项。</b></p><p>1. 为预防骨质疏松，应给人体补充的元素是</p><p>A. 钙<span class="tab"></span>B. 铁<span class="tab"></span>C. 锌<span class="tab"></span>D. 碘</p><p>2.下列气体中，能供给动植物呼吸的是</p><p>A. O<sub>2</sub><span class="tab"></span>B. H<sub>2</sub><span class="tab"></span>C. N<sub>2</sub><span class="tab"></span>D. CO<sub>2</sub></p><p>3.下列含金属元素的物质是</p><p>A. H<sub>2</sub>S<span class="tab"></span>B. P<sub>2</sub>O<sub>5</sub><span class="tab"></span>C. AgNO<sub>3</sub><span class="tab"></span>D. H<sub>2</sub>O</p><p>4.下列不属于铁丝在氧气中燃烧现象的是</p><p>A. 放出热量<span class="tab"></span>B. 产生大量白烟</p><p>C. 火星四射<span class="tab"></span>D. 生成黑色固体</p><p>5.下列操作不正确<img src="../assets/3b9bb2e9d74e539f4d5b.png" style="width:21.00px" alt="原卷公式或图表">是</p><p>A<img src="../assets/d73d6909a87944b67d1d.png" style="width:4.90px" alt="原卷公式或图表"> 稀释浓硫酸<img src="../assets/4590fe89b3d730659f04.png" style="width:211.50px" alt="原卷公式或图表"><span class="tab"></span>B. 点燃酒精灯<img src="../assets/851ac1b700835119c67f.png" style="width:120.00px" alt="原卷公式或图表"></p><p>C. 加热液体<img src="../assets/94a7a645dede91014b73.png" style="width:193.50px" alt="原卷公式或图表"><span class="tab"></span>D. 取用固体粉末<img src="../assets/64ee42d8d022a0b5646f.png" style="width:171.00px" alt="原卷公式或图表"></p></article></html>
