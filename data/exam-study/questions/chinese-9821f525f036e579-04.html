article{max-width:100%}</style><article><h1>2019年北京市中考语文试题 · 名著阅读 第5题</h1><p><b>三、名著阅读（</b><b>5</b><b>分）</b></p><p>5．（5分）阅读一部名著时，个性鲜明的人物、曲折起伏的情节、纷繁多样的人情世态……都可能引发你的阅读兴趣。请结合一部名著的内容，说出是什么引发了你的阅读兴趣，并简要说明这一兴趣是如何促使你阅读这部名著的。（100字左右）</p></article></html>
