article{max-width:100%}</style><article><h1>2019年北京市中考语文试题 · 默写 第2题</h1><p>2．（4分）默写。</p><p>（1）子夏曰：“博学而笃志，切问而近思，<u>　</u><u>   </u><u>　</u>”（《论语•子张》）</p><p>（2）莫笑农家腊酒浑，<u>　</u><u>   </u><u>　</u>。山重水复疑无路，<u>　</u><u>   </u><u>　</u>。（陆游《游山西村》）</p><p>（3）在北海公园里游览，当你看到具有中国传统建筑风格的五龙亭，你能联想到的带有“亭”（或“楼”“阁”）字的一句古诗是“<u>　</u><u>   </u><u>　</u>”。（允许有一个不会写的字用拼音替代）</p><p><img src="../assets/2058f0d9dcf71363f379.png" style="width:331.50px" alt="原卷公式或图表"></p></article></html>
