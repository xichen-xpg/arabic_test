article{max-width:100%}</style><article><h1>2018年北京市中考化学真题 · 选择题 第1、2、3、4、5题</h1><p>1. 下列物质能使紫色石蕊溶液变红的是<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>A. CO<sub>2</sub><span class="tab"></span>B. O<sub>2</sub><span class="tab"></span>C. NaCl<span class="tab"></span>D. NaOH<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>2. 下列含金属元素的物质是<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>A. H<sub>2</sub>SO<sub>4</sub><span class="tab"></span>B. Al<sub>2</sub>O<sub>3</sub><span class="tab"></span>C. NO<sub>2</sub><span class="tab"></span>D. P<sub>2</sub>O<sub>5</sub><img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>3. 一些物质的pH范围如下，其中呈碱性的是<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>A. 油污净（12～13）<span class="tab"></span>B. 西瓜汁（5～6）<span class="tab"></span>C. 洁厕灵（1～2）<span class="tab"></span>D. 橘子汁（3～4）<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>4. 下列金属不能与CuSO<sub>4</sub>溶液反应的是<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>A. Ag<span class="tab"></span>B. Fe<span class="tab"></span>C. Zn<span class="tab"></span>D. Al<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>5. 下列操作不正确的是<img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表"></p><p>A. <img src="../assets/1b9a40c19efa607b7877.png" style="width:202.50px" alt="原卷公式或图表">稀释<span class="tab"></span>B. <img src="../assets/a582770d6c0ea241c7e2.png" style="width:195.00px" alt="原卷公式或图表"><img src="../assets/ab8e14b3a9bcb80ee293.png" style="width:2.50px" alt="原卷公式或图表">取药<span class="tab"></span>C. <img src="../assets/494df26ab3898b28a562.png" style="width:205.50px" alt="原卷公式或图表">称量<span class="tab"></span>D. <img src="../assets/0c9e4a07b30c6c5c5126.png" style="width:180.00px" alt="原卷公式或图表">过滤</p></article></html>
