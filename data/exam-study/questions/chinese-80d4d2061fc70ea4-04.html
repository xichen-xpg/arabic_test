article{max-width:100%}</style><article><h1>2024年北京市中考语文真题 · 名著阅读 第14题</h1><p><b>三、名著阅读（</b><b>5</b><b>分）</b></p><p>14. 小说中的场景与人物形象关系密切。从《水浒传》《西游记》《骆驼祥子》《钢铁是怎样炼成的》《简·爱》中任选一部，说说场景对塑造人物形象的作用。（要求：写出某一人物所处的两处场景，分别解释场景与人物形象的关系，写出场景变换中人物形象的变化。100字左右）</p></article></html>
