article{max-width:100%}</style><article><h1>2026年北京市中考数学试卷 · 数学解答题 第28题</h1><p>28. 对于不共线的三点A，B，C，连接<img src="../assets/7d93528e246e44bc3629.png" style="width:40.70px" alt="原卷公式或图表">，<img src="../assets/1e1220d6738d4c6fed8c.png" style="width:42.00px" alt="原卷公式或图表">，并作劣弧<img src="../assets/72f4bd91c84a9539b7d4.png" style="width:40.50px" alt="原卷公式或图表">，使得<img src="../assets/72f4bd91c84a9539b7d4.png" style="width:40.50px" alt="原卷公式或图表">所在圆的圆心在过点A且与<img src="../assets/dfd3fbcbbfa725f32720.png" style="width:41.00px" alt="原卷公式或图表">平行的直线上，称由<img src="../assets/7d93528e246e44bc3629.png" style="width:40.70px" alt="原卷公式或图表">，<img src="../assets/1e1220d6738d4c6fed8c.png" style="width:42.00px" alt="原卷公式或图表">和<img src="../assets/72f4bd91c84a9539b7d4.png" style="width:40.50px" alt="原卷公式或图表">组成的图形为单弧三角形，记作<img src="../assets/147127e0a609aa50f3bd.png" style="width:100.50px" alt="原卷公式或图表">，其中<img src="../assets/72f4bd91c84a9539b7d4.png" style="width:40.50px" alt="原卷公式或图表">所在圆的圆心称为<img src="../assets/147127e0a609aa50f3bd.png" style="width:100.50px" alt="原卷公式或图表">的弧心．</p><p>在平面直角坐标系<img src="../assets/3d3161fde58ba473b551.png" style="width:48.00px" alt="原卷公式或图表">中，</p><p><img src="../assets/97e6cbbf46e2408752c7.png" style="width:541.50px" alt="原卷公式或图表"></p><p>（1）如图1，点<img src="../assets/5353cb991103127ac3d1.png" style="width:100.50px" alt="原卷公式或图表">，<img src="../assets/a1ed8bd26cea2ce25ed8.png" style="width:85.50px" alt="原卷公式或图表">，<img src="../assets/2eba853eda3b7d1f8b27.png" style="width:70.50px" alt="原卷公式或图表">，直接写出<img src="../assets/147127e0a609aa50f3bd.png" style="width:100.50px" alt="原卷公式或图表">的弧心的坐标及<img src="../assets/72f4bd91c84a9539b7d4.png" style="width:40.50px" alt="原卷公式或图表">的长；</p><p>（2）如图2，点<img src="../assets/fd966b5a10e09773e717.png" style="width:120.00px" alt="原卷公式或图表">，<img src="../assets/d83ddceaa68ce3a7a4c1.png" style="width:78.00px" alt="原卷公式或图表">，当<img src="../assets/72e4538a9633877ca391.png" style="width:102.00px" alt="原卷公式或图表">的弧心为O时，求点F的坐标；</p><p>（3）已知点<img src="../assets/75f8387eca2507277577.png" style="width:79.50px" alt="原卷公式或图表">，对于平面内的点N，存在点P，Q满足<img src="../assets/21995ed333659b95fb00.png" style="width:105.00px" alt="原卷公式或图表">和<img src="../assets/1681e9088975e4b341a1.png" style="width:105.00px" alt="原卷公式或图表">的弧心均为O，<img src="../assets/e5a925678238e4901004.png" style="width:73.50px" alt="原卷公式或图表">和<img src="../assets/97d8fb00347b5b587167.png" style="width:84.00px" alt="原卷公式或图表">都不是钝角三角形，且<img src="../assets/9aaa939d988662e77126.png" style="width:72.40px" alt="原卷公式或图表">，记N的横坐标为t，直接写出t的取值范围．</p></article></html>
