article{max-width:100%}</style><article><h1>2019年北京市中考数学试题 · 数学解答题 第25题</h1><p>25. 在平面直角坐标系<img src="../assets/d5e7d48ecec4224df73f.png" style="width:52.50px" alt="原卷公式或图表">中，直线l：<img src="../assets/5ab60fa7439664b0b68c.png" style="width:190.50px" alt="原卷公式或图表">与直线<img src="../assets/2e1e0f4fe174c22e0e6d.png" style="width:63.00px" alt="原卷公式或图表">，直线<img src="../assets/cc687e1c1893a138d20b.png" style="width:82.50px" alt="原卷公式或图表">分别交于点A，B，直线<img src="../assets/2e1e0f4fe174c22e0e6d.png" style="width:63.00px" alt="原卷公式或图表">与直线<img src="../assets/cc687e1c1893a138d20b.png" style="width:82.50px" alt="原卷公式或图表">交于点<img src="../assets/2e6c0fea48fcd1d57aef.png" style="width:27.00px" alt="原卷公式或图表">．</p><p>（1）求直线<img src="../assets/6442007d9029a65864ad.png" style="width:16.50px" alt="原卷公式或图表">与<img src="../assets/30fff7097da1f357aa25.png" style="width:24.00px" alt="原卷公式或图表">轴的交点坐标；</p><p>（2）横、纵坐标都是整数的点叫做整点．记线段<img src="../assets/920fb3f438b44113f71b.png" style="width:166.50px" alt="原卷公式或图表">围成的区域（不含边界）为<img src="../assets/d160db9b9f057146eaa8.png" style="width:33.00px" alt="原卷公式或图表">．</p><p>①当<img src="../assets/82b85de26cdceeba77db.png" style="width:63.00px" alt="原卷公式或图表">时，结合函数图象，求区域<img src="../assets/d160db9b9f057146eaa8.png" style="width:33.00px" alt="原卷公式或图表">内的整点个数；</p><p>②若区域<img src="../assets/d160db9b9f057146eaa8.png" style="width:33.00px" alt="原卷公式或图表">内没有整点，直接写出<img src="../assets/03851fca702c8be6eb5e.png" style="width:22.50px" alt="原卷公式或图表">的取值范围．</p></article></html>
