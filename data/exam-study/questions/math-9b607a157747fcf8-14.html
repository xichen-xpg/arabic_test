article{max-width:100%}</style><article><h1>2023年北京市中考数学真题 · 数学解答题 第28题</h1><p>28. 在平面直角坐标系<img src="../assets/5a7ec3f936be0ce94288.png" style="width:48.00px" alt="原卷公式或图表">中，<img src="../assets/0a26f354762929042454.png" style="width:45.00px" alt="原卷公式或图表">的半径为1．对于<img src="../assets/0a26f354762929042454.png" style="width:45.00px" alt="原卷公式或图表">的弦<img src="../assets/ce340af071fa1f89d63c.png" style="width:40.50px" alt="原卷公式或图表">和<img src="../assets/0a26f354762929042454.png" style="width:45.00px" alt="原卷公式或图表">外一点C给出如下定义：</p><p>若直线<img src="../assets/1aef4ccb258ef9ef815e.png" style="width:37.50px" alt="原卷公式或图表">，<img src="../assets/3ef601075af6e6d738ba.png" style="width:39.00px" alt="原卷公式或图表">中一条经过点O，另一条是<img src="../assets/0a26f354762929042454.png" style="width:45.00px" alt="原卷公式或图表">的切线，则称点C是弦<img src="../assets/ce340af071fa1f89d63c.png" style="width:40.50px" alt="原卷公式或图表">的“关联点”．</p><p><img src="../assets/a7d4ea72b62649a15f3d.png" style="width:190.50px" alt="原卷公式或图表"></p><p>（1）如图，点<img src="../assets/12010863590728ce2d39.png" style="width:76.50px" alt="原卷公式或图表">，<img src="../assets/ed370d2885e2a1650911.png" style="width:151.50px" alt="原卷公式或图表">，<img src="../assets/a264d1210f5053ac5fba.png" style="width:153.00px" alt="原卷公式或图表"></p><p>①在点<img src="../assets/e7312ec5373ec97e4c97.png" style="width:90.00px" alt="原卷公式或图表">，<img src="../assets/6434417d30e4ea0c9009.png" style="width:114.00px" alt="原卷公式或图表">，<img src="../assets/c161ba4a11a1493e9445.png" style="width:103.50px" alt="原卷公式或图表">中，弦<img src="../assets/c25aea9adb2d476ea86f.png" style="width:42.00px" alt="原卷公式或图表">的“关联点”是______．</p><p>②若点C是弦<img src="../assets/e762d97ae6bdd40a2ad1.png" style="width:46.50px" alt="原卷公式或图表">的“关联点”，直接写出<img src="../assets/777c5f4329814dac86a2.png" style="width:42.00px" alt="原卷公式或图表">的长；</p><p>（2）已知点<img src="../assets/86765498a98570c9cf2e.png" style="width:84.00px" alt="原卷公式或图表">，<img src="../assets/ae7b55a5ee620636acca.png" style="width:121.50px" alt="原卷公式或图表">．对于线段<img src="../assets/6b9937425f0c93f7e293.png" style="width:46.50px" alt="原卷公式或图表">上一点S，存在<img src="../assets/0a26f354762929042454.png" style="width:45.00px" alt="原卷公式或图表">的弦<img src="../assets/03f04d011d117a535bb0.png" style="width:36.00px" alt="原卷公式或图表">，使得点S是弦<img src="../assets/03f04d011d117a535bb0.png" style="width:36.00px" alt="原卷公式或图表">的“关联点”，记<img src="../assets/03f04d011d117a535bb0.png" style="width:36.00px" alt="原卷公式或图表">的长为t，当点S在线段<img src="../assets/6b9937425f0c93f7e293.png" style="width:46.50px" alt="原卷公式或图表">上运动时，直接写出t的取值范围．</p><p><br></p></article></html>
