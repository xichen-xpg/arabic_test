article{max-width:100%}</style><article><h1>2021年北京市中考语文试题 · 默写 第5题</h1><p><b>（一）默写。（共</b><b>4</b><b>分）</b></p><p>5. （1）采菊东篱下，____________<img src="../assets/39a71f6c382994860da4.png" style="width:20.00px" alt="原卷公式或图表">（陶渊明《饮酒》）</p><p>（2）是故_____________，教然后知困。（《礼记》）</p><p>（3）同学们参观革命纪念馆，被先烈们忧家国、求真理、无惧牺牲的事迹深深感动。请从古诗文中选择两句来表现先烈们的精神，你选择的是“①________，②_________”。（本试卷中出现的句子除外。每句中允许有一个不会写的字用拼音替代）</p></article></html>
