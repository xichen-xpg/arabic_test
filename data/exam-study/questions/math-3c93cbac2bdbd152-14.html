article{max-width:100%}</style><article><h1>2019年北京市中考数学试题 · 数学解答题 第28题</h1><p>28．在△ABC中，<img src="../assets/9a9e157343fee674b97f.png" style="width:30.00px" alt="原卷公式或图表">，<img src="../assets/dde0f9f2287ff0e37243.png" style="width:25.50px" alt="原卷公式或图表">分别是<img src="../assets/e7ae5980780475b9bed6.png" style="width:82.50px" alt="原卷公式或图表">两边的中点，如果<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">上的所有点都在△ABC的内部或边上，则称<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">为△ABC的中内弧．例如，下图中<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">是△ABC的一条中内弧．</p><p><img src="../assets/ac4826493760f31357df.png" style="width:417.00px" alt="原卷公式或图表"></p><p>（1）如图，在Rt△ABC中，<img src="../assets/379c711a9f002b19368f.png" style="width:276.00px" alt="原卷公式或图表">分别是<img src="../assets/cc7f750cf77a76e4d0a2.png" style="width:106.50px" alt="原卷公式或图表">的中点．画出△ABC的最长的中内弧<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">，并直接写出此时<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">的长；</p><p><img src="../assets/ac1799c1a1e850bf10d9.png" style="width:453.00px" alt="原卷公式或图表"></p><p>（2）在平面直角坐标系中，已知点<img src="../assets/b92ea14e294fc85e9934.png" style="width:385.50px" alt="原卷公式或图表">，在△ABC中，<img src="../assets/475f4da3433288023eee.png" style="width:73.50px" alt="原卷公式或图表">分别是<img src="../assets/cc7f750cf77a76e4d0a2.png" style="width:106.50px" alt="原卷公式或图表">的中点．</p><p>①若<img src="../assets/bf12f1d128a076dd6a31.png" style="width:61.50px" alt="原卷公式或图表">，求△ABC的中内弧<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">所在圆的圆心<img src="../assets/a9f0af947c08d3d91007.png" style="width:25.50px" alt="原卷公式或图表">的纵坐标的取值范围；</p><p>②若在△ABC中存在一条中内弧<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">，使得<img src="../assets/631baf341f2f3eddc3d9.png" style="width:36.00px" alt="原卷公式或图表">所在圆的圆心<img src="../assets/a9f0af947c08d3d91007.png" style="width:25.50px" alt="原卷公式或图表">在△ABC的内部或边上，直接写出t的取值范围．</p></article></html>
