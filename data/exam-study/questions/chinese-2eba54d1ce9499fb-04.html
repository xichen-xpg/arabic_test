article{max-width:100%}</style><article><h1>2025年北京市中考语文真题 · 名著阅读 第14题</h1><p><b>三、名著阅读（5分）</b></p><p>14. 把相关人物形象联系起来阅读，有助于深入理解作品主题。如《水浒传》中的林冲、鲁达、杨志，《骆驼祥子》中的祥子、老马、二强子，《钢铁是怎样炼成的》中的保尔、朱赫来、谢廖沙，每组人物形象都可以建立联系。请你从上述三组中选择一组，比较人物形象的异同，说明这组人物形象的联系对深化作品主题的作用。（100字左右）</p></article></html>
