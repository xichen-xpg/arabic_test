article{max-width:100%}</style><article><h1>2022年北京市中考数学真题 · 选择题 第6、7、8题</h1><p>6. 若关于<img src="../assets/2f0be08d48d0d72aa489.png" style="width:18.40px" alt="原卷公式或图表">的一元二次方程<img src="../assets/7458005852c0de4f9e53.png" style="width:142.50px" alt="原卷公式或图表">有两个相等的实数根，则实数<img src="../assets/a1c7594fe496f5f548f9.png" style="width:26.00px" alt="原卷公式或图表">的值为（    ）</p><p>A. <img src="../assets/78486467a6e8b00a77c7.png" style="width:32.20px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/4ae97007241f1c9a89e2.png" style="width:39.80px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/1e113b59ca379d5a334f.png" style="width:24.50px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/0249de8793f359c8cc56.png" style="width:19.90px" alt="原卷公式或图表"></p><p>7. 图中的图形为轴对称图形，该图形的对称轴的条数为（    ）</p><p><img src="../assets/a121d57ee552132df866.png" style="width:148.50px" alt="原卷公式或图表"></p><p>A. <img src="../assets/a688f6769b94abf6bc25.png" style="width:13.80px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/47252f6dca6dd58c0326.png" style="width:19.90px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/24156d0bb4d3a2fe4060.png" style="width:18.40px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/2589c9b5826bcbe093f5.png" style="width:18.40px" alt="原卷公式或图表"></p><p>8. 下面的三个问题中都有两个变量：</p><p>①汽车从A地匀速行驶到B地，汽车的剩余路程y与行驶时间x；</p><p>②将水箱中<img src="../assets/e3e5b93c7ed7ecf7843b.png" style="width:21.00px" alt="原卷公式或图表">水匀速放出，直至放完，水箱中的剩余水量y与放水时间x；</p><p>③用长度一定的绳子围成一个矩形，矩形的面积y与一边长x，其中，变量y与变量x之间的函数关系可以利用如图所示的图象表示的是（    ）</p><p><img src="../assets/fc7483415e3563f69c8f.png" style="width:273.00px" alt="原卷公式或图表"></p><p>A. ①②<span class="tab"></span>B. ①③<span class="tab"></span>C. ②③<span class="tab"></span>D. ①②③</p></article></html>
