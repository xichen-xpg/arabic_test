article{max-width:100%}</style><article><h1>2022年北京市中考语文真题 · 默写 第7题</h1><p>7. 默写。</p><p>（1）箫鼓追随春社近，________。（陆游《游山西村》）</p><p>（2）山不在高，________。（刘禹锡《陋室铭》）</p><p>（3）制作“立德修身”主题班会宣传海报，同学们要摘引两句与主题相关的古诗文，你建议选用“_____，_____”。（本试卷中出现的句子除外。每句中允许有一个不会写的字用拼音替代）</p><p><b>（二）（共</b><b>5</b><b>分）</b></p><p>阅读《饮酒（其五）》，完成下面小题。</p><p>饮酒（其五）</p><p>陶渊明</p><p>结庐在人境，而无车马喧。</p><p>问君何能尔？心远地自偏。</p><p>采菊东篱下，悠然见南山。</p><p>山气日夕佳，飞鸟相与还。</p><p>此中有真意，欲辨已忘言。</p></article></html>
