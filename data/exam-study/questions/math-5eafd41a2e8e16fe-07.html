article{max-width:100%}</style><article><h1>2015年北京市中考数学试题 · 数学解答题 第21题</h1><p>21．（5分）（2015•北京）为解决“最后一公里”的交通接驳问题，北京市投放了大量公租自行车供市民使用．到2013年底，全市已有公租自行车25 000辆，租赁点600个．预计到2015年底，全市将有公租自行车50 000辆，并且平均每个租赁点的公租自行车数量是2013年底平均每个租赁点的公租自行车数量的1.2倍．预计到2015年底，全市将有租赁点多少个？</p></article></html>
