article{max-width:100%}</style><article><h1>2019年北京市中考数学试题 · 数学解答题 第27题</h1><p>27．已知<img src="../assets/ecf9a3ae00a501209562.png" style="width:148.50px" alt="原卷公式或图表">，H为射线OA上一定点，<img src="../assets/5f946606d72a115882b2.png" style="width:147.00px" alt="原卷公式或图表">，P为射线OB上一点，M为线段OH上一动点，连接PM，满足<img src="../assets/0a2c11145abdcd653cb2.png" style="width:90.00px" alt="原卷公式或图表">为钝角，以点P为中心，将线段PM顺时针旋转<img src="../assets/b7509f4953ef711bac86.png" style="width:57.00px" alt="原卷公式或图表">，得到线段PN，连接ON．</p><p>（1）依题意补全图1；</p><p>（2）求证：<img src="../assets/0f901a7da211bd7e0953.png" style="width:196.50px" alt="原卷公式或图表">；</p><p>（3）点M关于点H的对称点为Q，连接QP．写出一个OP的值，使得对于任意的点M总有ON=QP，并证明．</p><p><img src="../assets/b0695cc1cb8306be1e8b.png" style="width:799.50px" alt="原卷公式或图表"></p></article></html>
