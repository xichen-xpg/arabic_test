article{max-width:100%}</style><article><h1>2019年北京市中考数学试题 · 数学解答题 第22题</h1><p>22．在平面内，给定不在同一直线上的点A，B，C，如图所示．点O到点A，B，C的距离均等于a（a为常数），到点O的距离等于a的所有点组成图形G，<img src="../assets/ba9bb1ca7c66b2e25c98.png" style="width:82.50px" alt="原卷公式或图表">的平分线交图形G于点D，连接AD，CD．</p><p>（1）求证：AD=CD；</p><p>（2）过点D作DE<img src="../assets/81a09963549145e59734.png" style="width:25.50px" alt="原卷公式或图表">BA，垂足为E，作DF<img src="../assets/81a09963549145e59734.png" style="width:25.50px" alt="原卷公式或图表">BC，垂足为F，延长DF交图形G于点M，连接CM．若AD=CM，求直线DE与图形G的公共点个数．</p><p><img src="../assets/b8aa49dfd51ecb79cc46.png" style="width:478.50px" alt="原卷公式或图表"></p></article></html>
