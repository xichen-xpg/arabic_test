article{max-width:100%}</style><article><h1>2020年北京市中考化学试题 · 选择题 第11、12题</h1><p>11.利用如图装置验证了空气中氧气的含量。下列叙述不正确的是</p><p><img src="../assets/90f585862c3b691dc040.png" style="width:222.00px" alt="原卷公式或图表"><br></p><p>A. 实验前需检查装置气密性</p><p>B. 白磷的作用是消耗试管中的氧气</p><p>C. 白磷熄火、试管冷却后再打开止水夹</p><p>D. 最终量筒中液面约降至40mL刻度线处</p><p>12.甲酸（HCOOH）具有清洁制氢的巨大潜力，其分解前后分子种类变化的微观示意图如下：</p><p><img src="../assets/91a92b0402a06a7a0039.png" style="width:616.60px" alt="原卷公式或图表"></p><p>下列说法正确的是</p><p>A. 甲酸分子中氢、氧原子个数比为1:2</p><p>B. 乙中碳、氧元素质量比为1：2</p><p>C. 46g甲酸中氢元素质量为2g</p><p>D. 生成甲与乙的分子个数比为2：1</p></article></html>
