article{max-width:100%}</style><article><h1>2019年北京市中考数学试题 · 数学解答题 第26题</h1><p>26．在平面直角坐标系<img src="../assets/a4bb6c68ff44f4cac32d.png" style="width:58.50px" alt="原卷公式或图表">中，抛物线<img src="../assets/ca925946b70d692d4aa9.png" style="width:186.00px" alt="原卷公式或图表">与<img src="../assets/ed00754c663a19d3eb82.png" style="width:24.00px" alt="原卷公式或图表">轴交于点A，将点A向右平移2个单位长度，得到点B，点B在抛物线上．</p><p>（1）求点B的坐标（用含<img src="../assets/e4a5571a89cb1bd4b927.png" style="width:22.50px" alt="原卷公式或图表">的式子表示）；</p><p>（2）求抛物线的对称轴；</p><p>（3）已知点<img src="../assets/be347b85ccd68c10d941.png" style="width:112.50px" alt="原卷公式或图表">，<img src="../assets/535fcc5177119f7c0e8c.png" style="width:84.00px" alt="原卷公式或图表">．若抛物线与线段PQ恰有一个公共点，结合函数图象，求<img src="../assets/e4a5571a89cb1bd4b927.png" style="width:22.50px" alt="原卷公式或图表">的取值范围．</p></article></html>
