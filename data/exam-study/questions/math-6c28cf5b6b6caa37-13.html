article{max-width:100%}</style><article><h1>2016年北京市中考数学试题 · 数学解答题 第27题</h1><p>27．（7分）（2016•北京）在平面直角坐标系xOy中，抛物线y=mx<sup>2</sup>﹣2mx+m﹣1（m＞0）与x轴的交点为A，B．</p><p>（1）求抛物线的顶点坐标；</p><p>（2）横、纵坐标都是整数的点叫做整点．</p><p>①当m=1时，求线段AB上整点的个数；</p><p>②若抛物线在点A，B之间的部分与线段AB所围成的区域内（包括边界）恰有6个整点，结合函数的图象，求m的取值范围．</p><p><img src="../assets/55da488ed44fbe32dc48.png" style="width:318.00px" alt="原卷公式或图表"></p></article></html>
