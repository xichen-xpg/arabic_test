article{max-width:100%}</style><article><h1>2015年北京市中考数学试题 · 数学解答题 第27题</h1><p>27．（7分）（2015•北京）在平面直角坐标系xOy中，过点（0，2）且平行于x轴的直线，与直线y=x﹣1交于点A，点A关于直线x=1的对称点为B，抛物线C<sub>1</sub>：y=x<sup>2</sup>+bx+c经过点A，B．</p><p>（1）求点A，B的坐标；</p><p>（2）求抛物线C<sub>1</sub>的表达式及顶点坐标；</p><p>（3）若抛物线C<sub>2</sub>：y=ax<sup>2</sup>（a≠0）与线段AB恰有一个公共点，结合函数的图象，求a的取值范围．</p><p><img src="../assets/62261ce6ed91290464d2.png" style="width:316.10px" alt="原卷公式或图表"></p></article></html>
