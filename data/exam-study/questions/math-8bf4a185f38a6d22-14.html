article{max-width:100%}</style><article><h1>2025年北京市中考数学真题 · 数学解答题 第28题</h1><p>28. 在平面直角坐标系<img src="../assets/5a7ec3f936be0ce94288.png" style="width:48.00px" alt="原卷公式或图表">中，对于点<img src="../assets/45af683a217969d603db.png" style="width:21.00px" alt="原卷公式或图表">和<img src="../assets/93e1fa9df1dd21b13b24.png" style="width:43.50px" alt="原卷公式或图表">给出如下定义：若<img src="../assets/93e1fa9df1dd21b13b24.png" style="width:43.50px" alt="原卷公式或图表">上存在两个不同的点<img src="../assets/54c6d7d04f2069b1c749.png" style="width:31.50px" alt="原卷公式或图表">，<img src="../assets/e9a7dd70966ba8904195.png" style="width:28.50px" alt="原卷公式或图表">，对于<img src="../assets/93e1fa9df1dd21b13b24.png" style="width:43.50px" alt="原卷公式或图表">上任意满足<img src="../assets/d6a339b10b1ef0791322.png" style="width:97.50px" alt="原卷公式或图表">的两个不同的点<img src="../assets/b50a169f781fd09a8eb8.png" style="width:19.50px" alt="原卷公式或图表">，<img src="../assets/7a0604c3476e27c8a6d0.png" style="width:21.00px" alt="原卷公式或图表">，都有<img src="../assets/35c4e9ed1ab693632022.png" style="width:168.00px" alt="原卷公式或图表">，则称点<img src="../assets/45af683a217969d603db.png" style="width:21.00px" alt="原卷公式或图表">是<img src="../assets/93e1fa9df1dd21b13b24.png" style="width:43.50px" alt="原卷公式或图表">的关联点，称<img src="../assets/655d8b5d51f3a4092be5.png" style="width:84.00px" alt="原卷公式或图表">的大小为点<img src="../assets/45af683a217969d603db.png" style="width:21.00px" alt="原卷公式或图表">与<img src="../assets/93e1fa9df1dd21b13b24.png" style="width:43.50px" alt="原卷公式或图表">的关联角度．（本定义中的角均指锐角、直角、钝角或平角）</p><p>（1）如图，<img src="../assets/0a26f354762929042454.png" style="width:43.50px" alt="原卷公式或图表">的半径为<img src="../assets/a688f6769b94abf6bc25.png" style="width:13.50px" alt="原卷公式或图表">．</p><p><img src="../assets/8e9bc2476da0f90c6a5c.png" style="width:255.00px" alt="原卷公式或图表"></p><p>①在点<img src="../assets/80dde7f74c5887acf784.png" style="width:91.50px" alt="原卷公式或图表">，<img src="../assets/534e0e35a47efe019ee8.png" style="width:94.50px" alt="原卷公式或图表">，<img src="../assets/edde6dc0a6dae674ce22.png" style="width:82.50px" alt="原卷公式或图表">中，点_______是<img src="../assets/0a26f354762929042454.png" style="width:43.50px" alt="原卷公式或图表">的关联点且其与<img src="../assets/0a26f354762929042454.png" style="width:43.50px" alt="原卷公式或图表">的关联角度小于<img src="../assets/334f1605b0724f0cc771.png" style="width:40.50px" alt="原卷公式或图表">，该点与<img src="../assets/0a26f354762929042454.png" style="width:43.50px" alt="原卷公式或图表">的关联角度为<img src="../assets/f205d40fa94da3aae262.png" style="width:106.50px" alt="原卷公式或图表">；</p><p>②点<img src="../assets/ff4e6763a825a14ae4a5.png" style="width:78.00px" alt="原卷公式或图表">在第一象限，若对于任意长度小于<img src="../assets/a688f6769b94abf6bc25.png" style="width:13.50px" alt="原卷公式或图表">的线段<img src="../assets/d335e5124c2b9429e5b9.png" style="width:40.50px" alt="原卷公式或图表">，<img src="../assets/d335e5124c2b9429e5b9.png" style="width:40.50px" alt="原卷公式或图表">上所有的点都是<img src="../assets/0a26f354762929042454.png" style="width:43.50px" alt="原卷公式或图表">的关联点，则<img src="../assets/a1c7594fe496f5f548f9.png" style="width:22.50px" alt="原卷公式或图表">的最小值为_______；</p><p>（2）已知点<img src="../assets/b5345e1551576719fe1b.png" style="width:229.50px" alt="原卷公式或图表">，<img src="../assets/6ca9fef043aa99e8b20c.png" style="width:42.00px" alt="原卷公式或图表">经过原点，线段<img src="../assets/946a41a1bd2ff8901244.png" style="width:40.50px" alt="原卷公式或图表">上所有的点都是<img src="../assets/6ca9fef043aa99e8b20c.png" style="width:42.00px" alt="原卷公式或图表">的关联点，记这些点与<img src="../assets/6ca9fef043aa99e8b20c.png" style="width:42.00px" alt="原卷公式或图表">的关联角度的最大值为<img src="../assets/de6e271bacf36b940b89.png" style="width:24.00px" alt="原卷公式或图表">．若<img src="../assets/9b144dfc715137a7ccc4.png" style="width:145.50px" alt="原卷公式或图表">，直接写出<img src="../assets/f6a5985a74ee796ba475.png" style="width:13.50px" alt="原卷公式或图表">的取值范围．</p><p><br></p></article></html>
