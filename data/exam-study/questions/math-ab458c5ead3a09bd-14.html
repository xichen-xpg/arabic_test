article{max-width:100%}</style><article><h1>2018年北京市中考数学试题 · 数学解答题 第28题</h1><p>28．（7.00分）对于平面直角坐标系xOy中的图形M，N，给出如下定义：P为图形M上任意一点，Q为图形N上任意一点，如果P，Q两点间的距离有最小值，那么称这个最小值为图形M，N间的“闭距离“，记作d（M，N）．</p><p>已知点A（﹣2，6），B（﹣2，﹣2），C（6，﹣2）．</p><p>（1）求d（点O，△ABC）；</p><p>（2）记函数y=kx（﹣1≤x≤1，k≠0）的图象为图形G．若d（G，△ABC）=1，直接写出k的取值范围；</p><p>（3）⊙T的圆心为T（t，0），半径为1．若d（⊙T，△ABC）=1，直接写出t的取值范围．</p></article></html>
