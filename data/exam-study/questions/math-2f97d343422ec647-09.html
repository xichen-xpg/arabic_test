article{max-width:100%}</style><article><h1>2026年北京市中考数学试卷 · 数学解答题 第23题</h1><p>23. 若干名学生参加编程比赛，比赛共8轮，每轮有3道题，每人每轮的得分为该轮答对题目的数量（得分为整数）．已知甲、乙两名学生8轮得分的情况如下：</p><p><img src="../assets/7bd8bb7a8cc9bd0c9fb3.png" style="width:778.50px" alt="原卷公式或图表"></p><p>根据以上信息，回答下列问题：</p><p>（1）甲8轮得分的平均数为________，乙8轮得分的平均数为________；</p><p>（2）记甲、乙8轮得分的方差分别为<img src="../assets/95b42d32e6aca50d0f22.png" style="width:28.50px" alt="原卷公式或图表">和<img src="../assets/ce2cd40ab7c4cdbc7d3c.png" style="width:30.00px" alt="原卷公式或图表">，则<img src="../assets/95b42d32e6aca50d0f22.png" style="width:28.50px" alt="原卷公式或图表">________<img src="../assets/ce2cd40ab7c4cdbc7d3c.png" style="width:30.00px" alt="原卷公式或图表">（填“<img src="../assets/f2f2a67839eecffab065.png" style="width:19.50px" alt="原卷公式或图表">”“<img src="../assets/4b471fd639e499fae79e.png" style="width:19.80px" alt="原卷公式或图表">”或“<img src="../assets/91a97e644b3f44addca3.png" style="width:19.50px" alt="原卷公式或图表">”）；</p><p>（3）如果丙8轮得分的中位数为<img src="../assets/d7feee437d12a3cd9999.png" style="width:37.50px" alt="原卷公式或图表">，那么丙8轮得分的平均数是不是一定大于乙8轮得分的平均数？若是，请说明理由；若不是，请举出反例．</p></article></html>
