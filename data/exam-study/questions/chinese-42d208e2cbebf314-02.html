article{max-width:100%}</style><article><h1>2020年北京市中考语文试题 · 默写 第6题</h1><p><b>（一）默写。（共</b><b>4</b><b>分）</b></p><p>6.（1）其必曰“___________，后天下之乐而乐”乎！（范仲淹《岳阳楼记》）</p><p>（2）___________，阴阳割昏晓。（杜甫《望岳》</p><p>（3）座右铭是用来激励、警醒自己的格言。如果用两句古诗作为你的座右铭，你选用的诗句是“_______，______”。（本试卷中出现的诗句除外。每句诗中允许有一个不会写的字用拼音替代）</p></article></html>
