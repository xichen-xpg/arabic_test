article{max-width:100%}</style><article><h1>2014年北京市中考数学试题 · 数学解答题 第23题</h1><p>23．（7分）（2014•北京）在平面直角坐标系xOy中，抛物线y=2x<sup>2</sup>+mx+n经过点A（0，﹣2），B（3，4）．</p><p>（1）求抛物线的表达式及对称轴；</p><p>（2）设点B关于原点的对称点为C，点D是抛物线对称轴上一动点，记抛物线在A，B之间的部分为图象G（包含A，B两点）．若直线CD 与图象G有公共点，结合函数图象，求点D纵坐标t的取值范围．</p><p><img src="../assets/1426d4e01a3740a9c224.png" style="width:358.60px" alt="原卷公式或图表"></p></article></html>
