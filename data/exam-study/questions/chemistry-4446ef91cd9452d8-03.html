article{max-width:100%}</style><article><h1>2022年北京市中考化学真题 · 选择题 第11、12、13、14、15题</h1><p><b>氧在自然界中广泛存在。回答下列</b><b>3</b><b>个小题。</b></p><p>11. 下列符号中，表示两个氧原子的是</p><p>A. O<sub>2</sub><span class="tab"></span>B. 2O<span class="tab"></span>C. O<sup>2-</sup><span class="tab"></span>D. 2O<sub>2</sub></p><p>12. 下列氧气的性质中，属于化学性质的是</p><p>A. 无色无味<span class="tab"></span>B. 沸点低<span class="tab"></span>C. 能支持燃烧<span class="tab"></span>D. 不易溶于水</p><p>13. 下列不属于氧气用途的是</p><p>A. 气焊<span class="tab"></span>B. 食品防腐<span class="tab"></span>C. 供给呼吸<span class="tab"></span>D. 医疗急救</p><p>14. 下列操作不正确的是</p><p>A. 检查气密性<img src="../assets/78ad2b67a83f9b4e9954.png" style="width:181.50px" alt="原卷公式或图表"><span class="tab"></span>B. 倾倒液体<img src="../assets/4d35c161942abe8cef91.png" style="width:201.00px" alt="原卷公式或图表"></p><p>C. 加热液体<img src="../assets/ffd3be4546335e4c2f2c.png" style="width:189.00px" alt="原卷公式或图表"><span class="tab"></span>D. 取用固体粉末<img src="../assets/711b367e3feac8de6133.png" style="width:181.50px" alt="原卷公式或图表"></p><p>15. 下列物质放入水中能形成溶液<img src="../assets/e3e5b93c7ed7ecf7843b.png" style="width:21.00px" alt="原卷公式或图表">是</p><p>A. 蔗糖<span class="tab"></span>B. 泥土<span class="tab"></span>C. 面粉<span class="tab"></span>D. 花生油</p></article></html>
