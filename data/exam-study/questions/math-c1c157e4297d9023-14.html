article{max-width:100%}</style><article><h1>2021年北京市中考数学试题 · 数学解答题 第28题</h1><p>28. 在平面直角坐标系<img src="../assets/0aafeba237b45d46642e.png" style="width:48.00px" alt="原卷公式或图表">中，<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表">的半径为1，对于点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">和线段<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">，给出如下定义：若将线段<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">绕点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">旋转可以得到<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表">的弦<img src="../assets/e1dc72b5b59c06aff310.png" style="width:49.50px" alt="原卷公式或图表">（<img src="../assets/5337bf4b9d260ce6f84e.png" style="width:58.50px" alt="原卷公式或图表">分别是<img src="../assets/a445daa245e8dfb0a19d.png" style="width:49.50px" alt="原卷公式或图表">的对应点），则称线段<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">是<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表">的以点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">为中心的“关联线段”．</p><p><img src="../assets/5640cc51717fe8c58580.png" style="width:460.50px" alt="原卷公式或图表"></p><p>（1）如图，点<img src="../assets/444faacaadded104b4bf.png" style="width:213.00px" alt="原卷公式或图表">的横､纵坐标都是整数．在线段<img src="../assets/1c1dbc4031ad531390c7.png" style="width:158.00px" alt="原卷公式或图表">中，<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表">的以点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">为中心的“关联线段”是______________；</p><p>（2）<img src="../assets/dffaa76e0de7f90936dc.png" style="width:75.60px" alt="原卷公式或图表">是边长为1的等边三角形，点<img src="../assets/d29dfae715832913a6a4.png" style="width:72.60px" alt="原卷公式或图表">，其中<img src="../assets/7a2b9f3326cee58b0131.png" style="width:46.50px" alt="原卷公式或图表">．若<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">是<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表">的以点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">为中心的“关联线段”，求<img src="../assets/b08b90060925510a79e6.png" style="width:13.90px" alt="原卷公式或图表">的值；</p><p>（3）在<img src="../assets/dffaa76e0de7f90936dc.png" style="width:75.60px" alt="原卷公式或图表">中，<img src="../assets/db36cbb7220ff3a18c5f.png" style="width:132.00px" alt="原卷公式或图表">．若<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">是<img src="../assets/94113c23dd064f340ad9.png" style="width:44.20px" alt="原卷公式或图表"><img src="../assets/3b9bb2e9d74e539f4d5b.png" style="width:21.00px" alt="原卷公式或图表">以点<img src="../assets/85df4a6cfe176143dd67.png" style="width:24.00px" alt="原卷公式或图表">为中心的“关联线段”，直接写出<img src="../assets/931aa6d3cbf81f20769a.png" style="width:38.40px" alt="原卷公式或图表">的最小值和最大值，以及相应的<img src="../assets/ee64c24f5f1473ba05a6.png" style="width:40.40px" alt="原卷公式或图表">长．</p></article></html>
