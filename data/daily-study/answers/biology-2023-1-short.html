.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考生物 第1题 解析</h1><p>1. 除病毒外，生物体结构和功能的基本单位是（ ）</p><p>A. 组织<span class="tab"></span>B. 细胞<span class="tab"></span>C. 器官<span class="tab"></span>D. 系统</p><p>【答案】B</p><p>【解析】</p><p>【分析】除病毒外细胞是生物体结构和功能的基本单位，是进行生命活动的基本场所。</p><p>【详解】除病毒外细胞是生物体结构和功能的基本单位，生物体由细胞构成组织，组织构成器官，器官构成系统，进而构成生物体。</p><p>【点睛】细胞是生命活动的基本结构和功能单位。</p></article></html>
