.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第32题 解析</h1><p>32. 下图是<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">的制取和性质实验。</p><p><img src="../assets/de8ac2ea9c83b8cc8709.png" style="width:420.00px" alt="原卷公式或图表">  </p><p>（1）实验1，仪器a的名称是_____，制取<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">的化学方程式为_____。</p><p>（2）实验2，观察到铁丝剧烈燃烧、_____、生成黑色固体。</p><p>【答案】（1）    ①<img src="../assets/66cd8841bf25728b865a.png" style="width:5.00px" alt="原卷公式或图表"> 集气瓶    ②. <img src="../assets/3f58f421f1dba039db1f.png" style="width:343.50px" alt="原卷公式或图表"><br>    （2）火星四射</p><p>【解析】</p><p>【小问1详解】</p><p>由图可知，仪器a为集气瓶；</p><p>制取氧气的反应为高锰酸钾受热分解生成锰酸钾、二氧化锰和氧气，该反应的化学方程式为：<img src="../assets/3f58f421f1dba039db1f.png" style="width:343.50px" alt="原卷公式或图表">；</p><p>【小问2详解】</p><p>实验2中铁丝在氧气中剧烈燃烧、火星四射、生成黑色固体。</p></article></html>
