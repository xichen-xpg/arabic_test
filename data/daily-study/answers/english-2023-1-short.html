<!doctype html><html lang="zh"><meta charset="utf-8"><title>2023年北京中考英语 第1题 解析</title><style>body{margin:0;color:#17202a;background:#fff;font-family:"SimSun","Times New Roman",serif}

.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考英语 第1题 解析</h1><p>1. My sister enjoys singing and ________ favorite subject is music.</p><p>A. his<span class="tab"></span>B. her<span class="tab"></span>C. your<span class="tab"></span>D. their</p><p>【答案】B</p><p>【解析】</p><p>【详解】句意：我妹妹喜欢唱歌，她最喜欢的科目是音乐。</p><p>考查代词辨析。his他的；her她的；your你的；their他们的。根据“My sister enjoys singing”可知此处指“我妹妹”最喜欢的科目，用her。故选B。</p></article></html>
