.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第6题 解析</h1><p>6. 下列物质的性质属于化学性质的是</p><p>A. 铁呈固态<span class="tab"></span>B. 铜呈紫红色<span class="tab"></span>C. 蔗糖易溶于水<span class="tab"></span>D. 碳酸易分解</p><p>【答案】D</p><p>【解析】</p><p>【详解】A、铁呈固态，状态不需要通过化学变化就能表现出来，属于物理性质；</p><p>B、铜呈紫红色，颜色不需要通过化学变化就能表现出来，属于物理性质；</p><p>C、蔗糖易溶于水，溶解性不需要通过化学变化就能表现出来，属于物理性质；</p><p>D、碳酸易分解，需要通过化学变化才能表现出来，属于化学性质。</p><p>故选D。</p></article></html>
