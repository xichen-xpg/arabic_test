.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第15题 解析</h1><p>15. 如图，<img src="../assets/877106a49487fbcff4b8.png" style="width:37.50px" alt="原卷公式或图表">是<img src="../assets/2543bf1e9b736258f50b.png" style="width:45.00px" alt="原卷公式或图表">的半径，<img src="../assets/8185b2bed97eb8cbc704.png" style="width:40.50px" alt="原卷公式或图表">是<img src="../assets/2543bf1e9b736258f50b.png" style="width:45.00px" alt="原卷公式或图表">的弦，<img src="../assets/a5574c29378da490ecae.png" style="width:97.50px" alt="原卷公式或图表">于点D，<img src="../assets/f6d7835ebaa8323471f9.png" style="width:40.50px" alt="原卷公式或图表">是<img src="../assets/2543bf1e9b736258f50b.png" style="width:45.00px" alt="原卷公式或图表">的切线，<img src="../assets/f6d7835ebaa8323471f9.png" style="width:40.50px" alt="原卷公式或图表">交<img src="../assets/7f36bf399c9f5cfe2b83.png" style="width:42.00px" alt="原卷公式或图表">的延长线于点E．若<img src="../assets/a99b873a3c164ff4d46b.png" style="width:118.50px" alt="原卷公式或图表">，<img src="../assets/a0e7765b992678f0ebb7.png" style="width:76.50px" alt="原卷公式或图表">，则线段<img src="../assets/f6d7835ebaa8323471f9.png" style="width:40.50px" alt="原卷公式或图表">的长为______．</p><p><img src="../assets/79b5cee114cd27797c77.png" style="width:313.50px" alt="原卷公式或图表">  </p><p>【答案】<img src="../assets/c173e084471fdb007d18.png" style="width:39.00px" alt="原卷公式或图表"></p><p>【解析】</p><p>【分析】根据<img src="../assets/a5574c29378da490ecae.png" style="width:97.50px" alt="原卷公式或图表">，得出<img src="../assets/ee6d1a2b0cffb0b5c8c5.png" style="width:133.50px" alt="原卷公式或图表">，<img src="../assets/3be862b2834f3fea321e.png" style="width:153.00px" alt="原卷公式或图表">，根据等腰直角三角形的性质得出<img src="../assets/33927f534f6558c37e6d.png" style="width:190.50px" alt="原卷公式或图表">，即<img src="../assets/ae3ce6d1f08f17fdf6f1.png" style="width:150.00px" alt="原卷公式或图表">，根据<img src="../assets/eb35ae3642f604e94f8c.png" style="width:130.50px" alt="原卷公式或图表">，<img src="../assets/a99b873a3c164ff4d46b.png" style="width:118.50px" alt="原卷公式或图表">，得出<img src="../assets/a7977c40c776e97fa389.png" style="width:78.00px" alt="原卷公式或图表">为等腰直角三角形，即可得出<img src="../assets/0134be1b560823a6eb70.png" style="width:154.50px" alt="原卷公式或图表">．</p><p>【详解】解：∵<img src="../assets/a5574c29378da490ecae.png" style="width:97.50px" alt="原卷公式或图表">，</p><p>∴<img src="../assets/ee6d1a2b0cffb0b5c8c5.png" style="width:133.50px" alt="原卷公式或图表">，<img src="../assets/3be862b2834f3fea321e.png" style="width:153.00px" alt="原卷公式或图表">．</p><p>∵<img src="../assets/a99b873a3c164ff4d46b.png" style="width:118.50px" alt="原卷公式或图表">，</p><p>∴<img src="../assets/76cff9555edaf4dd681c.png" style="width:72.00px" alt="原卷公式或图表">为等腰直角三角形，</p><p>∴<img src="../assets/33927f534f6558c37e6d.png" style="width:190.50px" alt="原卷公式或图表">，</p><p>∴<img src="../assets/ae3ce6d1f08f17fdf6f1.png" style="width:150.00px" alt="原卷公式或图表">．</p><p>∵<img src="../assets/f6d7835ebaa8323471f9.png" style="width:40.50px" alt="原卷公式或图表">是<img src="../assets/2543bf1e9b736258f50b.png" style="width:45.00px" alt="原卷公式或图表">的切线，</p><p>∴<img src="../assets/eb35ae3642f604e94f8c.png" style="width:130.50px" alt="原卷公式或图表">，</p><p>∵<img src="../assets/a99b873a3c164ff4d46b.png" style="width:118.50px" alt="原卷公式或图表">，</p><p>∴<img src="../assets/a7977c40c776e97fa389.png" style="width:78.00px" alt="原卷公式或图表">为等腰直角三角形，</p><p>∴<img src="../assets/0134be1b560823a6eb70.png" style="width:154.50px" alt="原卷公式或图表">．</p><p>故答案为：<img src="../assets/c173e084471fdb007d18.png" style="width:39.00px" alt="原卷公式或图表">．</p><p>【点睛】本题主要考查了垂径定理，等腰直角三角形的判定和性质，切线的性质，解题的关键是熟练掌握垂径定理，得出<img src="../assets/3be862b2834f3fea321e.png" style="width:153.00px" alt="原卷公式或图表">．</p></article></html>
