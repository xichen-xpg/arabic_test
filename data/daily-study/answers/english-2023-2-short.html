.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考英语 第2题 解析</h1><p>2. It’s a good idea to visit Beijing ________ October.</p><p>A. at<span class="tab"></span>B. on<span class="tab"></span>C. in<span class="tab"></span>D. to</p><p>【答案】C</p><p>【解析】</p><p>【详解】句意：在十月份参观北京是个好主意。</p><p>考查时间介词。at后接具体时刻等；on后接具体某一天等；in后接年月等；to到。根据“October”可知此处表示在十月，用介词in。故选C。</p></article></html>
