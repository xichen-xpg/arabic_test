.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第9题 解析</h1><p>9. 我国近代化学先驱徐寿创造了部分元素的汉语名称。下列元素名称与符号<span class="emphasis">不一致</span>的是</p><p>A. 钠(Na)<span class="tab"></span>B. 钙(Ca)<span class="tab"></span>C. 镁(Zn)<span class="tab"></span>D. 锰(Mn)</p><p>【答案】C</p><p>【解析】</p><p>【详解】A、钠的元素符号表示为Na，故A正确，不符合题意；</p><p>B、钙的元素符号表示为Ca，故B正确，不符合题意；</p><p>C、镁的元素符号表示为Mg，锌的元素符号表示为Zn，故C错误，符合题意；</p><p>D、锰的元素符号表示为Mn，故D正确，不符合题意；</p><p>故选C。</p></article></html>
