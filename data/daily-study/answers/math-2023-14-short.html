.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第14题 解析</h1><p>14. 如图，直线AD，BC交于点O，<img src="../assets/6800e25d4fd8b33503ba.png" style="width:148.50px" alt="原卷公式或图表">.若<img src="../assets/6168ef985fffdcf77db3.png" style="width:78.00px" alt="原卷公式或图表">，<img src="../assets/2bd5e0051453f7cda345.png" style="width:72.00px" alt="原卷公式或图表">，<img src="../assets/0626b6fa6ca6318cf66f.png" style="width:76.50px" alt="原卷公式或图表">.则<img src="../assets/2e57a62783bd97fc0f5f.png" style="width:43.50px" alt="原卷公式或图表">的值为______．</p><p><img src="../assets/e25fe38ebb4cfaeb87ee.png" style="width:340.50px" alt="原卷公式或图表">  </p><p>【答案】<img src="../assets/858fe958e86312f5a926.png" style="width:24.00px" alt="原卷公式或图表"></p><p>【解析】</p><p>【分析】由平行线分线段成比例可得，<img src="../assets/29ae4e098d0619c84da0.png" style="width:148.50px" alt="原卷公式或图表">，<img src="../assets/0bbf640f87df931db724.png" style="width:145.50px" alt="原卷公式或图表">，得出<img src="../assets/55c275daacf5995b7d43.png" style="width:109.50px" alt="原卷公式或图表">，<img src="../assets/53961107f4b7c60e67b5.png" style="width:109.50px" alt="原卷公式或图表">，从而<img src="../assets/f4570d12c9cf186030e0.png" style="width:211.50px" alt="原卷公式或图表">.</p><p>【详解】<img src="../assets/86f433efe060b6f55f07.png" style="width:162.00px" alt="原卷公式或图表">，   <img src="../assets/6168ef985fffdcf77db3.png" style="width:78.00px" alt="原卷公式或图表">，<img src="../assets/2bd5e0051453f7cda345.png" style="width:72.00px" alt="原卷公式或图表">，</p><p><img src="../assets/c3d2eb9e46f890a42fd2.png" style="width:166.50px" alt="原卷公式或图表">，</p><p><img src="../assets/ed2bf535db1ce74b3314.png" style="width:127.50px" alt="原卷公式或图表">，</p><p><img src="../assets/66260506c253e70a71b3.png" style="width:166.50px" alt="原卷公式或图表">，</p><p><img src="../assets/cbe1249e6c88451fba06.png" style="width:114.00px" alt="原卷公式或图表">，</p><p><img src="../assets/58e9595aa72cb2106a84.png" style="width:229.50px" alt="原卷公式或图表">；</p><p>故答案为：<img src="../assets/7f24972b5e4b0a3accae.png" style="width:24.00px" alt="原卷公式或图表">.</p><p>【点睛】本题考查了平行线分线段成比例的知识点，根据平行线分线段成比例找出线段之间的关系是解决本题的关键.</p></article></html>
