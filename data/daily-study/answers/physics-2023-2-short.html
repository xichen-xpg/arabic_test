.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第2题 解析</h1><p>2. 如图所示的光现象，由于光的反射形成的是（　　）</p><p>A. <img src="../assets/0e7600e9112bae707970.png" style="width:183.00px" alt="原卷公式或图表">  桥在水中形成倒影</p><p>B. <img src="../assets/e2bb93074ecbdb997e29.png" style="width:181.50px" alt="原卷公式或图表">  墙上呈现人的影子</p><p>C. <img src="../assets/eb0a84a0a723da1a0007.png" style="width:183.00px" alt="原卷公式或图表">  筷子好像在水面处弯折</p><p>D. <img src="../assets/eadd1c9700fea3ad5e01.png" style="width:183.00px" alt="原卷公式或图表">  放大镜把字放大</p><p>【答案】A</p><p>【解析】</p><p>【详解】A．桥在水中形成倒影，属于平面镜成像现象，是由光的反射形成的，故A符合题意；</p><p>B．墙上呈现人的影子，是由于光的直线传播形成的，故B不符合题意；</p><p>C．筷子好像在水面处弯折，是由于光的折射形成的，故C不符合题意；</p><p>D．放大镜是凸透镜，凸透镜成像成像是由光<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">折射形成的，故D不符合题意。</p><p>故选A。</p></article></html>
