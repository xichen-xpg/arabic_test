.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第7题 解析</h1><p>7. 先后两次抛掷同一枚质地均匀的硬币，则第一次正面向上、第二次反面向上的概率是（    ）</p><p>A. <img src="../assets/54f90d0adf077d9d6524.png" style="width:24.00px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/51c85ad7991a5f77f890.png" style="width:22.50px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/101676c373fc15f79f22.png" style="width:21.00px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/4f12328adb4a5715f939.png" style="width:24.00px" alt="原卷公式或图表"></p><p>【答案】A</p><p>【解析】</p><p>【分析】整个实验分两步完成，每步有两个等可能结果，用列表法或树状图工具辅助处理．</p><p>【详解】<img src="../assets/6823542d88a2085e85e7.png" style="width:340.50px" alt="原卷公式或图表">  </p><p>如图，所有结果有4种，满足要求的结果有1种，故概率为<img src="../assets/54f90d0adf077d9d6524.png" style="width:24.00px" alt="原卷公式或图表">. </p><p>故选：A</p><p>【点睛】本题考查概率的计算，运用树状图或列表工具是解题的关键．</p></article></html>
