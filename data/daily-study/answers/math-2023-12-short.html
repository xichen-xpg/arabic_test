.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第12题 解析</h1><p>12. 在平面直角坐标系<img src="../assets/3a4e102add4085864500.png" style="width:48.00px" alt="原卷公式或图表">中，若函数<img src="../assets/bacf53a96cc168d066ff.png" style="width:132.00px" alt="原卷公式或图表">的图象经过点<img src="../assets/b147a697049fdc8eb4d6.png" style="width:90.00px" alt="原卷公式或图表">和<img src="../assets/d864a8603d1c4c0acd9f.png" style="width:96.00px" alt="原卷公式或图表">，则m的值为______．</p><p>【答案】3</p><p>【解析】</p><p>【分析】先把点A坐标代入求出反比例函数解析式，再把点B代入即可求出m的值．</p><p>【详解】解：∵函数<img src="../assets/bacf53a96cc168d066ff.png" style="width:132.00px" alt="原卷公式或图表">的图象经过点<img src="../assets/b147a697049fdc8eb4d6.png" style="width:90.00px" alt="原卷公式或图表">和<img src="../assets/d864a8603d1c4c0acd9f.png" style="width:96.00px" alt="原卷公式或图表"></p><p>∴把点<img src="../assets/b147a697049fdc8eb4d6.png" style="width:90.00px" alt="原卷公式或图表">代入得<img src="../assets/2264c49e6144c9f8af6e.png" style="width:151.50px" alt="原卷公式或图表">，</p><p>∴反比例函数解析式为<img src="../assets/a5094f62eba5ff7a95c4.png" style="width:73.50px" alt="原卷公式或图表">，</p><p>把点<img src="../assets/d864a8603d1c4c0acd9f.png" style="width:96.00px" alt="原卷公式或图表">代入得：<img src="../assets/8a0a4d6b00ed6311fd92.png" style="width:75.00px" alt="原卷公式或图表">，</p><p>解得：<img src="../assets/06a95a2d9448dfd8ebce.png" style="width:60.00px" alt="原卷公式或图表">，</p><p>故答案为：3．</p><p>【点睛】本题考查了待定系数法求反比例函数解析式，反比例函数图象上点的坐标特征，熟知反比例函数图象上的点的坐标一定满足函数解析式是解题的关键．</p></article></html>
