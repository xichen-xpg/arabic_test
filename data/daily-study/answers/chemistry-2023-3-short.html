.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第3题 解析</h1><p>3. 下列行为<span class="emphasis">不符合</span>“低碳”理念的是</p><p>A. 自备购物布袋<span class="tab"></span>B. 按需取餐不浪费</p><p>C. 减少使用一次性餐具<span class="tab"></span>D. 教室人空未关灯</p><p>【答案】D</p><p>【解析】</p><p>【详解】A、自备购物布袋，可以减少塑料制品的使用，减少白色污染，符合“低碳”理念，不符合题意； </p><p>B、按需取餐不浪费，可以节约资源，符合“低碳”理念，不符合题意； </p><p>C、减少使用一次性餐具，可以节约资源，符合“低碳”理念，不符合题意； </p><p>D、教室人空未关灯，会造成能源的浪费，不符合“低碳”理念，符合题意。</p><p>故选D。</p></article></html>
