.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第5题 解析</h1><p>5. 垃圾分类，利国利民。塑料瓶属于</p><p>A. 可回收物<span class="tab"></span>B. 其他垃圾<span class="tab"></span>C. 厨余垃圾<span class="tab"></span>D. 有害垃圾</p><p>【答案】A</p><p>【解析】</p><p>【详解】塑料瓶可回收再利用，属于可回收物。</p><p>故选A。</p></article></html>
