.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考生物 第17题 解析</h1><p>17. 人类精子与卵细胞结合成受精卵的场所是（    ）</p><p>A. 卵巢<span class="tab"></span>B. 输卵管<span class="tab"></span>C. 子宫<span class="tab"></span>D. 胎盘</p><p>【答案】B</p><p>【解析】</p><p>【分析】女性的生殖系统的组成：</p><p><img src="../assets/f64ba957e9ffd4c96f09.png" style="width:327.00px" alt="原卷公式或图表"></p><p>【详解】女性的生殖系统主要包括卵巢、输卵管、子宫、阴道等。卵巢是女性的主要性器官，也是女性的性腺，能够产生卵细胞和分泌雌性激素；输卵管能输送卵细胞，是受精和胚胎初期发育的场所；子宫是胚胎和胎儿发育及产生月经的场所；阴道是精子进入和胎儿产出的通道。</p><p>故选B。</p></article></html>
