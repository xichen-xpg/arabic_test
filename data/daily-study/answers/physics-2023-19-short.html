.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第19题 解析</h1><p>19. 如图所示，两个相同瓶子的瓶口相对，之间用一块玻璃板隔开，上面的瓶中装有空气，下面的瓶中装有密度比空气大的红棕色二氧化氮气体。抽掉玻璃板后，可以看到：________，这属于扩散现象。</p><p><img src="../assets/59e46870dee5ddf635bf.png" style="width:151.50px" alt="原卷公式或图表">  </p><p>【答案】两个瓶子内的气体逐渐混合，颜色变得均匀</p><p>【解析】</p><p>【详解】分子永不停息地做无规则运动，抽掉玻璃板后，可以看到：两个瓶子内的气体逐渐混合，颜色变得均匀。</p></article></html>
