.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第5题 解析</h1><p>5. 将某种金属制成的勺放入15℃的水中，金属勺没有熔化；将该金属勺放入45℃的水中，发现金属勺逐渐熔化。该金属的熔点可能是（　　）</p><p>A. 10℃<span class="tab"></span>B. 30℃<span class="tab"></span>C. 50℃<span class="tab"></span>D. 60℃</p><p>【答案】B</p><p>【解析】</p><p>【详解】金属属于晶体，其温度达到熔点并且继续吸热时，金属就会融化。根据题目表述此金属的熔点在15℃到45℃之间，故B符合题意，ACD不符合题意。</p><p>故选B。</p></article></html>
