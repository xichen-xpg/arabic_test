.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第1题 解析</h1><p>1. 下列物品通常情况下属于导体的是（　　）</p><p>A. 纸杯<span class="tab"></span>B. 瓷碗<span class="tab"></span>C. 铁锅<span class="tab"></span>D. 木铲</p><p>【答案】C</p><p>【解析】</p><p>【详解】纸杯、瓷碗、木铲都不容易导电，是绝缘体；铁锅容易导电，是导体，故C符合题意，ABD不符合题意。</p><p>故选C。</p></article></html>
