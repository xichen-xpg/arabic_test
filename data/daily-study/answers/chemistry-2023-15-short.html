.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第15题 解析</h1><p>15. 下列物质均可用作燃料，在<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">中充分燃烧时，<span class="emphasis">不会</span>产生<img src="../assets/f3f3eb63ff839ad77c43.png" style="width:48.00px" alt="原卷公式或图表">的是</p><p>A. <img src="../assets/b54a72946ca4a7af2841.png" style="width:49.50px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/b44a4fe6ff877a92b595.png" style="width:49.50px" alt="原卷公式或图表"><span class="tab"></span>C. 木炭<span class="tab"></span>D. CO</p><p>【答案】B</p><p>【解析】</p><p>【分析】根据质量守恒定律，化学反应前后，元素的种类不变，在氧气中充分燃烧产生二氧化碳，说明该物质一定含有碳元素。</p><p>【详解】A、甲烷在氧气中充分燃烧生成二氧化碳和水，不符合题意；</p><p>B、根据质量守恒定律，化学反应前后，元素的种类不变，氨气中不含碳元素，所以在氧气中充分燃烧不会产生二氧化碳，符合题意；</p><p>C、木炭在氧气中充分燃烧生成二氧化碳，不符合题意；</p><p>D、一氧化碳在氧气中充分燃烧生成二氧化碳，不符合题意；</p><p>故选B。</p></article></html>
