.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第4题 解析</h1><p>4. 2023年3月1日《北京市节水条例》正式实施。下列做法<span class="emphasis">不利于</span>节水的是</p><p>A. 用淘米水浇花<span class="tab"></span>B. 水管跑冒滴漏及时维修</p><p>C. 选用节水龙头<span class="tab"></span>D. 洗手打香皂时不关水龙头</p><p>【答案】D</p><p>【解析】</p><p>【详解】A、用淘米水浇花，可以节约用水，故选项做法有利于节水；</p><p>B、水管跑冒滴漏及时维修，可以节约用水，故选项做法有利于节水；</p><p>C、选用节水龙头，可以节约用水，故选项做法有利于节水；</p><p>D、洗手打香皂时不关水龙头，浪费水资源，故选项做法不利于节水。</p><p>故选D。</p></article></html>
