.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第6题 解析</h1><p>6. 十二边形的<span class="emphasis">外角和</span>为（    ）</p><p>A. <img src="../assets/df6340cb458c01d1f00e.png" style="width:39.00px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/a5b345e5e5e0bb2f791c.png" style="width:49.50px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/bf4b4002d73ae824b0f6.png" style="width:52.50px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/dd5dbd1fe3ae1666f3ec.png" style="width:61.50px" alt="原卷公式或图表"></p><p>【答案】C</p><p>【解析】</p><p>【分析】根据多边形的外角和为360°进行解答即可．</p><p>【详解】解：∵多边形的外角和为360°</p><p>∴十二边形的外角和是360°．</p><p>故选：C．</p><p>【点睛】本题考查多边形的内角和与外角和的求法，掌握多边形的外角和为360°是解题的关键．</p></article></html>
