.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第34题 解析</h1><p>34. 用下图电解水实验研究水的组成。</p><p><img src="../assets/2dd28b9689744ec88c55.png" style="width:202.50px" alt="原卷公式或图表">    </p><p>（1）经检验a管中产生<img src="../assets/dff00ff2ece1ddcb030d.png" style="width:34.50px" alt="原卷公式或图表">，由此得出关于水的组成的推论是_____。</p><p>（2）用带火星木条检验b管中气体为<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">的现象是_____。</p><p>【答案】（1）水中含氢元素    （2）带火星的木条复燃</p><p>【解析】</p><p>【小问1详解】</p><p>经检验a管中产生H<sub>2</sub>，电解水生成了氢气，氢气由氢元素组成，根据质量守恒定律，化学反应前后，元素的种类不变，说明水中含氢元素；</p><p>【小问2详解】</p><p>氧气具有助燃性，故用带火星木条检验b管中气体为 O<sub>2</sub> 的现象是：带火星的木条复燃。</p></article></html>
