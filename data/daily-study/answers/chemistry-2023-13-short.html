.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第13题 解析</h1><p>13. 下列标志应标识在<img src="../assets/3b83ba613e4b5eee6bc5.png" style="width:72.00px" alt="原卷公式或图表">固体试剂瓶上的是</p><p>A. <img src="../assets/df524ec7f08803dd8048.png" style="width:123.00px" alt="原卷公式或图表">  <span class="tab"></span>B. <img src="../assets/ea4aa28f04a7b5c395d6.png" style="width:121.50px" alt="原卷公式或图表">  <span class="tab"></span>C. <img src="../assets/9c83e72caec0e6d6b1f7.png" style="width:120.00px" alt="原卷公式或图表">  <span class="tab"></span>D. <img src="../assets/acabc878589b662d1973.png" style="width:123.00px" alt="原卷公式或图表">  </p><p>【答案】D</p><p>【解析】</p><p>【分析】氢氧化钠具有强腐蚀性。</p><p>【详解】A、该标志为易燃气体标志，不符合题意；</p><p>B、该标志为自燃物品标志，不符合题意；</p><p>C、该标志为爆炸品标志，不符合题意；</p><p>D、该标志为腐蚀品标志，氢氧化钠有强腐蚀性，故该标志应标识在 NaOH 固体试剂瓶上，符合题意；</p><p>故选D。</p></article></html>
