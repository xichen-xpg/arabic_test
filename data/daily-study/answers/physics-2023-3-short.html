<!doctype html><html lang="zh"><meta charset="utf-8"><title>2023年北京中考物理 第3题 解析</title><style>body{margin:0;color:#17202a;background:#fff;font-family:"SimSun","Times New Roman",serif}

.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第3题 解析</h1><p>3. 如图所示的实例，目的是为了减小摩擦的是（　　）</p><p>A. <img src="../assets/1f417dc33ce6949063ae.png" style="width:178.50px" alt="原卷公式或图表">轮滑鞋装有滚轮<span class="tab"></span>B. <img src="../assets/efa2e84a29b1cf184199.png" style="width:141.00px" alt="原卷公式或图表">运动鞋底有凹凸的花纹</p><p>C. <img src="../assets/ca60bf495d77ffc5801b.png" style="width:162.00px" alt="原卷公式或图表">脚蹬面做得凹凸不平<span class="tab"></span>D. <img src="../assets/7932ac83d934cc46306a.png" style="width:130.50px" alt="原卷公式或图表">守门员戴着防滑手套</p><p>【答案】A</p><p>【解析】</p><p>【详解】A．轮滑鞋装有滚轮，用滚动代替滑动，减小了摩擦，故A符合题意；</p><p>B．运动鞋底有凹凸的花纹，使鞋底与地面间变得更粗糙，增大了摩擦力，故B不符合题意；</p><p>C．脚蹬面做得凹凸不平，使鞋底与踏板间变得更粗糙，增大了摩擦力，故C不符合题意；</p><p>D．守门员戴着防滑手套，使手与足球之间变得更粗糙，增大了摩擦力，故D不符合题意。</p><p>故选A。</p></article></html>
