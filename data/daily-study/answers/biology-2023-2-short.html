.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考生物 第2题 解析</h1><p>2. 下列由一个细胞构成，能独立完成生命活动的生物是（　　）</p><p>A. 水螅<span class="tab"></span>B. 草履虫<span class="tab"></span>C. 水绵<span class="tab"></span>D. 线虫</p><p>【答案】B</p><p>【解析】</p><p>【分析】有些生物的整个身体就是一个细胞，称为单细胞生物。</p><p>【详解】单细胞生物的整个身体由一个细胞构成，能独立完成生命活动。水螅、水绵和线虫都是多细胞生物。草履虫的整个身体由一个细胞构成，能独立完成生命活动，属于单细胞生物，因此ACD错误，B正确。</p><p>故选B。</p></article></html>
