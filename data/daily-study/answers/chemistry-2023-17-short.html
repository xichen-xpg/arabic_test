.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第17题 解析</h1><p>17. 向分别盛有下列物质的点滴板孔穴中滴加足量稀硫酸，无明显现象的是</p><p>A. <img src="../assets/3b23c3a8872de0eb0a6a.png" style="width:55.50px" alt="原卷公式或图表"><span class="tab"></span>B. Fe<span class="tab"></span>C. 稀<img src="../assets/3b83ba613e4b5eee6bc5.png" style="width:72.00px" alt="原卷公式或图表">溶液<span class="tab"></span>D. <img src="../assets/f35ff34959564752cd71.png" style="width:85.50px" alt="原卷公式或图表">溶液</p><p>【答案】C</p><p>【解析】</p><p>【详解】A、稀硫酸与氧化铁反应生成硫酸铁和水，可观察到固体逐渐溶解、溶液变为黄色，不符合题意；</p><p>B、稀硫酸与铁反应生成硫酸亚铁和氢气，可观察到固体逐渐溶解、溶液变为浅绿色、有气泡产生，不符合题意；</p><p>C、稀硫酸与氢氧化钠反应生成硫酸钠和水，该反应无明显现象，符合题意；</p><p>D、稀硫酸与碳酸钠溶液反应生成硫酸钠、二氧化碳和水，可观察到有气泡产生，不符合题意；</p><p>故选C。</p></article></html>
