<!doctype html><html lang="zh"><meta charset="utf-8"><title>2023年北京中考英语 第8题 解析</title><style>body{margin:0;color:#17202a;background:#fff;font-family:"SimSun","Times New Roman",serif}

.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考英语 第8题 解析</h1><p>8. The Shenzhou-15 astronauts ________ to Earth safely on June 4, 2023.</p><p>A. return<span class="tab"></span>B. returned<span class="tab"></span>C. will return<span class="tab"></span>D. have returned</p><p>【答案】B</p><p>【解析】</p><p>【详解】句意：神舟15号宇航员于2023年6月4日安全返回地球。</p><p>考查时态。根据“on June 4, 2023”可知是过去发生的事情，用一般过去时，谓语用过去式returned。故选B。</p></article></html>
