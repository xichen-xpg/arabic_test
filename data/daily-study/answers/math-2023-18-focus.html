.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第18题 解析</h1><p>18. 解不答式组：<img src="../assets/906794f055c7c3cfa77c.png" style="width:144.00px" alt="原卷公式或图表">．</p><p>【答案】<img src="../assets/6d265c0a13048979ce41.png" style="width:85.50px" alt="原卷公式或图表"></p><p>【解析】</p><p>【分析】分别求出每一个不等式的解集，根据口诀：同大取大、同小取小、大小小大中间找、大大小小找不到确定不等式组的解集．</p><p>【详解】<img src="../assets/6ebbfb997cc346ed3e66.png" style="width:166.50px" alt="原卷公式或图表"></p><p>解不等式①得：<img src="../assets/f125dbbabf1cdcb58266.png" style="width:52.50px" alt="原卷公式或图表"></p><p>解不等式②得：<img src="../assets/decb4a5041a3e96172e8.png" style="width:57.00px" alt="原卷公式或图表"></p><p><img src="../assets/bc1bd99053b3d5c2eeef.png" style="width:19.50px" alt="原卷公式或图表">不等式的解集为：<img src="../assets/6d265c0a13048979ce41.png" style="width:85.50px" alt="原卷公式或图表"></p><p>【点睛】本题考查了解一元一次不等式组，正确掌握一元一次不等式解集确定方法是解题的关键．</p></article></html>
