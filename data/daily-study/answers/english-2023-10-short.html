.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考英语 第10题 解析</h1><p>10. Eric ________ many things since he became interested in science.</p><p>A. is learning<span class="tab"></span>B. was learning<span class="tab"></span>C. will learn<span class="tab"></span>D. has learned</p><p>【答案】D</p><p>【解析】</p><p>【详解】句意：自从Eric对科学感兴趣以来，他已经学习了很多东西。</p><p>考查现在完成时。根据“since he became interested in science”可知，句子应用现在完成时，其谓语结构<img src="../assets/6f2f88758a41d9152742.png" style="width:25.00px" alt="原卷公式或图表">：have/has+过去分词。故选D。</p></article></html>
