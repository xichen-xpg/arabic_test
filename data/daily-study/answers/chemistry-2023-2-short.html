.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第2题 解析</h1><p>2. 各种元素在地壳里的含量(质量分数)如下图，其中含量最多的元素是</p><p><img src="../assets/cd9133da0faf721a7a3f.png" style="width:321.00px" alt="原卷公式或图表">  </p><p>A. 铁<span class="tab"></span>B. 铝<span class="tab"></span>C. 硅<span class="tab"></span>D. 氧</p><p>【答案】D</p><p>【解析】</p><p>【详解】由图可知，各种元素在地壳里的含量前四位由多到少依次为氧、硅、铝、铁，因此含量最多的元素是氧，故选D。</p><p>我们要形成绿色生活方式，像保护眼睛一样保护自然和生态环境。回答3~5题。</p></article></html>
