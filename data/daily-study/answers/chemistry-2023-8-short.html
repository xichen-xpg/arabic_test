.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第8题 解析</h1><p>8. 化肥能提高农作物产量。下列物质能用作氮肥的是</p><p>A. <img src="../assets/3dd72fdcd3d00ae1326a.png" style="width:72.00px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/82891c7b9f21ea8c64aa.png" style="width:76.50px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/4cb6236a6166004908ff.png" style="width:73.50px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/4dc574fb60639e8efadf.png" style="width:127.50px" alt="原卷公式或图表"></p><p>【答案】C</p><p>【解析】</p><p>【分析】氮肥是含有作物营养元素氮的化肥。</p><p>【详解】A.硫酸钾中不含氮元素，不是氮肥，不符合题意；</p><p>B.碳酸钾中不含氮元素，不是氮肥，不符合题意；</p><p>C.氯化铵中含氮元素，是氮肥，符合题意；</p><p>D.磷酸二氢钙中不含氮元素，不是氮肥，不符合题意；</p><p>故选C。</p><p>我国科学家在化学、化工领域做出了重大贡献。回答9~11题。</p></article></html>
