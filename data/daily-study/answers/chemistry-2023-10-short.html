.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第10题 解析</h1><p>10. 化工科学家侯德榜发明了“联合制碱法”生产纯碱。下列物质中，俗称纯碱的是</p><p>A. <img src="../assets/f35ff34959564752cd71.png" style="width:85.50px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/98781e3194015a3c8b95.png" style="width:58.50px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/3b83ba613e4b5eee6bc5.png" style="width:72.00px" alt="原卷公式或图表"><span class="tab"></span>D. <img src="../assets/a3bffc4508ad682e4515.png" style="width:94.50px" alt="原卷公式或图表"></p><p>【答案】A</p><p>【解析】</p><p>【详解】A、碳酸钠俗称纯碱、苏打，符合题意；</p><p>B、纯碱不是氯化钠的俗称，不符合题意；</p><p>C、氢氧化钠俗称烧碱、火碱、苛性钠，不符合题意；</p><p>D、碳酸氢钠俗称小苏打，不符合题意。</p><p>故选A。</p></article></html>
