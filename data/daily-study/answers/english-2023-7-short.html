.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考英语 第7题 解析</h1><p>7. —Lucy, what are you doing? </p><p>—I ________ a model ship.</p><p>A. make<span class="tab"></span>B. made<span class="tab"></span>C. am making<span class="tab"></span>D. was making</p><p>【答案】C</p><p>【解析】</p><p>【详解】句意：——露西，你在干什么？——我正在制作一个轮船模型。</p><p>考查现在进行时。根据“what are you doing?”可知句子应用现在进行时来回答，其谓语结构为：am/is/are+现在分词。故选C。</p></article></html>
