.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第5题 解析</h1><p>5. 若关于<img src="../assets/f68e7df05a2287423109.png" style="width:18.00px" alt="原卷公式或图表">的一元二次方程<img src="../assets/7bd379929393717ea472.png" style="width:148.50px" alt="原卷公式或图表">有两个相等的实数根，则实数<img src="../assets/7f6814b301950317c31d.png" style="width:25.50px" alt="原卷公式或图表">的值为（    ）</p><p>A. <img src="../assets/0585b21c0a99198b517c.png" style="width:31.50px" alt="原卷公式或图表"><span class="tab"></span>B. <img src="../assets/595a595804ccb603c218.png" style="width:40.50px" alt="原卷公式或图表"><span class="tab"></span>C. <img src="../assets/a82ac8b8dcd6e191b396.png" style="width:24.00px" alt="原卷公式或图表"><span class="tab"></span>D. 9</p><p>【答案】C</p><p>【解析】</p><p>【分析】根据一元二次方程有两个相等的实数根，可得<img src="../assets/769fef6a9cef6b015f02.png" style="width:58.50px" alt="原卷公式或图表">，进而即可求解．</p><p>【详解】解：∵关于<img src="../assets/f68e7df05a2287423109.png" style="width:18.00px" alt="原卷公式或图表">的一元二次方程<img src="../assets/7bd379929393717ea472.png" style="width:148.50px" alt="原卷公式或图表">有两个相等的实数根，</p><p>∴<img src="../assets/51064e8d08cb5cacbcee.png" style="width:247.50px" alt="原卷公式或图表">．</p><p>解得：<img src="../assets/197faae21795219c3f7c.png" style="width:64.50px" alt="原卷公式或图表">．</p><p>故选：C．</p><p>【点睛】本题考查了一元二次方程<img src="../assets/c8c51edc711179f248b8.png" style="width:151.50px" alt="原卷公式或图表"> (<img src="../assets/40aa11bdb94a5f670f44.png" style="width:157.50px" alt="原卷公式或图表">为常数)的根的判别式<img src="../assets/71094e1c32555254ab13.png" style="width:126.00px" alt="原卷公式或图表">，理解根的判别式对应的根的三种情况是解题的关键．当<img src="../assets/f57c9d5e30d4d7f26aca.png" style="width:58.50px" alt="原卷公式或图表">时，方程有两个不相等的实数根；当<img src="../assets/769fef6a9cef6b015f02.png" style="width:58.50px" alt="原卷公式或图表">时，方程有两个相等的实数根；当<img src="../assets/a5bce1f4a103a847c47a.png" style="width:58.50px" alt="原卷公式或图表">时，方程没有实数根．</p></article></html>
