.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第21题</h1><p>21. 小强用天平和量筒测量土豆的密度，由于土豆太大，不能放入量筒中，他将土豆切下来一小块进行实验。</p><p><img src="../assets/8087f98a6fd74e929334.png" style="width:399.00px" alt="原卷公式或图表">  </p><p>（1）将天平放在水平台面上，游码归零后，发现指针指示的位置如图甲所示，将平衡螺母向______端移动，使横梁水平平衡；</p><p>（2）将土豆放在天平的左盘，当右盘中砝码的质量和游码在标尺上的位置如图乙所示时，横梁再次水平平衡，土豆的质量为______g；</p><p>（3）用量筒测出土豆的体积为40cm<sup>3</sup>；</p><p>（4）该土豆的密度为______g/cm³。</p></article></html>
