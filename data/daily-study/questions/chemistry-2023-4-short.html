.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第4题</h1><p>我们要形成绿色生活方式，像保护眼睛一样保护自然和生态环境。回答3~5题。</p><p>4. 2023年3月1日《北京市节水条例》正式实施。下列做法<span class="emphasis">不利于</span>节水的是</p><p>A. 用淘米水浇花<span class="tab"></span>B. 水管跑冒滴漏及时维修</p><p>C. 选用节水龙头<span class="tab"></span>D. 洗手打香皂时不关水龙头</p></article></html>
