.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考语文 第14题</h1><p>14. “高光时刻”可以理解为人处于巅峰状态的那一瞬间。从《西游记》《骆驼祥子》《钢铁是怎样炼成的》《海底两万里》中选择一个人物形象，叙述这一形象的高光时刻。（要求：写出具体“时刻”，叙述相关内容，概括形象的特征或精神品质，100字左右）</p></article></html>
