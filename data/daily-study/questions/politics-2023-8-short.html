.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考道德与法治 第8题</h1><p>8. 党的十八大以来，立法机关不断增强备案审查制度刚性，就法规、司法解释等规范性文件中的合宪性、合法性、适当性等问题开展审查研究。十年来，全国人大常委会共接收公民、组织提出的审查建议19200多件，推动、督促制定机关修改、废止各类规范性文件2万余件。这表明（    ）</p><p>A. 全国人大常委会是最高国家权力机关</p><p>B. 备案审查制度能够实现国家长治久安</p><p>C. 宪法法律尊严和国家法治统一得到有效维护</p><p>D. 宪法监督的对象是行使公权力的公职人员</p></article></html>
