.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第14题</h1><p>14. 小京洗水果时，发现体积较小<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">桔子漂浮在水面上，而体积较大的芒果却沉在水底，如图所示。下列说法正确的是（　　）</p><p><img src="../assets/49daf3994623e228eb09.png" style="width:268.50px" alt="原卷公式或图表">  </p><p>A. 桔子的密度小于芒果的密度</p><p>B. 桔子受到<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">浮力大于它受到的重力</p><p>C. 桔子受到<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">重力小于芒果受到的重力</p><p>D. 桔子受到的浮力大于芒果受到的浮力</p></article></html>
