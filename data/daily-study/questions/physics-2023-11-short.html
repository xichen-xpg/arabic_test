.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第11题</h1><p>11. 如图是两个定值电阻R<sub>1</sub>、R<sub>2</sub>的内部结构图，R<sub>1</sub>、R<sub>2</sub>所用电阻丝（涂有绝缘漆）粗细均匀、材料相同，分别缠绕在相同的圆柱形绝缘棒上，圈数分别为43圈和33圈，R<sub>1</sub>的电阻丝比R<sub>2</sub>的电阻丝细。将R<sub>1</sub>、R<sub>2</sub>并联在电路中工作一段时间，下列说法正确的是（　　）</p><p><img src="../assets/6d5b55d1831844cbb292.png" style="width:259.50px" alt="原卷公式或图表">  </p><p>A. 通过R<sub>1</sub>的电流等于通过R<sub>2</sub>的电流</p><p>B. R<sub>1</sub>两端的电压大于R<sub>2</sub>两端的电压</p><p>C. R<sub>1</sub>的电功率大于R<sub>2</sub>的电功率</p><p>D. R<sub>1</sub>消耗的电能小于R<sub>2</sub>消耗的电能</p></article></html>
