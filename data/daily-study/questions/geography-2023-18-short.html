.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考地理 第18题</h1><p>法拉吉和都江堰均是世界灌溉工程遗产。法拉吉将山泉水和地下水通过水渠引到山麓地带的村庄，用于生产生活。都江堰通过渠、堰调节岷江水，引水保障成都平原的农业生产。图为亚洲气候类型分布图（局部）。读图，完成下面小题。</p><p><img src="../assets/7ffddf144011e07844e4.png" style="width:825.00px" alt="原卷公式或图表"></p><p>18. 两工程均（   ）</p><p>A. 因全年降水稀少而引水<span class="tab"></span>B. 通过减少蒸发避免水资源浪费</p><p>C. 因降水季节不均而蓄水<span class="tab"></span>D. 通过调配水资源提高利用效率</p></article></html>
