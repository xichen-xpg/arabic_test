.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第21题</h1><p>21. 对联是中华传统文化的瑰宝，对联装裱后，如图所示，上、下空白处分别称为天头和地头，左、右空白处统称为边．一般情况下，天头长与地头长的比是<img src="../assets/68f1bd21d90232e66689.png" style="width:43.50px" alt="原卷公式或图表">，左、右边的宽相等，均为天头长与地头长的和的<img src="../assets/e274582800818161e5ef.png" style="width:31.50px" alt="原卷公式或图表">．某人要装裱一幅对联，对联的长为<img src="../assets/039ab6c694eca70a9994.png" style="width:70.50px" alt="原卷公式或图表">，宽为<img src="../assets/ebf0872dc879263b83e9.png" style="width:61.50px" alt="原卷公式或图表">．若要求装裱后的长是装裱后的宽的4倍，求边的宽和天头长．（书法作品选自《启功法书》）</p><p><img src="../assets/f638352a0570ec98b41c.png" style="width:397.50px" alt="原卷公式或图表">    </p></article></html>
