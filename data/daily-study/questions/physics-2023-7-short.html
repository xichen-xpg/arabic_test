.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第7题</h1><p>7. 如图所示，小京用水平推力推着购物车在水平地面上做匀速直线运动，下列说法正确的是（　　）</p><p><img src="../assets/e653d6484736c079083c.png" style="width:184.50px" alt="原卷公式或图表">  </p><p>A. 小京对车的水平推力大于车受到的阻力</p><p>B. 车受到的支持力与车对地面的压力是一对平衡力</p><p>C. 若小京撤去对车的水平推力，车的运动状态将会发生改变</p><p>D. 若小京撤去对车的水平推力，小京仍对车做功</p></article></html>
