.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考语文 第11题</h1><p>阅读《记承天寺夜游》，完成下面小题。</p><p>记承天寺夜游</p><p>苏轼</p><p>元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇<span class="emphasis">交</span>横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。</p><p>11. “水中藻、荇交横”中的“交”与下列词语中加点的字，意思相同的一项是（   ）</p><p>A<img src="../assets/66cd8841bf25728b865a.png" style="width:5.00px" alt="原卷公式或图表"> 四季<span class="emphasis">交</span>替<span class="tab"></span>B. 阡陌<span class="emphasis">交</span>通<span class="tab"></span>C. <span class="emphasis">交</span>口称赞<span class="tab"></span>D. 君子之<span class="emphasis">交</span></p></article></html>
