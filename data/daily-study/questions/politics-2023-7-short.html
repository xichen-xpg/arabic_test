.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考道德与法治 第7题</h1><p>7. 雷锋，一座不朽的丰碑。一代代国人用行动续写着厚重的“雷锋日记”。当“雷锋日记”写到2023年——</p><table><tr><td colspan="1" rowspan="1"><p>我在广袤的乡村热土上扎根，挥撒洒汗水。</p></td><td colspan="1" rowspan="1"><p>我在边守疆中燃烧青春，践行铮铮誓言。</p></td><td colspan="1" rowspan="1"><p>我用钉钉子的精神攻坚克难，锐意进取。</p></td></tr></table><p>以上“雷锋日记”体现了（    ）</p><p>①历史川流不息，精神代代相传     ②热爱本职工作，珍惜劳动成果</p><p>③汲取榜样力量，平凡造就伟大     ④利用自身优势，服务家乡建设</p><p>A. ①③<span class="tab"></span>B. ①④<span class="tab"></span>C. ②③<span class="tab"></span>D. ②④</p></article></html>
