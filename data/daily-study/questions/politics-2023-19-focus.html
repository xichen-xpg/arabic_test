.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考道德与法治 第19题</h1><p>19. 美丽中国的法治足迹。</p><p>近年来，我国先后制修订一系列生态环境保护法律。</p><p><img src="../assets/b956e69b67c183da8e99.png" style="width:351.00px" alt="原卷公式或图表"></p><p>时间镌刻不朽。今天，我国生态环境法治建设取得显著成效：河长制带来河长治，一幅幅鱼翔浅底、人水相亲的图画徐徐铺展；日益完善的湿地生态补偿制度，让保护生态不吃亏、能受益的局面渐成常态……美丽中国的法治足迹铺陈延伸，让祖国的天更蓝、山更绿、水更清。</p><p>（1）说明美丽中国<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">法治足迹中蕴含的道理。</p><p>（2）青少年不仅是法治中国建设的受益者，更应该成为参与者和推动者。简要说明青少年能为美丽中国的法治建设做些什么。</p></article></html>
