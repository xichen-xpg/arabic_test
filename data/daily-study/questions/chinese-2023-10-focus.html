.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考语文 第10题</h1><p>阅读《使至塞上》，完成下面小题。</p><p>使至塞上</p><p>王维</p><p>单车欲问边，属国过居延。</p><p>征蓬出汉塞，归雁入胡天。</p><p>大漠孤烟直，长河落日圆。</p><p>萧关逢候骑，都护在燕然。</p><p>10. 列出第二联构成对偶的词语，简要分析这一联运用对偶的表达效果。</p></article></html>
