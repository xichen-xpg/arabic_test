.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第4题</h1><p>4. 2023年5月30日，搭载神舟十六号载人飞船的长征二号F遥十六运载火箭，在酒泉卫星发射中心成功发射。图中所示的是火箭上升和此过程中航天员在舱内的情境，下列说法正确的是（　　）</p><p><img src="../assets/b477a41524d05ee8eb84.png" style="width:445.50px" alt="原卷公式或图表">  </p><p>A. 以地面为参照物，发射塔是运动的</p><p>B. 以发射塔为参照物，火箭是静止的</p><p>C. 以舱内<img src="../assets/e0ec8f0a6ee67fd7f876.png" style="width:21.00px" alt="原卷公式或图表">航天员为参照物，火箭是静止的</p><p>D. 以舱内的航天员为参照物，发射塔是静止的</p></article></html>
