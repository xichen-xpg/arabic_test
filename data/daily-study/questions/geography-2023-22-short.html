.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考地理 第22题</h1><p>巴西伊瓜苏国家公园和阿根廷伊瓜苏国家公园内动植物种类丰富，分别被列入《世界遗产名录》。因当地居民启用原本关闭的道路，1999年巴西伊瓜苏国家公园面临从名录中被删除的危险，2001年该道路重新关闭。图为巴西伊瓜苏国家公园手绘图。读图，完成下面小题。</p><p><img src="../assets/d6ebd351d79d69456fa1.png" style="width:501.00px" alt="原卷公式或图表">  <img src="../assets/53bd94913148a1b95be0.png" style="width:586.50px" alt="原卷公式或图表">  </p><p>22. 为保护动植物资源，该国家公园应（   ）</p><p>A. 加强科学研究力度，改变植物生长习性<span class="tab"></span>B. 健全国际合作机制，畅通跨境生态廊道</p><p>C. 扩建周边所有城镇，限制动物活动范围<span class="tab"></span>D. 大力开发旅游项目，拓宽经济收入渠道</p></article></html>
