.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考物理 第15题</h1><p>15. 如图所示，是小京设计的汽车油箱内油量不足时触发报警的电路，电源两端电压保持不变，电阻R<sub>1</sub>、R<sub>2</sub>中的一个是定值电阻，另一个是压敏电阻。压敏电阻装在油箱内底部，其阻值随油箱中油量的减少而增大，当电压表示数大于某一值U时，就会触发报警。电压表示数为U时，油箱中的油量为警戒油量。下列说法正确的是（　　）</p><p><img src="../assets/3ac27a9f1306a1333c4c.png" style="width:240.00px" alt="原卷公式或图表">  </p><p>A. R<sub>1</sub>为压敏电阻</p><p>B. 随着油箱的油量减少，通过定值电阻的电流变大</p><p>C. 若换用阻值更大的定值电阻，警戒油量将变小</p><p>D. 若换用电压更大的电源，警戒油量将变大</p></article></html>
