.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考语文 第6题</h1><p>第三部分  调查结论</p><p>博物馆之城的建设路径主要有：依托丰富馆藏，布局、策划特色展览，促进现有博物馆的发展；整合社会资源，将“类博物馆”纳入建设序列，规划、建设新博物馆。新时期博物馆的社会作用包括：__________。</p><p>6. 根据小组意见，在横线处补写一个节奏匀称的句子。下列选项恰当的一项是（   ）</p><p>A. 服务首都发展，推动社会进步，满足公众需要，增进国际交流</p><p>B. 服务、推动首都发展和社会进步，满足公众及国际交流的需要</p><p>C<img src="../assets/66cd8841bf25728b865a.png" style="width:5.00px" alt="原卷公式或图表"> 服务首都发展，推动社会进步，公众需要得到满足，增进国际交流</p><p>D. 服务、推动首都发展和社会进步，满足公众需要，国际交流得以增进</p></article></html>
