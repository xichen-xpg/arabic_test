.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考数学 第22题</h1><p>22. 在平面直角坐标系<img src="../assets/3a4e102add4085864500.png" style="width:48.00px" alt="原卷公式或图表">中，函数<img src="../assets/c97fb836b0df91640dd4.png" style="width:169.50px" alt="原卷公式或图表">的图象经过点<img src="../assets/79d5273a07644602daf7.png" style="width:72.00px" alt="原卷公式或图表">和<img src="../assets/a755c48958a0657fcdb4.png" style="width:73.50px" alt="原卷公式或图表">，与过点<img src="../assets/c00391ac08da9f83512a.png" style="width:58.50px" alt="原卷公式或图表">且平行于x轴的线交于点C．</p><p>（1）求该函数的解析式及点C的坐标；</p><p>（2）当<img src="../assets/babb5196d27946cd0d20.png" style="width:54.00px" alt="原卷公式或图表">时，对于x的每一个值，函数<img src="../assets/6b4bde703f7057cc815c.png" style="width:109.50px" alt="原卷公式或图表">的值大于函数<img src="../assets/c97fb836b0df91640dd4.png" style="width:169.50px" alt="原卷公式或图表">的值且小于4，直接写出n的值．</p></article></html>
