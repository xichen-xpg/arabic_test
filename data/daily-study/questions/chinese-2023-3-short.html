.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考语文 第3题</h1><p>【展览内容及形式】</p><p>中国国家博物馆“逐梦寰宇问苍穹——中国载人航天工程30年成就展”<span class="emphasis">独具匠心</span>。各类展品以不同形式展出，空间站组合体1∶4的模型“飞”在头顶，核心舱1∶1的模型可步入参观。中国航天事业的成就让观众<span class="emphasis">拍手称快</span>。</p><p>首都博物馆“辉煌中轴——纪念北京建都870周年展”剧场式的沉浸空间，使人有<span class="emphasis">身临其境</span>之感。16米长的数字沙盘将<span class="emphasis">气势磅礴</span>的中轴线历史建筑群完整地呈现在观众面前。</p><p>3. 你检查文段中使用的成语后发现，下列成语使用<span class="emphasis">不恰当</span>的一项是（   ）</p><p>A. 独具匠心<span class="tab"></span>B. 拍手称快<span class="tab"></span>C. 身临其境<span class="tab"></span>D. 气势磅礴</p></article></html>
