.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考化学 第25题</h1><p>25. 用下图装置进行实验。通入<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">前，白磷均不燃烧；通入<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">后，甲中白磷不燃烧，乙中白磷燃烧。下列说法<span class="emphasis">不正确</span>的是</p><p><img src="../assets/2e50f17e62cb1c42d6ad.png" style="width:567.00px" alt="原卷公式或图表">  </p><p>已知：白磷的着火点为<img src="../assets/266889b9112fe0f7886d.png" style="width:55.50px" alt="原卷公式或图表">；红磷的着火点为<img src="../assets/3f79f383682b4f2a2ba8.png" style="width:67.50px" alt="原卷公式或图表">。</p><p>A. 该实验能验证可燃物燃烧需要与<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">接触</p><p>B. 该实验能验证可燃物燃烧需要温度达到着火点</p><p>C. 若将甲中的白磷换成红磷，能验证可燃物燃烧需要温度达到着火点</p><p>D. 若将乙中的白磷换成红磷，能验证可燃物燃烧需要与<img src="../assets/d2a672fc7fd914c77298.png" style="width:31.50px" alt="原卷公式或图表">接触</p></article></html>
