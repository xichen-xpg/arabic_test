.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考地理 第17题</h1><p>法拉吉和都江堰均是世界灌溉工程遗产。法拉吉将山泉水和地下水通过水渠引到山麓地带的村庄，用于生产生活。都江堰通过渠、堰调节岷江水，引水保障成都平原的农业生产。图为亚洲气候类型分布图（局部）。读图，完成下面小题。</p><p><img src="../assets/7ffddf144011e07844e4.png" style="width:825.00px" alt="原卷公式或图表"></p><p>17. 法拉吉和都江堰所在地区的气候类型分别是（   ）</p><p>A. 热带沙漠气候、亚热带季风气候<span class="tab"></span>B. 地中海气候、亚热带季风气候</p><p>C. 温带大陆性气候、热带季风气候<span class="tab"></span>D. 热带沙漠气候、高原山地气候</p></article></html>
