.emphasis{text-emphasis:dot;text-emphasis-position:under} math{font-size:1.05em}</style><article><h1>2023年北京中考生物 第5题</h1><p>5. “海洋牧场”有重要的经济价值和生态价值。它是指在特定海域内，人工投放藻类、贝类和鱼虾等海洋经济生物种苗，利用海洋中的天然饵料等进行集中养殖和科学管理，类似于在陆地上放牧牛羊。下列关于“海洋牧场”的叙述错误的是（　　）</p><p>A. 属于海洋生态系统<span class="tab"></span>B. 能量最终来源于太阳能</p><p>C. 其中的藻类可以制造有机物<span class="tab"></span>D. 有无限的自我（动）调节能力</p></article></html>
