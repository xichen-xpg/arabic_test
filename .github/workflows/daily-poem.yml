name: Daily Poem Poster

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-poem-poster
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poemframe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poemframe/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run generate:daily-poem
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Save poster and its date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.png' daily-poem.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update daily poem poster $(TZ=Asia/Dubai date +%F)"
          git push
