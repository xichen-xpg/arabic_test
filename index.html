<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic Shooter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .shell {
      width: 100%;
      height: 100vh;
      padding: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 390px;
      gap: 10px;
      height: 100%;
    }

    .pane {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(215, 222, 232, .75);
      border-radius: 10px;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 980px) {
      .shell {
        height: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      iframe {
        height: 640px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="layout">
      <section class="pane">
        <iframe id="mainGameFrame" title="game" src="games/space-shooter.html"></iframe>
      </section>
      <aside class="pane">
        <iframe id="arabicFrame" title="arabic test" src="games/arabic-test.html"></iframe>
      </aside>
    </section>
  </main>

  <script>
    const mainGameFrame = document.querySelector("#mainGameFrame");
    let latestArabicMetrics = null;

    function forwardArabicMetrics() {
      if (!latestArabicMetrics) return;
      mainGameFrame.contentWindow?.postMessage({
        type: "hub:arabic-metrics",
        payload: latestArabicMetrics
      }, "*");
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "arabic-test:metrics") return;
      latestArabicMetrics = event.data.payload;
      forwardArabicMetrics();
    });

    mainGameFrame.addEventListener("load", forwardArabicMetrics);
  </script>
</body>
</html>
