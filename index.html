<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic Game Hub</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dee8;
      --surface: rgba(255, 255, 255, 0.9);
      --accent: #0f766e;
      --accent-soft: #e7f6f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 207, 90, 0.34), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(136, 199, 255, 0.36), transparent 30%),
        linear-gradient(135deg, #fff8e8 0%, #eef8ff 48%, #f7efff 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #17324d;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .metric {
      min-width: 92px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(31, 50, 71, 0.08);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric b {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 14px;
      align-items: start;
    }

    .pane {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(31, 50, 71, 0.14);
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
    }

    .pane-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #0b5f59;
      font-size: 12px;
      font-weight: 900;
    }

    iframe {
      display: block;
      width: 100%;
      border: 0;
      background: #fff;
    }

    .main-frame {
      height: min(860px, calc(100vh - 120px));
      min-height: 720px;
    }

    .side-frame {
      height: min(860px, calc(100vh - 120px));
      min-height: 720px;
    }

    @media (max-width: 980px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics {
        justify-content: flex-start;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .main-frame,
      .side-frame {
        height: 820px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Arabic Game Hub</h1>
        <p class="subtitle">左侧主游戏，右侧阿语测试。阿语测试指标会实时影响主游戏火力。</p>
      </div>
      <section class="metrics" aria-label="阿语测试指标">
        <div class="metric"><span>题库</span><b id="metricSource">-</b></div>
        <div class="metric"><span>题目组</span><b id="metricBatch">-</b></div>
        <div class="metric"><span>完成题数</span><b id="metricCompleted">0/16</b></div>
      </section>
    </section>

    <section class="layout">
      <section class="pane">
        <div class="pane-header">
          <h2>雷电飞船</h2>
          <span class="tag">方向键 + 空格</span>
        </div>
        <iframe id="mainGameFrame" class="main-frame" title="雷电飞船游戏" src="games/space-shooter.html"></iframe>
      </section>

      <aside class="pane">
        <div class="pane-header">
          <h2>阿语测试</h2>
          <span class="tag">学习能量</span>
        </div>
        <iframe id="arabicFrame" class="side-frame" title="阿语测试组件" src="games/arabic-test.html"></iframe>
      </aside>
    </section>
  </main>

  <script>
    const mainGameFrame = document.querySelector("#mainGameFrame");
    const metricSource = document.querySelector("#metricSource");
    const metricBatch = document.querySelector("#metricBatch");
    const metricCompleted = document.querySelector("#metricCompleted");

    let latestArabicMetrics = null;

    function forwardArabicMetrics() {
      if (!latestArabicMetrics) return;
      mainGameFrame.contentWindow?.postMessage({
        type: "hub:arabic-metrics",
        payload: latestArabicMetrics
      }, "*");
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "arabic-test:metrics") return;

      latestArabicMetrics = event.data.payload;
      metricSource.textContent = latestArabicMetrics.source === "best-friend" ? "Best Friend" : "餐厅";
      metricBatch.textContent = `第 ${latestArabicMetrics.batch + 1} 组`;
      const completed = latestArabicMetrics.completedQuestions ?? latestArabicMetrics.puzzleUnlocked ?? 0;
      const total = latestArabicMetrics.totalQuestions ?? latestArabicMetrics.puzzleTotal ?? 16;
      metricCompleted.textContent = `${completed}/${total}`;
      forwardArabicMetrics();
    });

    mainGameFrame.addEventListener("load", forwardArabicMetrics);
  </script>
</body>
</html>
