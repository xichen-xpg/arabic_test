<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日打卡</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .shell {
      width: 100%;
      height: 100vh;
      padding: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: calc(100vh - 20px);
    }

    .pane {
      position: relative;
      min-width: 0;
      min-height: calc(100vh - 20px);
      overflow: hidden;
      border: 1px solid rgba(215, 222, 232, .75);
      border-radius: 10px;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100dvh - 20px);
      min-height: 0;
      border: 0;
      background: #fff;
    }

  </style>
</head>
<body>
  <main class="shell">
    <section class="layout">
      <aside class="pane">
        <iframe id="arabicFrame" title="每日学习打卡" src="games/arabic-test.html?v=20261031studyonly#checkin" allow="autoplay"></iframe>
      </aside>
    </section>
  </main>
</body>
</html>
