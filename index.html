<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic Game Hub</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dee8;
      --surface: rgba(255, 255, 255, 0.9);
      --accent: #0f766e;
      --accent-soft: #e7f6f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 207, 90, 0.34), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(136, 199, 255, 0.36), transparent 30%),
        linear-gradient(135deg, #fff8e8 0%, #eef8ff 48%, #f7efff 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #17324d;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-weight: 600;
    }

    .game-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #0b5f59;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(31, 50, 71, 0.08);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric b {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .frame-wrap {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(31, 50, 71, 0.14);
    }

    iframe {
      display: block;
      width: 100%;
      height: min(1120px, calc(100vh - 180px));
      min-height: 760px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      iframe {
        height: 1000px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Arabic Game Hub</h1>
        <p class="subtitle">主页负责加载游戏组件，并接收游戏上报的学习指标。</p>
      </div>
      <nav class="game-tabs" aria-label="游戏列表">
        <button class="tab active" type="button" data-game="arabic-test">阿语拼图测试</button>
      </nav>
    </section>

    <section class="metrics" aria-label="阿语测试指标">
      <div class="metric"><span>游戏</span><b id="metricGame">arabic-test</b></div>
      <div class="metric"><span>题库</span><b id="metricSource">-</b></div>
      <div class="metric"><span>题目组</span><b id="metricBatch">-</b></div>
      <div class="metric"><span>拼图</span><b id="metricPuzzle">0/16</b></div>
    </section>

    <section class="frame-wrap">
      <iframe id="gameFrame" title="当前游戏" src="games/arabic-test.html"></iframe>
    </section>
  </main>

  <script>
    const games = {
      "arabic-test": {
        title: "阿语拼图测试",
        src: "games/arabic-test.html"
      }
    };

    const frame = document.querySelector("#gameFrame");
    const metricGame = document.querySelector("#metricGame");
    const metricSource = document.querySelector("#metricSource");
    const metricBatch = document.querySelector("#metricBatch");
    const metricPuzzle = document.querySelector("#metricPuzzle");

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        const game = games[button.dataset.game];
        if (!game) return;

        document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
        button.classList.add("active");
        frame.src = game.src;
        metricGame.textContent = button.dataset.game;
        metricSource.textContent = "-";
        metricBatch.textContent = "-";
        metricPuzzle.textContent = "0/16";
      });
    });

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "arabic-test:metrics") return;

      const metrics = event.data.payload;
      metricGame.textContent = metrics.game;
      metricSource.textContent = metrics.source === "best-friend" ? "Best Friend" : "餐厅";
      metricBatch.textContent = `第 ${metrics.batch + 1} 组`;
      metricPuzzle.textContent = `${metrics.puzzleUnlocked}/${metrics.puzzleTotal}`;
    });
  </script>
</body>
</html>
