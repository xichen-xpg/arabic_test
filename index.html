<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic Shooter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .shell {
      width: 100%;
      height: 100vh;
      padding: 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(500px, 1fr) 520px;
      gap: 10px;
      min-height: calc(100vh - 20px);
    }

    .pane {
      position: relative;
      min-width: 0;
      min-height: calc(100vh - 20px);
      overflow: hidden;
      border: 1px solid rgba(215, 222, 232, .75);
      border-radius: 10px;
      background: #fff;
    }

    .game-lock {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(11, 18, 32, .9);
      color: #fff;
      text-align: center;
    }

    .game-lock.active {
      display: grid;
    }

    .game-lock:focus {
      outline: none;
    }

    .lock-panel {
      max-width: 420px;
    }

    .lock-panel h2 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .lock-panel p {
      margin: 0;
      color: rgba(255, 255, 255, .82);
      font-size: 16px;
      line-height: 1.6;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 20px);
      min-height: 620px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 980px) {
      .shell {
        height: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .pane {
        min-height: 0;
      }

      iframe {
        height: 640px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="layout">
      <section class="pane">
        <iframe id="mainGameFrame" title="game" src="games/space-shooter.html"></iframe>
        <div id="gameLock" class="game-lock" tabindex="-1" aria-live="polite">
          <div class="lock-panel">
            <h2 id="gameLockTitle">需要先完成阿语题</h2>
            <p id="gameLockText">选择极品飞车2后，完成右侧一题即可解锁 60 秒游戏时间。</p>
          </div>
        </div>
      </section>
      <aside class="pane">
        <iframe id="arabicFrame" title="arabic test" src="games/arabic-test.html?v=20260710poems3"></iframe>
      </aside>
    </section>
  </main>

  <script>
    const mainGameFrame = document.querySelector("#mainGameFrame");
    const gameLock = document.querySelector("#gameLock");
    const gameLockTitle = document.querySelector("#gameLockTitle");
    const gameLockText = document.querySelector("#gameLockText");
    let latestArabicMetrics = null;
    let activeGameSource = "games/space-shooter.html";
    let nfs2RemainingSeconds = 0;
    let nfs2Timer = null;
    let nfs2Window = null;
    let sharedLifeSpent = 0;
    const sharedCompletedTokens = new Set();
    const dailyLifeStorageKey = "arabic-game:daily-life";
    let activeDailyLifeDate = "";
    const nfs2RewardSeconds = 60;
    const nfs2Channel = "BroadcastChannel" in window
      ? new BroadcastChannel("nfs2-reward")
      : null;
    const gameSourceMap = {
      shooter: "games/space-shooter.html",
      pikachu: "games/pikachu-volleyball/zh/index.html?v=20260614life",
      nfs2: "need_for_speed/Need%20for%20Speed%20II%20SE%20-%20Play%20in%20Browser%20for%20Free%20-%20Retro%20Online.html"
    };
    const pikachuControlCodes = new Set([
      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown",
      "Space"
    ]);

    function localDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function loadDailyLifeState() {
      activeDailyLifeDate = localDateKey();
      try {
        const parsed = JSON.parse(localStorage.getItem(dailyLifeStorageKey) || "{}");
        if (!parsed || parsed.date !== activeDailyLifeDate) return;
        sharedLifeSpent = Math.max(0, Number(parsed.spent || 0));
        if (Array.isArray(parsed.tokens)) {
          parsed.tokens.forEach((token) => sharedCompletedTokens.add(token));
        }
      } catch {
        sharedLifeSpent = 0;
        sharedCompletedTokens.clear();
      }
    }

    function ensureDailyLifeDate() {
      const today = localDateKey();
      if (!activeDailyLifeDate) {
        activeDailyLifeDate = today;
      }
      if (activeDailyLifeDate !== today) {
        activeDailyLifeDate = today;
        sharedLifeSpent = 0;
        sharedCompletedTokens.clear();
        latestArabicMetrics = null;
        saveDailyLifeState();
      }
    }

    function saveDailyLifeState() {
      localStorage.setItem(dailyLifeStorageKey, JSON.stringify({
        date: activeDailyLifeDate || localDateKey(),
        spent: sharedLifeSpent,
        tokens: [...sharedCompletedTokens]
      }));
    }

    function forwardArabicMetrics() {
      if (!latestArabicMetrics) return;
      mainGameFrame.contentWindow?.postMessage({
        type: "hub:arabic-metrics",
        payload: latestArabicMetrics
      }, "*");
    }

    function sharedLives() {
      ensureDailyLifeDate();
      return Math.max(0, sharedCompletedTokens.size - sharedLifeSpent);
    }

    function syncSharedLifeMetrics(payload = latestArabicMetrics || {}) {
      ensureDailyLifeDate();
      const completedTokens = Array.isArray(payload.completedTokens) ? payload.completedTokens : [];
      completedTokens.forEach((token) => sharedCompletedTokens.add(token));
      sharedLifeSpent = Math.min(sharedCompletedTokens.size, sharedLifeSpent);
      saveDailyLifeState();
      const sourceTotalQuestions = Number(payload.sourceTotalQuestions || payload.totalQuestions || 0);
      const totalQuestions = Number(payload.allTotalQuestions || payload.totalQuestions || 0);
      const completedQuestions = Number(payload.completedQuestions || 0);
      latestArabicMetrics = {
        ...payload,
        completedTokens: [...sharedCompletedTokens],
        lives: sharedLives(),
        sharedLives: sharedLives(),
        totalQuestions,
        sourceTotalQuestions,
        allTotalQuestions: totalQuestions,
        sourceCompleted: sourceTotalQuestions > 0 && completedQuestions >= sourceTotalQuestions
      };
      return latestArabicMetrics;
    }

    function isNfs2Source(src = activeGameSource) {
      return src === gameSourceMap.nfs2;
    }

    function setGameLock(locked, title, text) {
      gameLock.classList.toggle("active", locked);
      gameLockTitle.textContent = title;
      gameLockText.textContent = text;
      mainGameFrame.style.pointerEvents = locked ? "none" : "";
      if (locked) {
        gameLock.focus();
      }
    }

    function stopNfs2Timer() {
      if (nfs2Timer) {
        clearInterval(nfs2Timer);
        nfs2Timer = null;
      }
    }

    function openNfs2Tab() {
      if (!nfs2Window || nfs2Window.closed) {
        nfs2Window = window.open(gameSourceMap.nfs2, "nfs2RewardTab");
      } else {
        nfs2Window.focus();
      }
      return nfs2Window;
    }

    function sendNfs2Command(action, details = {}) {
      const message = {
        type: "nfs2-reward",
        action,
        ...details
      };
      window.postMessage(message, "*");
      nfs2Channel?.postMessage(message);
      if (nfs2Window && !nfs2Window.closed) {
        nfs2Window.postMessage(message, "*");
      }
    }

    function sendNfs2CommandWithRetries(action, details = {}) {
      sendNfs2Command(action, details);
      [800, 2000, 5000].forEach((delay) => {
        window.setTimeout(() => sendNfs2Command(action, details), delay);
      });
    }

    function lockNfs2(reason = "时间到了") {
      stopNfs2Timer();
      nfs2RemainingSeconds = 0;
      setGameLock(
        true,
        "极品飞车2已锁定",
        `${reason}。完成右侧一题后继续访问网页。`
      );
      sendNfs2Command("lock", { reason });
    }

    function tickNfs2Timer() {
      nfs2RemainingSeconds -= 1;
      if (nfs2RemainingSeconds <= 0) {
        lockNfs2();
        return;
      }
      setGameLock(
        false,
        "极品飞车2已解锁",
        `剩余 ${nfs2RemainingSeconds} 秒。`
      );
    }

    function unlockNfs2() {
      if (!isNfs2Source()) return;
      nfs2RemainingSeconds = nfs2RewardSeconds;
      openNfs2Tab();
      sendNfs2Command("unlock", { seconds: nfs2RemainingSeconds });
      window.setTimeout(() => {
        sendNfs2Command("unlock", { seconds: nfs2RemainingSeconds });
      }, 600);
      setGameLock(
        false,
        "极品飞车2已解锁",
        `剩余 ${nfs2RemainingSeconds} 秒。`
      );
      stopNfs2Timer();
      nfs2Timer = setInterval(tickNfs2Timer, 1000);
    }

    function selectGameSource(requested) {
      stopNfs2Timer();
      activeGameSource = Object.values(gameSourceMap).includes(requested)
        ? requested
        : gameSourceMap.shooter;

      if (isNfs2Source()) {
        setGameLock(
          true,
          "需要先完成阿语题",
          "已打开极品飞车2奖励页。完成右侧一题即可解锁 60 秒，网页里的确认和开始按钮由玩家自己点击。"
        );
        mainGameFrame.src = "about:blank";
        if (!openNfs2Tab()) {
          setGameLock(
            true,
            "浏览器拦截了新标签页",
            "请允许弹出窗口后，再重新选择极品飞车2。"
          );
        } else {
          sendNfs2CommandWithRetries("lock", { reason: "需要先完成阿语题" });
        }
        return;
      }

      setGameLock(false, "", "");
      sendNfs2Command("lock", { reason: "已切换到其他游戏" });
      mainGameFrame.src = activeGameSource;
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type === "hub:pikachu-key") {
        forwardPikachuKey(event.data.payload);
        return;
      }

      if (event.data?.type === "arabic-test:metrics") {
        latestArabicMetrics = syncSharedLifeMetrics(event.data.payload);
        forwardArabicMetrics();
        if (latestArabicMetrics.event === "question-completed") {
          unlockNfs2();
        }
        return;
      }

      if (event.data?.type === "game:life-spent") {
        ensureDailyLifeDate();
        const amount = Math.max(1, Number(event.data.payload?.amount || 1));
        sharedLifeSpent = Math.min(sharedCompletedTokens.size, sharedLifeSpent + amount);
        saveDailyLifeState();
        syncSharedLifeMetrics();
        forwardArabicMetrics();
        return;
      }

      if (event.data?.type === "hub:select-game") {
        const requested = event.data.payload?.src || "";
        selectGameSource(requested);
      }
    });

    mainGameFrame.addEventListener("load", () => {
      forwardArabicMetrics();
      window.setTimeout(forwardArabicMetrics, 600);
      window.setTimeout(forwardArabicMetrics, 1600);
    });

    function isPikachuActive() {
      return mainGameFrame.src.toLowerCase().includes("pikachu-volleyball");
    }

    function forwardPikachuKey(payload) {
      if (!isPikachuActive() || !pikachuControlCodes.has(payload?.code)) return;
      mainGameFrame.contentWindow?.postMessage({
        type: "hub:pikachu-key",
        payload
      }, "*");
    }

    function handlePikachuControl(event, isDown) {
      if (!pikachuControlCodes.has(event.code)) return;
      forwardPikachuKey({
        code: event.code,
        isDown
      });
    }

    loadDailyLifeState();
    syncSharedLifeMetrics({
      game: "arabic-test",
      event: "daily-life-restored",
      completedTokens: [...sharedCompletedTokens],
      completedQuestions: sharedCompletedTokens.size,
      totalQuestions: 0,
      sourceTotalQuestions: 0,
      allTotalQuestions: 0,
      sourceCompleted: false
    });
    window.addEventListener("keydown", (event) => handlePikachuControl(event, true));
    window.addEventListener("keyup", (event) => handlePikachuControl(event, false));
  </script>
</body>
</html>
