<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT作业</title><link rel="stylesheet" href="daily-math.css">
<style>
.subject{padding:18px 0;border-bottom:1px solid #d7dee8}.subject h2{margin:0}.subject p{margin:8px 0}
.subject a{margin-right:16px}#completion label{display:flex;align-items:center;gap:12px}input[type=checkbox]{width:20px;margin:0}
.actions{display:flex;gap:16px;flex-wrap:wrap}select{padding:8px;font:inherit;max-width:100%}.muted{color:#667085}
.lesson{padding:16px 0}.lesson+.lesson{border-top:1px dashed #d7dee8}.lesson h3{font-size:1.05rem;color:#0f766e;margin:20px 0 8px}.lesson p{line-height:1.8;overflow-wrap:anywhere}
</style></head>
<body><main>
<nav><a href="arabic-test.html#checkin">每日打卡</a></nav>
<header><h1>PPT作业</h1><p>先学知识点，再完成练习。共60分钟。</p></header>
<p id="notice" role="status" aria-live="polite">正在加载题库…</p>
<section class="assignment"><h2 id="dayTitle">今日安排</h2><p id="focus"></p>
<p><a href="#tasks">知识点讲解与练习 ↓</a></p>
<p class="clock">剩余时间 <strong id="timer">60:00</strong></p>
<div class="actions"><button id="download" disabled>开始并下载PPT</button><a id="emailLink" href="mailto:xichen.app@gmail.com">发送作业（需添加附件）</a></div>
<p id="filename"></p>
<form id="completion"><fieldset disabled id="completionFields"><legend>完成作业</legend><div id="checks"></div>
<label>中断次数 <input id="interruptions" type="number" min="0" step="1" value="0" required style="width:100px"></label>
<button type="submit">保存打卡</button></fieldset></form><p id="result" role="status"></p></section>
<section id="tasks" aria-label="今日知识点与真题"></section>
<details><summary>答案解析</summary><div id="answers"></div></details>
<details class="assignment"><summary>复习其他作业</summary><label>选择学习日 <select id="daySelect"></select></label>
<button id="preview">查看该日安排</button><button id="backToday">返回当前作业</button>
</details>
</main><script src="../assets/vendor/pptxgen.bundle.js"></script><script src="study-session.js"></script><script src="study-ppt.js?v=20261010student"></script><script src="daily-study.js?v=20261010student"></script></body></html>
