<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阿拉伯语餐厅复习</title>
  <base href="../">
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dee8;
      --surface: #ffffff;
      --soft: #f4f7fb;
      --accent: #0f766e;
      --accent-strong: #0b5f59;
      --danger: #b42318;
      --success: #157347;
      --warning: #b86e00;
      --gold: #f0b429;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 8%, rgba(255, 207, 90, 0.34), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(136, 199, 255, 0.38), transparent 30%),
        linear-gradient(135deg, #fff8e8 0%, #eef8ff 48%, #f7efff 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      padding: 10px;
    }

    .topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: #17324d;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.75);
    }

    .title p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    .game {
      padding: 0;
      border-top: 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e7f6f3;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 700;
    }

    #categoryTag {
      display: none;
    }

    .select {
      flex: 1 1 0;
      min-width: 0;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 5px 8px;
    }

    .game-select {
      flex: 0 0 132px;
    }

    .checkin-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .checkin-link:hover {
      border-color: var(--accent);
      background: #e7f6f3;
    }

    .question {
      padding: 10px 12px;
      border: 2px solid #bad0df;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.9), rgba(248,251,254,.9)),
        radial-gradient(circle at 96% 12%, rgba(255, 207, 90, .28), transparent 24%);
      margin-bottom: 10px;
    }

    .question-label {
      display: none;
    }

    .chinese {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .choice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 10px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-weight: 700;
      box-shadow: 0 5px 12px rgba(31, 50, 71, 0.06);
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }

    .choice:hover:not(:disabled) {
      border-color: var(--accent);
      background: #f3fbf9;
      box-shadow: 0 9px 20px rgba(15, 118, 110, 0.12);
      transform: translateY(-1px);
    }

    .choice.correct {
      border-color: #9bd7b1;
      background: #ecfdf3;
      color: var(--success);
    }

    .choice.wrong {
      border-color: #f2a8a1;
      background: #fff3f2;
      color: var(--danger);
    }

    .choice-rom {
      display: none;
      overflow-wrap: anywhere;
    }

    .choice.show-rom {
      justify-content: space-between;
    }

    .choice.show-rom .choice-rom {
      display: inline;
    }

    .choice-arabic {
      direction: rtl;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
      white-space: nowrap;
    }

    .entry {
      display: grid;
      gap: 12px;
      padding-top: 0;
      border-top: 0;
    }

    .entry[hidden] {
      display: none;
    }

    .arabic-input {
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      direction: rtl;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 26px;
      line-height: 1.25;
      text-align: right;
      resize: vertical;
    }

    .arabic-input:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #checkButton,
    #hintButton,
    #restartPoemButton {
      display: none;
    }

    .primary,
    .secondary,
    .ghost {
      min-height: 40px;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    .secondary {
      border: 1px solid #d4a017;
      background: #fff8e6;
      color: #7a4c00;
    }

    .secondary.active {
      border-color: var(--accent);
      background: #e7f6f3;
      color: var(--accent-strong);
    }

    .ghost {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .feedback {
      display: none;
      color: var(--muted);
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.error {
      color: var(--danger);
    }

    .hint-box {
      display: none !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .hint-box[hidden] {
      display: none !important;
    }

    .poem-hints {
      display: grid;
      gap: 4px;
      margin: -4px 0 10px;
      padding: 8px 10px;
      border: 1px solid #f0d48a;
      border-radius: 8px;
      background: #fff8e6;
      color: #6b4500;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 800;
    }

    .poem-hints[hidden] {
      display: none;
    }

    .soft-keyboard {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .soft-key {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .soft-key.space {
      grid-column: span 7;
      font-size: 15px;
      letter-spacing: 0;
    }

    .soft-key:hover:not(:disabled) {
      border-color: var(--accent);
      background: #e7f6f3;
    }

    .soft-key.wrong {
      border-color: #f2a8a1;
      background: #fff3f2;
      color: var(--danger);
    }

    .soft-key:disabled {
      opacity: .42;
    }

    .game.poem-mode .chinese {
      font-size: 24px;
      line-height: 1.35;
    }

    .game.poem-mode .choices {
      display: none;
    }

    .game.poem-mode #hintButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .game.poem-mode #restartPoemButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .game.poem-mode .arabic-input {
      min-height: 116px;
      direction: ltr;
      font-family: "Microsoft YaHei", "Noto Serif SC", "SimSun", serif;
      font-size: 22px;
      line-height: 1.55;
      text-align: left;
      white-space: pre-wrap;
    }

    .game.poem-mode .soft-keyboard {
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      max-height: 260px;
      overflow: auto;
    }

    .game.poem-mode .soft-key {
      min-height: 38px;
      font-size: 21px;
    }

    .game.poem-mode .soft-key.used {
      border-color: #d0d5dd;
      background: #eef1f4;
      color: #98a2b3;
      box-shadow: none;
    }

    .game.poem-mode .soft-key.used:disabled {
      opacity: .58;
    }

    .hint-item {
      min-height: 66px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .hint-item > span {
      display: none;
    }

    .hint-value {
      font-size: 20px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .keycap {
      display: inline-grid;
      gap: 2px;
      min-width: 58px;
      min-height: 42px;
      place-items: center;
      padding: 5px 8px;
      border: 2px solid #344054;
      border-bottom-width: 5px;
      border-radius: 7px;
      background: #ffffff;
      color: #101828;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1;
      box-shadow: 0 2px 0 rgba(16, 24, 40, 0.12);
    }

    .keycap .key-main {
      font-size: 20px;
      font-weight: 900;
    }

    .keycap .key-label {
      color: var(--muted);
      font-size: 10px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 800;
      text-transform: uppercase;
    }

    .arabic-value {
      direction: rtl;
      text-align: right;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 22px;
      line-height: 1;
    }

    .side-stack {
      display: none;
      gap: 18px;
    }

    .puzzle {
      padding: 14px;
    }

    .puzzle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .puzzle-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .puzzle-board {
      position: relative;
      display: grid;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 2px solid #344054;
      border-radius: 8px;
      background: #dbe5ef;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.5);
    }

    .puzzle-cell {
      position: relative;
      z-index: 1;
      border: 1px dashed rgba(52, 64, 84, 0.28);
      background: rgba(255, 255, 255, 0.2);
    }

    .puzzle-cell.ready {
      outline: 3px solid rgba(15, 118, 110, 0.35);
      outline-offset: -3px;
    }

    .puzzle-piece {
      position: relative;
      width: 54px;
      aspect-ratio: 1;
      border: 2px solid #344054;
      border-radius: 7px;
      background-image: var(--puzzle-image);
      background-repeat: no-repeat;
      box-shadow: 0 4px 10px rgba(16, 24, 40, 0.18);
      cursor: grab;
      overflow: hidden;
    }

    .puzzle-piece:hover {
      transform: translateY(-1px) rotate(-1deg);
    }

    .puzzle-piece:active {
      cursor: grabbing;
    }

    .puzzle-piece.locked {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      cursor: default;
      transform: none;
    }

    .piece-tray {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 8px;
      min-height: 72px;
      max-height: 178px;
      margin-top: 12px;
      padding: 10px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78), rgba(244,247,251,.92));
    }

    .puzzle-note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .calendar-view {
      display: none;
      padding: 14px;
    }

    .calendar-view.active {
      display: block;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .calendar-header h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .calendar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .calendar-summary {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 4px 9px;
      border: 1px solid #9bd7b1;
      border-radius: 7px;
      background: #ecfdf3;
      color: var(--success);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .calendar-weekday,
    .calendar-day {
      min-height: 42px;
      border-radius: 7px;
      font-weight: 800;
    }

    .calendar-weekday {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .calendar-day {
      display: grid;
      align-content: start;
      gap: 4px;
      min-height: 96px;
      padding: 7px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .82);
    }

    .calendar-day.muted {
      opacity: .4;
    }

    .calendar-day.today {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px rgba(15, 118, 110, .18);
    }

    .calendar-date {
      font-size: 13px;
    }

    .calendar-source-list {
      display: grid;
      gap: 2px;
    }

    .calendar-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
      color: var(--ink);
      font-size: 11px;
      line-height: 1.2;
    }

    .calendar-source.done {
      color: var(--success);
    }

    .calendar-source-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .calendar-source-count {
      flex: 0 0 auto;
      color: inherit;
    }

    .main-view.hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .app {
        padding: 16px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

    }

    @media (max-width: 640px) {
      .choices {
        grid-template-columns: 1fr;
      }

      .chinese {
        font-size: 34px;
      }

      .game {
        padding: 16px;
      }

      .meta-row {
        flex-wrap: wrap;
      }

      .calendar-day {
        min-height: 82px;
        padding: 5px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar" aria-label="游戏信息">
      <div class="title">
        <h1>阿拉伯语餐厅复习</h1>
        <p>看中文选发音，选对后输入阿语。提示会给出下一个阿语字符和 Arabic 101 键盘按键。</p>
      </div>
    </section>

    <section class="layout main-view">
      <div class="panel game">
        <div class="meta-row">
          <span id="categoryTag" class="tag">基础问候</span>
          <select id="categorySelect" class="select" aria-label="题库分类">
            <option value="source:restaurant">餐厅题库</option>
            <option value="source:best-friend">Best Friend 题库</option>
            <option value="source:daily-poems">每日古诗词</option>
          </select>
          <select id="gameSelect" class="select game-select" aria-label="选择游戏">
            <option value="games/space-shooter.html">雷电</option>
            <option value="games/pikachu-volleyball/zh/index.html?v=20260614life">Pikachu</option>
            <option value="need_for_speed/Need%20for%20Speed%20II%20SE%20-%20Play%20in%20Browser%20for%20Free%20-%20Retro%20Online.html">极品飞车2</option>
          </select>
          <a id="checkinLink" class="checkin-link" href="#checkin">每日打卡</a>
        </div>

        <div class="question">
          <p class="question-label">中文</p>
          <p id="chinesePrompt" class="chinese">你好</p>
        </div>
        <div id="poemHints" class="poem-hints" aria-live="polite" hidden></div>

        <div id="choices" class="choices" aria-label="发音选项"></div>

        <div id="entry" class="entry" hidden>
          <textarea id="arabicInput" class="arabic-input" dir="rtl" lang="ar" rows="4" autocomplete="off" spellcheck="false" aria-label="阿语输入"></textarea>
          <div class="actions">
            <button id="checkButton" class="primary" type="button">检查输入</button>
            <button id="hintButton" class="secondary" type="button" aria-pressed="false">提示：关</button>
            <button id="restartPoemButton" class="ghost" type="button">重新开始</button>
            <button id="nextButton" class="ghost" type="button" disabled>下一题</button>
          </div>
          <div id="softKeyboard" class="soft-keyboard" aria-label="Arabic soft keyboard"></div>
          <div class="hint-box" aria-live="polite" hidden>
            <div class="hint-item">
              <span>下一个字符</span>
              <div id="nextChar" class="hint-value arabic-value">-</div>
            </div>
            <div class="hint-item">
              <span>键盘按键</span>
              <div id="nextKey" class="hint-value">-</div>
            </div>
            <div class="hint-item">
              <span>字符读音</span>
              <div id="nextPronunciation" class="hint-value">-</div>
            </div>
          </div>
        </div>

        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>

      <div class="side-stack">
        <section class="panel puzzle" aria-label="拼图小游戏">
          <div class="puzzle-header">
            <h2>拼图画布</h2>
            <span id="puzzleProgress" class="tag">0/0</span>
          </div>
          <div id="puzzleBoard" class="puzzle-board"></div>
          <div id="pieceTray" class="piece-tray" aria-label="已解锁拼图碎片"></div>
          <p id="puzzleStatus" class="puzzle-note">完成题目解锁拼图碎片。</p>
        </section>

      </div>
    </section>

    <section id="calendarView" class="panel calendar-view" aria-label="每日打卡日历">
      <div class="calendar-header">
        <h2 id="calendarTitle">每日打卡</h2>
        <div class="calendar-actions">
          <span id="todayProgressSummary" class="calendar-summary">今天已做 0 题</span>
          <button id="prevMonthButton" class="ghost" type="button" aria-label="上个月">&lt;</button>
          <button id="todayButton" class="secondary" type="button">今天</button>
          <button id="nextMonthButton" class="ghost" type="button" aria-label="下个月">&gt;</button>
          <a id="practiceLink" class="checkin-link" href="#">返回练习</a>
        </div>
      </div>
      <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="games/daily-poems.js"></script>
  <script>
    const questions = [
      { category: "基础问候", zh: "你好", ar: "مرحبا", rom: "marhaban" },
      { category: "基础问候", zh: "欢迎光临", ar: "أهلا وسهلا", rom: "ahlan wa sahlan" },
      { category: "基础问候", zh: "再见", ar: "مع السلامة", rom: "ma'a as-salamah" },
      { category: "基础问候", zh: "谢谢光临", ar: "شكرا لزيارتكم", rom: "shukran liziyaratikum" },
      { category: "基础问候", zh: "谢谢", ar: "شكرا", rom: "shukran" },

      { category: "餐厅常用句子", zh: "菜单上有什么？", ar: "ماذا يوجد في القائمة؟", rom: "madha yujad fi al-qa'imah" },
      { category: "餐厅常用句子", zh: "你想点什么？", ar: "ماذا تريد أن تطلب؟", rom: "madha turid an tatlub" },

    function localDateKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function dubaiDateKey(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Dubai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const value = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return `${value.year}-${value.month}-${value.day}`;
    }

    function daysBetween(startKey, endKey) {
      return Math.floor((Date.parse(`${endKey}T00:00:00Z`) - Date.parse(`${startKey}T00:00:00Z`)) / 86400000);
    }

    function positiveModulo(value, length) {
      return ((value % length) + length) % length;
    }

    function hashString(value) {
      let hash = 2166136261;
      for (const char of value) {
        hash ^= char.codePointAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function seededRandom(seed) {
      let state = seed >>> 0;
      return () => {
        state = Math.imul(state + 0x6d2b79f5, 1);
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function seededShuffle(items, seedText) {
      const result = [...items];
      const random = seededRandom(hashString(seedText));
      for (let index = result.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function dailyProgressIndexes(source = activeSource(), dateKey = localDateKey()) {
      const progress = loadDailyProgress();
      const byDate = progress[dateKey];
      const indexes = byDate && Array.isArray(byDate[source]) ? byDate[source] : [];
      const sourceTotal = sourceQuestions(source).length;
      const validIndexes = indexes.filter((index) => Number.isInteger(index) && index >= 0 && index < sourceTotal);
      if (validIndexes.length) return validIndexes;

      const checkins = loadCheckins();
      const completedSources = Array.isArray(checkins[dateKey]) ? checkins[dateKey] : [];
      if (completedSources.includes(source)) {
        return sourceQuestions(source).map((_, index) => index);
      }
      return [];
    }

    function markDailyQuestionComplete(source, questionIndex, dateKey = localDateKey()) {
      if (questionIndex < 0) return false;
      const progress = loadDailyProgress();
      progress[dateKey] ||= {};
      const indexes = Array.isArray(progress[dateKey][source]) ? progress[dateKey][source] : [];
      if (indexes.includes(questionIndex)) return false;
      progress[dateKey][source] = [...indexes, questionIndex].sort((a, b) => a - b);
      saveDailyProgress(progress);
      return true;
    }

    function dailyProgressBySource(dateKey) {
      const progress = loadDailyProgress();
      const byDate = progress[dateKey];
      const result = {};

      if (byDate && typeof byDate === "object") {
        Object.entries(byDate).forEach(([source, indexes]) => {
          if (!Array.isArray(indexes)) return;
          const sourceTotal = sourceQuestions(source).length;
          result[source] = indexes.filter((index) => Number.isInteger(index) && index >= 0 && index < sourceTotal);
        });
      }

      if (dateKey === localDateKey()) {
        Object.entries(completedByGroup).forEach(([source, indexes]) => {
          if (!(indexes instanceof Set)) return;
          const merged = new Set([...(result[source] || []), ...indexes]);
          const sourceTotal = sourceQuestions(source).length;
          result[source] = [...merged].filter((index) => Number.isInteger(index) && index >= 0 && index < sourceTotal);
        });
      }

      return result;
    }

    function dailyProgressSummaries(dateKey) {
      const byDate = dailyProgressBySource(dateKey);
      const checkins = loadCheckins();
      const completedSources = new Set(Array.isArray(checkins[dateKey]) ? checkins[dateKey] : []);
      const sources = new Set([...Object.keys(byDate), ...completedSources]);

      return [...sources]
        .map((source) => {
          const total = sourceQuestions(source).length;
          const completedCount = completedSources.has(source)
            ? total
            : new Set((byDate[source] || []).filter((index) => Number.isInteger(index) && index >= 0 && index < total)).size;
          return {
            source,
            label: sourceConfig[source]?.label || source,
            completedCount,
            total,
            done: total > 0 && completedCount >= total
          };
        })
        .filter((item) => item.completedCount > 0 || item.done)
        .sort((left, right) => {
          const order = ["restaurant", "best-friend", poemSourceKey];
          const leftIndex = order.indexOf(left.source);
          const rightIndex = order.indexOf(right.source);
          return (leftIndex === -1 ? 99 : leftIndex) - (rightIndex === -1 ? 99 : rightIndex);
        });
    }

      if (!summaries.length) return "今天已做 0 题";
      return `今天：${summaries.map((item) => `${item.label} ${item.completedCount}/${item.total}`).join(" · ")}`;
    }

    function renderCalendar() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const todayKey = localDateKey();
      const first = new Date(year, month, 1);
      const start = new Date(year, month, 1 - first.getDay());
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];

      elements.calendarTitle.textContent = `每日打卡 · ${year}年${month + 1}月`;
      elements.todayProgressSummary.textContent = dailyProgressSummaryText(todayKey);
      elements.calendarGrid.replaceChildren();
      weekdays.forEach((weekday) => {
        const cell = document.createElement("div");
        cell.className = "calendar-weekday";
        cell.textContent = weekday;
        elements.calendarGrid.append(cell);
      });

      for (let index = 0; index < 42; index += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        const dateKey = localDateKey(date);
        const day = document.createElement("div");
        day.className = "calendar-day";
        if (date.getMonth() !== month) day.classList.add("muted");
        if (dateKey === todayKey) day.classList.add("today");

        const number = document.createElement("div");
        number.className = "calendar-date";
        number.textContent = String(date.getDate());
        day.append(number);

        const summaries = dailyProgressSummaries(dateKey);
        if (summaries.length) {
          const list = document.createElement("div");
          list.className = "calendar-source-list";
          summaries.forEach((summary) => {
            const item = document.createElement("div");
            item.className = `calendar-source${summary.done ? " done" : ""}`;
            item.title = `${summary.label} ${summary.completedCount}/${summary.total}`;
            const name = document.createElement("span");
            name.className = "calendar-source-name";
            name.textContent = summary.label;
            const count = document.createElement("span");
            count.className = "calendar-source-count";
            count.textContent = `${summary.done ? "✓ " : ""}${summary.completedCount}/${summary.total}`;
            item.append(name, count);
            list.append(item);
          });
          day.append(list);
        }

        elements.calendarGrid.append(day);
      }
    }

    function normalizeAnswer(value) {

        .replace(/[ـ\u064B-\u0652]/g, "")

    function normalizeLive(value) {

    function nextInputChar(answer, typed) {

    function isHanChar(char) {
      return /[\u3400-\u9fff\uf900-\ufaff]/.test(char);
    }

    function poemRequiredChars(question = current) {
      return Array.from(question?.ar || "").filter(isHanChar);

    function poemTypedChars() {
      return Array.from(elements.arabicInput.value).filter(isHanChar);
    }

    function composePoemInput(answer, typedChars) {
      let output = "";
      let used = 0;
      for (const char of Array.from(answer)) {
        if (isHanChar(char)) {
          if (used >= typedChars.length) break;
          output += typedChars[used];
          used += 1;
        } else if (used > 0 && used <= typedChars.length) {
          output += char;
        }
      }
      return output;
    }

    function setPoemTypedChars(chars) {
      elements.arabicInput.value = composePoemInput(current.ar, chars);
      elements.arabicInput.setSelectionRange(elements.arabicInput.value.length, elements.arabicInput.value.length);

    function savePoemDraft(question = current) {
      if (!isPoemQuestion(question) || completedCurrent) return;
      const key = poemDraftKey(question);
      if (!key) return;
      const drafts = loadPoemDrafts();
      drafts[key] = poemTypedChars().join("");
      savePoemDrafts(drafts);
    }

    function loadPoemDraft(question = current) {
      if (!isPoemQuestion(question)) return [];
      const value = loadPoemDrafts()[poemDraftKey(question)] || "";
      const required = poemRequiredChars(question);
      return Array.from(value).filter((char, index) => char === required[index]);
    }

    function clearPoemDraft(question = current) {
      if (!isPoemQuestion(question)) return;
      const drafts = loadPoemDrafts();
      delete drafts[poemDraftKey(question)];
      savePoemDrafts(drafts);
    }

    function poemCharCounts(chars) {
      return chars.reduce((counts, char) => {
        counts[char] = (counts[char] || 0) + 1;
        return counts;
      }, {});
    }

    function nextPoemChar() {
      return poemRequiredChars()[poemTypedChars().length] || "";
    }

    function poemKeyboardLetters(question = current) {
      return poemRequiredChars(question).sort((left, right) => left.localeCompare(right, "zh-Hans-CN"));
    }

    function displayChar(char) {
      if (char === " ") return "空格";
      return char || "-";
    }

    function keyForChar(char) {
      if (arabicKeyboardFallbackMap[char]) return arabicKeyboardFallbackMap[char];
      if (arabicKeyMap[char]) return arabicKeyMap[char];

      const match = Object.entries(arabicCodeMap).find(([, values]) => values.includes(char));
      if (!match) return char || "-";

      const [code, values] = match;
      const shifted = values[1] === char;
      const labels = {
        Backquote: "`",
        BracketLeft: "[",
        BracketRight: "]",
        Semicolon: ";",
        Quote: "'",
        Comma: ",",
        Period: ".",
        Slash: "/",
        Space: "Space"
      };
      const key = labels[code] || code.replace(/^Key/, "");
      return shifted ? `Shift + ${key}` : key;
    }

    function keyLabelFor(key) {
      const labels = {
        "'": "Quote",
        "`": "Backquote",
        ",": "Comma",
        ".": "Period",
        "/": "Slash",
        ";": "Semicolon",
        "[": "Left bracket",
        "]": "Right bracket",
        "Shift + /": "Shift + Slash",
        "Shift + K": "Shift + K",
        "Shift + ;": "Shift + Semicolon",
        "Space": "Spacebar"
      };
      return labels[key] || "";
    }

    function renderKeyHint(char) {
      elements.nextKey.replaceChildren();

      const key = keyForChar(char);
      if (key === "-" || key === char) {
        elements.nextKey.textContent = "-";
        return;
      }

      const keycap = document.createElement("span");
      keycap.className = "keycap";

      const main = document.createElement("span");
      main.className = "key-main";
      main.textContent = key;
      keycap.append(main);

      const labelText = keyLabelFor(key);
      if (labelText) {
        const label = document.createElement("span");
        label.className = "key-label";
        label.textContent = labelText;
        keycap.append(label);
      }

      elements.nextKey.append(keycap);
    }

    function pronunciationForChar(char) {
      return arabicPronunciationMap[char] || char || "-";
    }

    function normalizeArabicForSpeech(text) {
      if ([...text].length <= 2) return text;
      return text.replace(/ة(?=\s|$|؟)/g, "ا");
    }

    function speechUrl(text) {
      return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q=${encodeURIComponent(text)}`;
    }

    function chineseSpeechUrl(text) {
      return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=${encodeURIComponent(text)}`;
    }

    function preloadArabic(text) {
      const speechText = normalizeArabicForSpeech(text);
      if (!speechText.trim() || preloadedSpeech.has(speechText)) return;

      const audio = new Audio(speechUrl(speechText));
      audio.preload = "auto";
      preloadedSpeech.set(speechText, audio);
      audio.load();
    }

    function audioKey(text) {
      return [...text].map((char) => {
        const codePoint = char.codePointAt(0) === 0x0649 ? 0x0627 : char.codePointAt(0);
        return `u${codePoint.toString(16).padStart(4, "0")}`;
      }).join("-");
    }

    function keyAudioPath(char) {
      return arabicSoundMap[char] ? `assets/audio/letters/${audioKey(char)}.mp3?v=${keyAudioVersion}` : "";
    }

    function preloadKeyAudio(char) {
      const path = keyAudioPath(char);
      if (!path) return Promise.resolve();
      if (keyAudioElements.has(path)) return Promise.resolve(keyAudioElements.get(path));

      const audio = new Audio(path);
      audio.preload = "auto";
      keyAudioElements.set(path, audio);
      audio.load();
      return Promise.resolve(audio);
    }

    function playKeyAudio(char) {
      const path = keyAudioPath(char);
      if (!path) return Promise.reject();

      preloadKeyAudio(char);
      const cached = keyAudioElements.get(path);
      if (!cached) return Promise.reject();

      const audio = cached.cloneNode();
      audio.currentTime = 0;
      currentAudio = audio;
      return new Promise((resolve, reject) => {
        audio.addEventListener("ended", () => {
          if (currentAudio === audio) currentAudio = null;
          resolve();
        }, { once: true });
        audio.addEventListener("error", () => {
          if (currentAudio === audio) currentAudio = null;
          reject();
        }, { once: true });
        audio.play().catch(() => {
          if (currentAudio === audio) currentAudio = null;
          reject();
        });
      });
    }

    function preloadChineseKeyAudio(char) {
      const url = chineseSpeechUrl(char);
      if (!char || chineseAudioElements.has(url)) return Promise.resolve(chineseAudioElements.get(url));

      const audio = new Audio(url);
      audio.preload = "auto";
      chineseAudioElements.set(url, audio);
      audio.load();
      return Promise.resolve(audio);
    }

    function playChineseKeyAudio(char) {
      const url = chineseSpeechUrl(char);
      if (!char) return Promise.reject();

      preloadChineseKeyAudio(char);
      const cached = chineseAudioElements.get(url);
      if (!cached) return Promise.reject();

      const audio = cached.cloneNode();
      audio.currentTime = 0;
      currentAudio = audio;
      return new Promise((resolve, reject) => {
        audio.addEventListener("ended", () => {
          if (currentAudio === audio) currentAudio = null;
          resolve();
        }, { once: true });
        audio.addEventListener("error", () => {
          if (currentAudio === audio) currentAudio = null;
          reject();
        }, { once: true });
        audio.play().catch(() => {
          if (currentAudio === audio) currentAudio = null;
          reject();
        });
      });
    }

    function preloadCurrentQuestionAudio() {
      if (!current) return Promise.resolve();
      if (isPoemQuestion(current)) {
        const loads = [...new Set(poemKeyboardLetters(current))].map(preloadChineseKeyAudio);
        return Promise.allSettled(loads);
      }

      preloadArabic(current.ar);
      const loads = [...new Set(inputChars(current.ar))].map((char) => {
        const sound = arabicSoundMap[char];
        if (sound && sound !== "-") {
          return preloadKeyAudio(char);
        }
        return Promise.resolve();
      });
      return Promise.allSettled(loads);
    }

    function preloadSoftKeyboardAudio() {
      softKeyboardLetters.forEach((char) => {
        const sound = arabicSoundMap[char];
        if (sound && sound !== "-") {
          preloadKeyAudio(char);
        }
      });
    }

    function speakArabic(text) {
      const speechText = normalizeArabicForSpeech(text);
      if (!speechText.trim()) return Promise.resolve();

      const url = speechUrl(speechText);
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (currentSpeechFinish) {
        currentSpeechFinish();
      }
      const audio = new Audio(url);
      currentAudio = audio;
      return new Promise((resolve) => {
        let settled = false;
        const fallbackTimer = setTimeout(() => finish(), 8000);
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(fallbackTimer);
          if (currentAudio === audio) {
            currentAudio = null;
          }
          if (currentSpeechFinish === finish) {
            currentSpeechFinish = null;
          }
          resolve();
        };
        currentSpeechFinish = finish;
        audio.addEventListener("ended", finish, { once: true });
        audio.addEventListener("error", () => {
          speakArabicWithBrowserVoice(speechText).then(finish);
        }, { once: true });
        audio.play().catch(() => speakArabicWithBrowserVoice(speechText).then(finish));
      });
    }

    function speakArabicWithBrowserVoice(text) {
      if (!("speechSynthesis" in window)) {
        elements.feedback.textContent = "当前浏览器不支持语音播放。";
        elements.feedback.className = "feedback error";
        return Promise.resolve();
      }

      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ar-SA";
      utterance.voice = voices.find((voice) => voice.lang.toLowerCase().startsWith("ar")) || null;
      utterance.rate = 0.8;
      utterance.volume = 1;
      return new Promise((resolve) => {
        utterance.onend = resolve;
        utterance.onerror = resolve;
        window.speechSynthesis.speak(utterance);
      });
    }

    function speakChineseWithBrowserVoice(text) {
      if (!("speechSynthesis" in window) || !text) {
        return Promise.resolve();
      }

      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.voice =
        voices.find((voice) => voice.lang.toLowerCase() === "zh-cn") ||
        voices.find((voice) => voice.lang.toLowerCase().startsWith("zh")) ||
        null;
      utterance.rate = 0.82;
      utterance.volume = 1;
      return new Promise((resolve) => {
        utterance.onend = resolve;
        utterance.onerror = resolve;
        window.speechSynthesis.speak(utterance);
      });
    }

    function speakChinese(text) {
      if (!text) return Promise.resolve();

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (currentSpeechFinish) {
        currentSpeechFinish();
      }
      return playChineseKeyAudio(text).catch(() => speakChineseWithBrowserVoice(text));
    }

    function speakKeySound(text) {
      const sound = arabicSoundMap[text];
      if (!sound || sound === "-") return Promise.resolve();
      return playKeyAudio(text).catch((error) => {
        console.warn("Local key audio failed", text, keyAudioPath(text), error);
        return Promise.resolve();
      });
    }

    function insertAtCursor(input, text) {
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = `${input.value.slice(0, start)}${text}${input.value.slice(end)}`;
      const nextPosition = start + text.length;
      input.setSelectionRange(nextPosition, nextPosition);
      updateLiveInput();
    }

    function activeSource() {
      if (elements.categorySelect.value === "source:daily-poems") return poemSourceKey;
      return elements.categorySelect.value === "source:best-friend" ? "best-friend" : "restaurant";
    }

    function isPoemSource(source = activeSource()) {
      return source === poemSourceKey;
    }

    function isPoemQuestion(question = current) {
      return question?.source === poemSourceKey;
    }

    function poemText(work) {
      return (work.fullText || []).join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function poemHanCharCount(work) {
      return Array.from(poemText(work)).filter(isHanChar).length;
    }

    function poemHintLines(question = current) {
      if (!isPoemQuestion(question)) return [];
      return (question.fullText || [])
        .flatMap((line) => (line.match(/[^。！？；]+[。！？；]?/g) || [line]))
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function resetPoemHints() {
      poemHintLineIndex = 0;
      elements.poemHints.replaceChildren();
      elements.poemHints.hidden = true;
    }

    function updatePoemHintButton() {
      if (!isPoemQuestion()) return;
      const remaining = poemHintLineIndex < poemHintLines().length;
      elements.hintButton.disabled = completedCurrent || !remaining;
      elements.hintButton.textContent = remaining ? "提示一句" : "提示已完";
      elements.hintButton.classList.toggle("active", poemHintLineIndex > 0);
      elements.hintButton.setAttribute("aria-pressed", poemHintLineIndex > 0 ? "true" : "false");
    }

    function revealPoemHintLine() {
      const lines = poemHintLines();
      if (!lines[poemHintLineIndex]) {
        updatePoemHintButton();
        return;
      }

      const item = document.createElement("div");
      item.textContent = `${poemHintLineIndex + 1}. ${lines[poemHintLineIndex]}`;
      elements.poemHints.append(item);
      elements.poemHints.hidden = false;
      poemHintLineIndex += 1;
      updatePoemHintButton();
    }

    function buildPoemQuestion(work, index, todayIndex, dateKey) {
      const answer = poemText(work);
      return {
        ...work,
        source: poemSourceKey,
        category: index === todayIndex ? "今日古诗词" : "往日古诗词",
        zh: `${index === todayIndex ? "今日" : "复习"}：${work.title} · ${work.author}\n按顺序点击汉字默写正文，标点会自动补齐。`,
        ar: answer,
        rom: `${work.title}-${work.author}`,
        id: `${poemSourceKey}-${dateKey}-${index}`,
        poemIndex: index,
        todayPoem: index === todayIndex
      };
    }

    function loadDailyPoemSelections() {
      try {
        const parsed = JSON.parse(localStorage.getItem(dailyPoemSelectionStorageKey) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveDailyPoemSelections(selections) {
      localStorage.setItem(dailyPoemSelectionStorageKey, JSON.stringify(selections));
    }

    function usedReviewPoemIndexes(selections, currentDateKey) {
      const used = new Set();
      Object.entries(selections).forEach(([dateKey, selection]) => {
        if (dateKey === currentDateKey || !selection || !Array.isArray(selection.reviewIndexes)) return;
        selection.reviewIndexes.forEach((index) => {
          if (Number.isInteger(index)) used.add(index);
        });
      });
      return used;
    }

    function validStoredPoemSelection(selection, recentIndexes, reviewPoolIndexes) {
      if (!selection ||
        selection.version !== dailyPoemSelectionVersion ||
        !Array.isArray(selection.recentIndexes) ||
        !Array.isArray(selection.reviewIndexes)) return false;
      if (selection.recentIndexes.length !== recentIndexes.length) return false;
      if (selection.reviewIndexes.length > dailyPoemReviewCount) return false;
      if (!selection.recentIndexes.every((index, position) => index === recentIndexes[position])) return false;
      const reviewPoolSet = new Set(reviewPoolIndexes);
      const uniqueReviews = new Set(selection.reviewIndexes);
      return uniqueReviews.size === selection.reviewIndexes.length &&
        selection.reviewIndexes.every((index) => Number.isInteger(index) && reviewPoolSet.has(index));
    }

    function dailyPoemSelection(dateKey, recentIndexes, reviewPoolIndexes) {
      const selections = loadDailyPoemSelections();
      const stored = selections[dateKey];
      if (validStoredPoemSelection(stored, recentIndexes, reviewPoolIndexes)) {
        return stored;
      }

      const usedReviews = usedReviewPoemIndexes(selections, dateKey);
      const candidateIndexes = reviewPoolIndexes.filter((index) => !usedReviews.has(index));
      const reviewIndexes = seededShuffle(candidateIndexes, `poem-review:${dateKey}`)
        .slice(0, Math.min(dailyPoemReviewCount, candidateIndexes.length));
      const selection = {
        version: dailyPoemSelectionVersion,
        recentIndexes,
        reviewIndexes
      };
      selections[dateKey] = selection;
      saveDailyPoemSelections(selections);
      return selection;
    }

    function dailyPoemQuestions(dateKey = dubaiDateKey()) {
      if (poemQuestionsByDate[dateKey]) return poemQuestionsByDate[dateKey];
      if (!poemWorks.length) return [];

      const dayIndex = daysBetween(poemRotationStartKey, dateKey);
      const todayIndex = positiveModulo(dayIndex, poemWorks.length);
      const recentIndexes = [];
      for (let offset = 0; offset < Math.min(dailyPoemRecentCount, Math.max(0, dayIndex) + 1); offset += 1) {
        const index = positiveModulo(dayIndex - offset, poemWorks.length);
        if (!recentIndexes.includes(index)) recentIndexes.push(index);
      }

      const historicalIndexes = [];
      const seen = new Set(recentIndexes);
      const historyLength = Math.max(0, dayIndex);
      for (let offset = 0; offset < historyLength; offset += 1) {
        const index = positiveModulo(offset, poemWorks.length);
        if (!seen.has(index) && poemHanCharCount(poemWorks[index]) <= dailyPoemRandomMaxChars) {
          seen.add(index);
          historicalIndexes.push(index);
        }
      }

      const selection = dailyPoemSelection(dateKey, recentIndexes, historicalIndexes);
      poemQuestionsByDate[dateKey] = [...selection.recentIndexes, ...selection.reviewIndexes]
        .map((index) => buildPoemQuestion(poemWorks[index], index, todayIndex, dateKey));
      return poemQuestionsByDate[dateKey];
    }

    function sourceQuestions(source) {
      if (isPoemSource(source)) return dailyPoemQuestions();
      return allQuestions.filter((item) => item.source === source);
    }

    function progressKey(source = activeSource()) {
      return source;
    }

    function completedSet(key = progressKey()) {
      completedByGroup[key] ||= new Set(dailyProgressIndexes(key));
      return completedByGroup[key];
    }

    function placedMap(key = progressKey()) {
      return {};
    }

    function activeQuestions() {
      return sourceQuestions(activeSource());
    }

    function sourcePieceIndex(question) {
      return activeQuestions().findIndex((item) => item.id === question.id);
    }

    function incompleteQuestions() {
      const completed = completedSet();
      return activeQuestions().filter((question, index) => !completed.has(index));
    }

    function activePuzzleImage(source = activeSource()) {
      const discoveredImages = availablePuzzleImages.filter(Boolean);
      const images = sourceConfig[source].puzzleImages.length ? sourceConfig[source].puzzleImages : discoveredImages;
      if (!images.length) return "0.png";
      return images[0];
    }

    function cropImageToSquareDataUrl(image) {
      const side = Math.min(image.naturalWidth, image.naturalHeight);
      const sx = Math.floor((image.naturalWidth - side) / 2);
      const sy = Math.floor((image.naturalHeight - side) / 2);
      const canvas = document.createElement("canvas");
      canvas.width = side;
      canvas.height = side;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, sx, sy, side, side, 0, 0, side, side);
      return canvas.toDataURL("image/png");
    }

    function discoverPuzzleImages() {
      puzzleImageCandidates.forEach((src, index) => {
        const image = new Image();
        image.onload = () => {
          availablePuzzleImages[index] = cropImageToSquareDataUrl(image);
          renderPuzzle();
        };
        image.src = src;
      });
    }

    function trayOrder(key = progressKey()) {
      trayOrderByGroup[key] ||= shuffle(Array.from({ length: puzzleSize }, (_, index) => index));
      return trayOrderByGroup[key];
    }

    function pieceStyle(index, cols, rows) {
      const col = index % cols;
      const row = Math.floor(index / cols);
      const x = cols === 1 ? 0 : (col / (cols - 1)) * 100;
      const y = rows === 1 ? 0 : (row / (rows - 1)) * 100;
      return {
        backgroundSize: `${cols * 100}% ${rows * 100}%`,
        backgroundPosition: `${x}% ${y}%`
      };
    }

    function createPuzzlePiece(source, index, dims, locked = false) {
      const piece = document.createElement("div");
      piece.className = locked ? "puzzle-piece locked" : "puzzle-piece";
      piece.dataset.index = String(index);
      piece.style.setProperty("--puzzle-image", `url("${activePuzzleImage(source)}")`);
      const style = pieceStyle(index, dims.cols, dims.rows);
      piece.style.backgroundSize = style.backgroundSize;
      piece.style.backgroundPosition = style.backgroundPosition;
      piece.draggable = true;
      piece.title = "拖到拼图画布的任意空格";
      piece.addEventListener("dragstart", () => {
        draggedPieceIndex = index;
      });
      piece.addEventListener("dragend", () => {
        draggedPieceIndex = null;
      });
      return piece;
    }

    function renderPuzzle() {
      const source = activeSource();
      const items = activeQuestions();
      const dims = { cols: puzzleGrid, rows: puzzleGrid };
      const completed = completedSet();
      const placed = placedMap();
      const placedPieces = new Set(Object.values(placed).map(Number));

      elements.puzzleBoard.style.setProperty("--puzzle-image", `url("${activePuzzleImage(source)}")`);
      elements.puzzleBoard.style.gridTemplateColumns = `repeat(${dims.cols}, 1fr)`;
      elements.puzzleBoard.style.gridTemplateRows = `repeat(${dims.rows}, 1fr)`;
      elements.puzzleBoard.replaceChildren();
      elements.pieceTray.replaceChildren();
      elements.pieceTray.ondragover = (event) => {
        if (draggedPieceIndex !== null && completed.has(draggedPieceIndex)) {
          event.preventDefault();
        }
      };
      elements.pieceTray.ondrop = (event) => {
        event.preventDefault();
        if (draggedPieceIndex === null) return;
        Object.keys(placed).forEach((cellIndex) => {
          if (Number(placed[cellIndex]) === draggedPieceIndex) {
            delete placed[cellIndex];
          }
        });
        elements.puzzleStatus.textContent = "碎片已放回待拼区。";
        renderPuzzle();
      };

      Array.from({ length: puzzleSize }).forEach((_, index) => {
        const cell = document.createElement("div");
        cell.className = "puzzle-cell";
        cell.dataset.index = String(index);
        cell.addEventListener("dragover", (event) => {
          if (draggedPieceIndex !== null && completed.has(draggedPieceIndex)) {
            event.preventDefault();
            cell.classList.add("ready");
          }
        });
        cell.addEventListener("dragleave", () => {
          cell.classList.remove("ready");
        });
        cell.addEventListener("drop", (event) => {
          event.preventDefault();
          cell.classList.remove("ready");
          if (draggedPieceIndex === null || !completed.has(draggedPieceIndex)) {
            return;
          }
          if (placed[index] !== undefined && Number(placed[index]) !== draggedPieceIndex) {
            elements.puzzleStatus.textContent = "这个格子已经有碎片了，换一个空格试试。";
            return;
          }
          Object.keys(placed).forEach((cellIndex) => {
            if (Number(placed[cellIndex]) === draggedPieceIndex) {
              delete placed[cellIndex];
            }
          });
          placed[index] = draggedPieceIndex;
          renderPuzzle();
          emitMetrics("puzzle-piece-placed");
        });

        if (placed[index] !== undefined) {
          cell.append(createPuzzlePiece(source, Number(placed[index]), dims, true));
        }
        elements.puzzleBoard.append(cell);
      });

      [...completed]
        .filter((index) => !placedPieces.has(index))
        .sort((a, b) => trayOrder().indexOf(a) - trayOrder().indexOf(b))
        .forEach((index) => {
          elements.pieceTray.append(createPuzzlePiece(source, index, dims));
        });

      elements.puzzleProgress.textContent = `${completed.size}/${puzzleSize}`;
      if (Object.keys(placed).length === puzzleSize) {
        elements.puzzleStatus.textContent = "拼图完成！";
      } else if (completed.size === puzzleSize) {
        elements.puzzleStatus.textContent = "所有碎片已解锁，可以完成拼图了。";
      } else {
        elements.puzzleStatus.textContent = `完成本组未做过的题目来解锁碎片，还剩 ${puzzleSize - completed.size} 块。`;
      }
      emitMetrics("puzzle-rendered");
    }

    function drawQuestion() {
      const pending = incompleteQuestions();
      const available = pending.length ? pending : activeQuestions();
      const pendingTodayPoem = isPoemSource() && pending.find((item) => item.todayPoem);
      let nextQuestion = null;
      if (pendingTodayPoem) {
        nextQuestion = pendingTodayPoem;
        pool = pool.filter((item) => item !== nextQuestion && available.includes(item));
      } else if (!pool.length || !pool.some((item) => available.includes(item))) {
        pool = shuffle(available);
      } else {
        pool = pool.filter((item) => available.includes(item));
      }

      if (completionSpeechTimer) {
        clearTimeout(completionSpeechTimer);
        completionSpeechTimer = null;
      }
      current = nextQuestion || pool.pop();
      selectedCorrect = isPoemQuestion(current);
      hintEnabled = true;
      completedCurrent = false;
      lastValidInput = "";
      resetPoemHints();

      elements.gamePanel.classList.toggle("poem-mode", isPoemQuestion(current));
      elements.categoryTag.textContent = current.category;
      elements.chinesePrompt.textContent = current.zh;
      elements.entry.hidden = !isPoemQuestion(current);
      elements.arabicInput.dir = isPoemQuestion(current) ? "ltr" : "rtl";
      elements.arabicInput.lang = isPoemQuestion(current) ? "zh-CN" : "ar";
      elements.arabicInput.setAttribute("aria-label", isPoemQuestion(current) ? "古诗词默写输入" : "阿语输入");
      elements.arabicInput.value = "";
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.nextButton.disabled = true;
      elements.hintButton.disabled = !isPoemQuestion(current);
      elements.hintButton.textContent = isPoemQuestion(current) ? "提示一句" : "提示：关";
      elements.hintButton.classList.toggle("active", !isPoemQuestion(current));
      elements.hintButton.setAttribute("aria-pressed", isPoemQuestion(current) ? "false" : "true");
      elements.restartPoemButton.disabled = !isPoemQuestion(current);
      elements.checkButton.disabled = true;
      if (isPoemQuestion(current)) {
        const draftChars = loadPoemDraft(current);
        if (draftChars.length) {
          elements.arabicInput.value = composePoemInput(current.ar, draftChars);
          lastValidInput = elements.arabicInput.value;
        }
      }
      preloadCurrentQuestionAudio();
      updateLiveInput();
      renderChoices();
      renderSoftKeyboard();
      updatePoemHintButton();
      emitMetrics("question-loaded");
    }

    function renderChoices() {
      if (isPoemQuestion()) {
        elements.choices.replaceChildren();
        return;
      }

      const wrongOptions = shuffle(allQuestions.filter((item) => item.rom !== current.rom))
        .slice(0, 3)
        .map((item) => ({ rom: item.rom, ar: item.ar, correct: false }));
      const options = shuffle([{ rom: current.rom, ar: current.ar, correct: true }, ...wrongOptions]);

      elements.choices.replaceChildren();
      options.forEach((option) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.dataset.correct = option.correct ? "true" : "false";
        const rom = document.createElement("span");
        rom.className = "choice-rom";
        rom.textContent = option.rom;
        const arabic = document.createElement("span");
        arabic.className = "choice-arabic";
        arabic.lang = "ar";
        arabic.dir = "rtl";
        arabic.textContent = option.ar;
        button.append(rom, arabic);
        button.addEventListener("click", () => {
          speakArabic(option.correct ? current.ar : option.ar);
          choosePronunciation(button, option);
        });
        elements.choices.append(button);
      });
    }

    function renderSoftKeyboard() {
      elements.softKeyboard.replaceChildren();
      if (isPoemQuestion()) {
        const usedCounts = poemCharCounts(poemTypedChars());
        poemKeyboardLetters().forEach((letter) => {
          const used = (usedCounts[letter] || 0) > 0;
          if (used) usedCounts[letter] -= 1;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "soft-key";
          button.classList.toggle("used", used);
          button.textContent = letter;
          button.setAttribute("aria-label", `读 ${letter}`);
          button.title = `读 ${letter}`;
          button.disabled = completedCurrent || used;
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
          });
          button.addEventListener("click", () => {
            if (completedCurrent || used) return;
            speakChinese(letter);
            const expected = nextPoemChar();
            if (letter !== expected) {
              button.classList.add("wrong");
              window.setTimeout(() => button.classList.remove("wrong"), 180);
              updateLiveInput();
              elements.arabicInput.focus();
              return;
            }
            setPoemTypedChars([...poemTypedChars(), letter]);
            renderSoftKeyboard();
            elements.arabicInput.focus();
          });
          elements.softKeyboard.append(button);
        });
        return;
      }

      softKeyboardLetters.forEach((letter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "soft-key";
        if (letter === " ") {
          button.classList.add("space");
          button.textContent = "Space";
        } else {
          button.textContent = letter;
        }
        button.disabled = !selectedCorrect || completedCurrent;
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
        });
        button.addEventListener("click", () => {
          if (!selectedCorrect || completedCurrent) return;
          const expected = nextInputChar(current.ar, elements.arabicInput.value);
          if (letter !== expected) {
            updateLiveInput();
            elements.arabicInput.focus();
            return;
          }
          insertAtCursor(elements.arabicInput, letter);
          if (completedCurrent) {
            scheduleCompletionSpeech(current, speakKeySound(letter));
          } else {
            speakKeySound(letter);
          }
          elements.arabicInput.focus();
        });
        elements.softKeyboard.append(button);
      });
    }

    function choosePronunciation(button, option) {
      if (selectedCorrect) return;

      if (option.correct) {
        selectedCorrect = true;
        button.classList.add("correct");
        button.classList.add("show-rom");
        elements.feedback.textContent = "";
        elements.feedback.className = "feedback success";
        elements.entry.hidden = false;
        elements.arabicInput.disabled = false;
        [...elements.choices.children].forEach((choice) => {
          choice.disabled = false;
          if (choice.dataset.correct === "true") {
            choice.classList.add("correct");
            choice.classList.add("show-rom");
          }
        });
        elements.arabicInput.focus();
        renderSoftKeyboard();
        return;
      }

      button.classList.add("wrong");
      button.disabled = true;
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback error";
    }

    function liveState() {
      if (isPoemQuestion()) {
        const typed = poemTypedChars();
        const answer = poemRequiredChars();
        return {
          typed: typed.join(""),
          answer: answer.join(""),
          matchesPrefix: answer.slice(0, typed.length).join("") === typed.join(""),
          isComplete: typed.length === answer.length && answer.every((char, index) => char === typed[index])
        };
      }

      const typed = normalizeLive(elements.arabicInput.value);
      const answer = normalizeLive(current ? current.ar : "");
      return {
        typed,
        answer,
        matchesPrefix: answer.startsWith(typed),
        isComplete: typed === answer
      };
    }

    function updateLiveInput() {
      if (!current) return;

      if (isPoemQuestion()) {
        const required = poemRequiredChars();
        const typed = poemTypedChars().filter((char, index) => char === required[index]);
        const composed = composePoemInput(current.ar, typed);
        if (elements.arabicInput.value !== composed) {
          elements.arabicInput.value = composed;
          elements.arabicInput.setSelectionRange(composed.length, composed.length);
        }

        const state = liveState();
        const next = nextPoemChar();
        elements.nextChar.textContent = displayChar(next);
        renderKeyHint("");
        elements.nextPronunciation.textContent = "-";
        if (!state.isComplete) {
          elements.feedback.textContent = "";
          elements.feedback.className = "feedback";
          savePoemDraft();
        }
        if (state.isComplete && !completedCurrent) {
          completeQuestion();
        }
        return;
      }

      const rawValue = elements.arabicInput.value;
      const rawAnswer = current.ar;
      if (!rawAnswer.startsWith(rawValue)) {
        elements.arabicInput.value = lastValidInput;
      } else {
        lastValidInput = rawValue;
      }

      const state = liveState();

      const next = nextInputChar(current.ar, elements.arabicInput.value);
      elements.nextChar.textContent = displayChar(next);
      renderKeyHint(next);
      elements.nextPronunciation.textContent = pronunciationForChar(next);
      if (!state.isComplete) {
        elements.feedback.textContent = "";
        elements.feedback.className = "feedback";
      }

      if (state.isComplete && !completedCurrent) {
        completeQuestion();
      }
    }

    function completeQuestion() {
      completedCurrent = true;
      const source = activeSource();
      const pieceIndex = sourcePieceIndex(current);
      if (pieceIndex >= 0 && !completedSet().has(pieceIndex)) {
        completedSet().add(pieceIndex);
        markDailyQuestionComplete(source, pieceIndex);
        if (window.location.hash === "#checkin") renderCalendar();
      }
      if (isPoemQuestion(current)) {
        clearPoemDraft(current);
      }
      if (activeQuestions().length > 0 && completedSet().size >= activeQuestions().length) {
        markDailyCheckin(source);
        if (window.location.hash === "#checkin") renderCalendar();
      }
        elements.feedback.textContent = "";
        elements.feedback.className = "feedback success";
        elements.nextButton.disabled = true;
        elements.checkButton.disabled = true;
        elements.hintButton.disabled = true;
        elements.restartPoemButton.disabled = true;
        if (isPoemQuestion(current)) {
          elements.hintButton.textContent = "提示已完";
        }
        elements.nextChar.textContent = "-";
        renderKeyHint("");
        elements.nextPronunciation.textContent = "-";
        if (isPoemQuestion(current)) {
          window.setTimeout(() => {
            if (current && completedCurrent) elements.nextButton.disabled = false;
          }, 160);
        } else {
          scheduleCompletionSpeech(current);
        }
        renderSoftKeyboard();
        emitMetrics("question-completed");
    }

    function scheduleCompletionSpeech(question, beforeSpeech = Promise.resolve()) {
      if (completionSpeechTimer) {
        clearTimeout(completionSpeechTimer);
      }
      completionSpeechTimer = setTimeout(() => {
        completionSpeechTimer = null;
        if (isPoemQuestion(question)) {
          if (current?.id === question.id && completedCurrent) {
            elements.nextButton.disabled = false;
          }
          return;
        }
        if (current?.id === question.id && completedCurrent) {
          beforeSpeech.then(() => new Promise((resolve) => setTimeout(resolve, finalKeySpeechDelay))).then(() => speakArabic(question.ar)).then(() => {
            if (current?.id === question.id && completedCurrent) {
              elements.nextButton.disabled = false;
            }
          });
        }
      }, completionSpeechDelay);
    }

    function toggleHint() {
      if (isPoemQuestion()) {
        revealPoemHintLine();
        return;
      }
      updateLiveInput();
    }

    function checkInput() {
      updateLiveInput();
    }

    function restartCurrentPoem() {
      if (!isPoemQuestion() || completedCurrent) return;
      clearPoemDraft(current);
      elements.arabicInput.value = "";
      lastValidInput = "";
      updateLiveInput();
      renderSoftKeyboard();
      elements.arabicInput.focus();
    }

    elements.categorySelect.addEventListener("change", () => {
      pool = [];
      drawQuestion();
      emitMetrics("source-changed");
    });
    elements.gameSelect.addEventListener("change", () => {
      if (elements.gameSelect.value.includes("Need%20for%20Speed%20II%20SE") && window.parent === window) {
        elements.gameSelect.value = "games/space-shooter.html";
        elements.feedback.textContent = "请从 index.html 打开，极品飞车2需要外层页面控制倒计时。";
        elements.feedback.className = "feedback error";
        return;
      }
      window.parent.postMessage({
        type: "hub:select-game",
        payload: {
          src: elements.gameSelect.value
        }
      }, "*");
    });
    const pikachuControlCodes = new Set([
      "ArrowLeft",
      "ArrowRight",
      "ArrowUp",
      "ArrowDown",
      "Space"
    ]);
    function forwardPikachuControl(event, isDown) {
      if (!pikachuControlCodes.has(event.code)) return;
      window.parent.postMessage({
        type: "hub:pikachu-key",
        payload: {
          code: event.code,
          isDown
        }
      }, "*");
    }
    window.addEventListener("keydown", (event) => forwardPikachuControl(event, true));
    window.addEventListener("keyup", (event) => forwardPikachuControl(event, false));
    elements.hintButton.addEventListener("click", toggleHint);
    elements.checkButton.addEventListener("click", checkInput);
    elements.restartPoemButton.addEventListener("click", restartCurrentPoem);
    elements.nextButton.addEventListener("click", drawQuestion);
    elements.checkinLink.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.hash = "checkin";
      syncViewFromHash();
    });
    elements.practiceLink.addEventListener("click", (event) => {
      event.preventDefault();
      history.replaceState(null, "", window.location.pathname + window.location.search);
      syncViewFromHash();
    });
    elements.prevMonthButton.addEventListener("click", () => {
      calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
      renderCalendar();
    });
    elements.todayButton.addEventListener("click", () => {
      calendarMonth = new Date();
      renderCalendar();
    });
    elements.nextMonthButton.addEventListener("click", () => {
      calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
      renderCalendar();
    });
    window.addEventListener("hashchange", syncViewFromHash);
    elements.arabicInput.addEventListener("input", updateLiveInput);
    elements.arabicInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (completedCurrent) drawQuestion();
        return;
      }

      if (event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }

      if (isPoemQuestion()) {
        return;
      }

      const mapped = arabicCodeMap[event.code];
      if (mapped) {
        event.preventDefault();
        const arabicText = mapped[event.shiftKey ? 1 : 0];
        const expected = current ? current.ar[elements.arabicInput.value.length] : "";
        if (arabicText !== expected) {
          updateLiveInput();
          return;
        }
        insertAtCursor(elements.arabicInput, arabicText);
        if (completedCurrent) {
          scheduleCompletionSpeech(current, speakKeySound(arabicText));
        } else {
          speakKeySound(arabicText);
        }
      }
    });

    preloadSoftKeyboardAudio();
    drawQuestion();
    syncViewFromHash();
    emitMetrics("ready");
  </script>
</body>
</html>
