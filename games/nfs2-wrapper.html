<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>极品飞车2奖励页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #0b1220;
      color: #fff;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
    }

    .lock {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(11, 18, 32, .94);
      text-align: center;
    }

    .lock[hidden] {
      display: none;
    }

    .panel {
      max-width: 460px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, .82);
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <iframe id="gameFrame" title="Need for Speed II SE" src="about:blank"></iframe>
  <div id="lock" class="lock">
    <div class="panel">
      <h1 id="lockTitle">需要先完成阿语题</h1>
      <p id="lockText">回到 Arabic Test 页面，完成一题后解锁极品飞车2。</p>
    </div>
  </div>

  <script>
    const gameUrl = "https://retroonline.net/Windows/Need%20for%20Speed%20II%20SE";
    const gameFrame = document.querySelector("#gameFrame");
    const lock = document.querySelector("#lock");
    const lockTitle = document.querySelector("#lockTitle");
    const lockText = document.querySelector("#lockText");
    let remainingSeconds = 0;
    let timer = null;

    function setLock(locked, title, text) {
      lock.hidden = !locked;
      lockTitle.textContent = title;
      lockText.textContent = text;
      gameFrame.style.pointerEvents = locked ? "none" : "";
    }

    function stopTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function tick() {
      remainingSeconds -= 1;
      document.title = `极品飞车2 ${remainingSeconds}s`;
      if (remainingSeconds <= 0) {
        lockGame("时间到了");
      }
    }

    function unlock(seconds) {
      stopTimer();
      remainingSeconds = seconds || 60;
      if (gameFrame.src === "about:blank") {
        gameFrame.src = gameUrl;
      }
      setLock(false, "极品飞车2已解锁", `剩余 ${remainingSeconds} 秒。`);
      document.title = `极品飞车2 ${remainingSeconds}s`;
      timer = setInterval(tick, 1000);
      window.focus();
    }

    function lockGame(reason) {
      stopTimer();
      remainingSeconds = 0;
      gameFrame.src = "about:blank";
      document.title = "极品飞车2已锁定";
      setLock(
        true,
        "极品飞车2已锁定",
        `${reason || "时间到了"}。回到 Arabic Test 页面完成一题后继续。`
      );
      window.focus();
    }

    function handleCommand(data) {
      if (data?.type !== "nfs2-reward") return;
      if (data.action === "unlock") {
        unlock(data.seconds || 60);
      }
      if (data.action === "lock") {
        lockGame(data.reason);
      }
    }

    window.addEventListener("message", (event) => handleCommand(event.data));

    if ("BroadcastChannel" in window) {
      const channel = new BroadcastChannel("nfs2-reward");
      channel.addEventListener("message", (event) => handleCommand(event.data));
    }
  </script>
</body>
</html>
