<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星际雷电</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #061221;
      color: #e8f7ff;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 680px;
      background:
        radial-gradient(circle at 50% 44%, rgba(48, 145, 255, .22), transparent 24%),
        radial-gradient(circle at 20% 12%, rgba(84, 199, 255, .18), transparent 18%),
        linear-gradient(180deg, #020611 0%, #06111f 52%, #0b1c32 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .stat-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 86px;
      padding: 8px 10px;
      border: 1px solid rgba(186, 208, 223, .28);
      border-radius: 8px;
      background: rgba(6, 18, 33, .72);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
    }

    .stat span {
      display: block;
      color: #99b9c9;
      font-size: 11px;
      font-weight: 800;
    }

    .stat b {
      display: block;
      margin-top: 2px;
      color: #fff;
      font-size: 18px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(3, 10, 20, .42);
    }

    .overlay[hidden] {
      display: none;
    }

    .modal {
      width: min(440px, 100%);
      padding: 22px;
      border: 1px solid rgba(186, 208, 223, .32);
      border-radius: 10px;
      background: rgba(8, 27, 48, .92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36);
      text-align: center;
    }

    .modal h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .modal p {
      margin: 0 0 16px;
      color: #b9d6e4;
      font-weight: 700;
      line-height: 1.6;
    }

    button {
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #20c997;
      color: #062014;
      font-weight: 900;
      cursor: pointer;
    }

    .pause-button {
      pointer-events: auto;
      min-height: 36px;
      padding: 8px 12px;
      background: #ffcf5a;
      color: #2a1d00;
    }

    .boss-meter {
      position: absolute;
      top: 66px;
      left: 50%;
      width: min(560px, calc(100% - 48px));
      height: 16px;
      overflow: hidden;
      transform: translateX(-50%);
      border: 2px solid rgba(255, 230, 160, .9);
      border-radius: 999px;
      background: rgba(40, 8, 16, .8);
      box-shadow: 0 0 20px rgba(255, 80, 80, .3);
    }

    .boss-meter[hidden] {
      display: none;
    }

    .boss-meter-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffcf5a, #ff5448);
    }
  </style>
</head>
<body>
  <main class="game">
    <canvas id="gameCanvas"></canvas>
    <div id="bossMeter" class="boss-meter" hidden><div id="bossMeterFill" class="boss-meter-fill"></div></div>
    <section class="hud">
      <div class="stat-row">
        <div class="stat"><span>分数</span><b id="score">0</b></div>
        <div class="stat"><span>生命</span><b id="lives">0</b></div>
        <div class="stat"><span>火力</span><b id="power">1</b></div>
        <div class="stat"><span>阿语能量</span><b id="arabicPower">0/16</b></div>
      </div>
      <button id="pauseButton" class="pause-button" type="button" disabled>暂停</button>
    </section>
    <section id="overlay" class="overlay">
      <div class="modal">
        <h1>星际雷电</h1>
        <p>躲避敌人子弹，按空格发射。右侧阿语测试的拼图进度会提升你的火力。</p>
        <button id="startButton" type="button">开始游戏</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const livesEl = document.querySelector("#lives");
    const powerEl = document.querySelector("#power");
    const arabicPowerEl = document.querySelector("#arabicPower");
    const overlay = document.querySelector("#overlay");
    const startButton = document.querySelector("#startButton");
    const pauseButton = document.querySelector("#pauseButton");
    const bossMeter = document.querySelector("#bossMeter");
    const bossMeterFill = document.querySelector("#bossMeterFill");

    const keys = new Set();
    const player = { x: 0, y: 0, w: 34, h: 44, speed: 360, cooldown: 0 };
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let boss = null;
    let particles = [];
    let stars = [];
    let upgradeFlash = 0;
    let score = 0;
    let lives = 0;
    let power = 1;
    let running = false;
    let paused = false;
    let activePlayTime = 0;
    let abilityHeld = false;
    let playerInvulnerable = 0;
    let powerMultiplier = 1;
    let lastTime = 0;
    let enemyTimer = 0;
    let smallEnemyScore = 0;
    let bossLevel = 1;
    let arabicUnlocked = 0;
    let arabicTotal = 16;
    let sourceCompleted = false;
    let audioContext = null;
    let musicTimer = null;
    let musicStep = 0;
    const completedArabicTokens = new Set();

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!stars.length) {
        stars = Array.from({ length: 120 }, () => ({
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          r: Math.random() * 1.8 + .4,
          s: Math.random() * 80 + 30
        }));
      }
      player.x = Math.min(Math.max(player.x || rect.width / 2, 24), rect.width - 24);
      player.y = Math.min(player.y || rect.height - 84, rect.height - 40);
    }

    function reset() {
      const rect = canvas.getBoundingClientRect();
      player.x = rect.width / 2;
      player.y = rect.height - 86;
      bullets = [];
      enemies = [];
      enemyBullets = [];
      boss = null;
      particles = [];
      upgradeFlash = 0;
      score = 0;
      enemyTimer = 0;
      smallEnemyScore = 0;
      bossLevel = 1;
      activePlayTime = 0;
      playerInvulnerable = 0;
      updatePowerFromArabic();
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      powerEl.textContent = abilityHeld ? "HOLD" : `${power} x${powerMultiplier}`;
      arabicPowerEl.textContent = `${arabicUnlocked}/${arabicTotal}`;
      startButton.disabled = !running && lives <= 0;
      pauseButton.disabled = !running;
      pauseButton.textContent = paused ? "继续" : "暂停";
      bossMeter.hidden = !boss;
      if (boss) {
        bossMeterFill.style.width = `${Math.max(0, boss.hp / boss.maxHp) * 100}%`;
      }
    }

    function setOverlay(title, text, buttonText) {
      overlay.querySelector("h1").textContent = title;
      overlay.querySelector("p").textContent = text;
      startButton.textContent = buttonText;
      startButton.disabled = lives <= 0;
      overlay.hidden = false;
    }

    function updatePowerFromArabic() {
      power = Math.max(1, Math.min(4, 1 + Math.floor(arabicUnlocked / 4)));
      const groupsCleared = Math.floor(arabicUnlocked / Math.max(1, arabicTotal));
      powerMultiplier = 2 ** Math.min(4, groupsCleared);
    }

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playTone(frequency, duration, type = "square", volume = .08, slide = 0) {
      const audio = ensureAudio();
      const now = audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      if (slide) {
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(32, frequency + slide), now + duration);
      }
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + .01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + .03);
    }

    function playShotSound() {
      playTone(920, .055, "square", .045, 520);
    }

    function playHitSound() {
      playTone(160, .18, "sawtooth", .12, -90);
      setTimeout(() => playTone(92, .22, "square", .08, -40), 35);
    }

    function playUpgradeSound() {
      [523.25, 659.25, 783.99, 1046.5].forEach((frequency, index) => {
        setTimeout(() => playTone(frequency, .12, "triangle", .09, 80), index * 85);
      });
    }

    function triggerUpgradeEffect() {
      upgradeFlash = .9;
      playUpgradeSound();
      for (let i = 0; i < 34; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 220 + 130;
        particles.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: .75,
          maxLife: .75,
          size: Math.random() * 3 + 2,
          color: i % 2 ? "#7cf7ff" : "#ffdf6e"
        });
      }
    }

    function startMusic() {
      ensureAudio();
      if (musicTimer) return;
      const bass = [110, 110, 146.83, 110, 164.81, 146.83, 98, 110];
      const lead = [440, 523.25, 659.25, 523.25, 392, 493.88, 587.33, 493.88];
      const tick = () => {
        if (!running) {
          musicTimer = null;
          return;
        }
        const index = musicStep % bass.length;
        playTone(bass[index], .12, "triangle", .045);
        if (musicStep % 2 === 0) {
          playTone(lead[index], .08, "square", .025);
        }
        musicStep += 1;
        musicTimer = setTimeout(tick, 150);
      };
      tick();
    }

    function stopMusic() {
      if (musicTimer) {
        clearTimeout(musicTimer);
        musicTimer = null;
      }
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        stopMusic();
      } else {
        lastTime = performance.now();
        startMusic();
      }
      syncHud();
    }

    function shoot() {
      if (player.cooldown > 0) return;
      const effectivePower = abilityHeld ? 1 : power * powerMultiplier;
      const shotCount = abilityHeld ? 1 : Math.max(effectivePower, Math.min(14, lives * powerMultiplier));
      const spacing = abilityHeld ? 0 : Math.min(34, (9 + lives * 1.5) * powerMultiplier);
      const center = (shotCount - 1) / 2;

      Array.from({ length: shotCount }).forEach((_, index) => {
        const offset = (index - center) * spacing;
        bullets.push({
          x: player.x + offset,
          y: player.y - 24,
          vx: offset * 2,
          vy: -620,
          r: 4,
          damage: powerMultiplier
        });
      });
      player.cooldown = Math.max(.07, .23 - Math.min(effectivePower, 8) * .025);
      playShotSound();
    }

    function spawnEnemy(width) {
      const size = Math.random() < .22 ? 38 : 28;
      enemies.push({
        x: Math.random() * (width - 80) + 40,
        y: -40,
        w: size,
        h: size,
        hp: size > 30 ? 3 : 2,
        speed: Math.random() * 70 + 85,
        phase: Math.random() * Math.PI * 2,
        shot: Math.random() * .8 + .4
      });
    }

    function bossScoreTarget() {
      return bossLevel * 2000;
    }

    function spawnBoss(width) {
      const bossStrength = powerMultiplier;
      const bossHp = bossLevel * 1000 * bossStrength;
      boss = {
        x: width / 2,
        y: -80,
        w: Math.min(240, width * .45 + bossStrength * 6),
        h: Math.min(118, 94 + bossStrength * 3),
        hp: bossHp,
        maxHp: bossHp,
        strength: bossStrength,
        phase: Math.random() * Math.PI * 2,
        shot: .5
      };
      smallEnemyScore -= bossScoreTarget();
      enemies = [];
      enemyBullets = [];
    }

    function hitCircleRect(circle, rect) {
      const cx = Math.max(rect.x - rect.w / 2, Math.min(circle.x, rect.x + rect.w / 2));
      const cy = Math.max(rect.y - rect.h / 2, Math.min(circle.y, rect.y + rect.h / 2));
      return (circle.x - cx) ** 2 + (circle.y - cy) ** 2 <= circle.r ** 2;
    }

    function hitRectRect(a, b) {
      return Math.abs(a.x - b.x) * 2 < a.w + b.w && Math.abs(a.y - b.y) * 2 < a.h + b.h;
    }

    function damagePlayer() {
      if (playerInvulnerable > 0) return false;

      lives -= 1;
      window.parent.postMessage({
        type: "game:life-spent",
        payload: { game: "space-shooter", amount: 1 }
      }, "*");
      playerInvulnerable = .9;
      playHitSound();
      explode(player.x, player.y, "#ff7b8e");
      if (lives <= 0) {
        running = false;
        paused = false;
        stopMusic();
        setOverlay("游戏结束", `最终得分：${score}。完成右侧阿语题目可以获得生命。`, "需要生命");
      }
      return true;
    }

    function explode(x, y, color = "#ffcf5a") {
      for (let i = 0; i < 14; i += 1) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 150 + 70;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .45, color });
      }
    }

    function roundedRect(x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function update(dt) {
      const rect = canvas.getBoundingClientRect();
      activePlayTime += dt;
      if (!sourceCompleted && !abilityHeld && activePlayTime >= 180) {
        abilityHeld = true;
      }
      if (keys.has("ArrowLeft")) player.x -= player.speed * dt;
      if (keys.has("ArrowRight")) player.x += player.speed * dt;
      if (keys.has("ArrowUp")) player.y -= player.speed * dt;
      if (keys.has("ArrowDown")) player.y += player.speed * dt;
      player.x = Math.max(22, Math.min(rect.width - 22, player.x));
      player.y = Math.max(46, Math.min(rect.height - 28, player.y));
      player.cooldown = Math.max(0, player.cooldown - dt);
      playerInvulnerable = Math.max(0, playerInvulnerable - dt);
      upgradeFlash = Math.max(0, upgradeFlash - dt);
      if (keys.has("Space")) shoot();

      stars.forEach((star) => {
        star.y += star.s * dt;
        if (star.y > rect.height) {
          star.y = 0;
          star.x = Math.random() * rect.width;
        }
      });

      enemyTimer -= dt;
      if (!boss && smallEnemyScore >= bossScoreTarget()) {
        spawnBoss(rect.width);
      }
      if (!boss && enemyTimer <= 0) {
        spawnEnemy(rect.width);
        enemyTimer = Math.max(.28, .92 - score / 4200);
      }

      bullets.forEach((bullet) => {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
      });
      bullets = bullets.filter((bullet) => bullet.y > -30 && bullet.x > -30 && bullet.x < rect.width + 30);

      enemies.forEach((enemy) => {
        enemy.y += enemy.speed * dt;
        enemy.x += Math.sin(performance.now() / 420 + enemy.phase) * 42 * dt;
        enemy.shot -= dt;
        if (enemy.shot <= 0 && enemy.y > 40) {
          enemyBullets.push({ x: enemy.x, y: enemy.y + enemy.h / 2, vx: 0, vy: 230, r: 5 });
          enemy.shot = Math.random() * 1.2 + .75;
        }
      });

      if (boss) {
        boss.y = Math.min(104, boss.y + 72 * dt);
        boss.x = rect.width / 2 + Math.sin(performance.now() / 520 + boss.phase) * Math.min(150, rect.width * .22);
        boss.shot -= dt;
        if (boss.shot <= 0 && boss.y > 50) {
          const laneCount = Math.min(13, 5 + Math.floor(Math.log2(boss.strength)) * 2);
          const center = (laneCount - 1) / 2;
          Array.from({ length: laneCount }).forEach((_, index) => {
            const vx = (index - center) * 40;
            enemyBullets.push({ x: boss.x, y: boss.y + boss.h / 2, vx, vy: 245 + boss.strength * 12, r: 5 });
          });
          boss.shot = Math.max(.22, .82 - bossLevel / 8 - Math.log2(boss.strength) * .08);
        }
      }

      enemyBullets.forEach((bullet) => {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
      });
      enemyBullets = enemyBullets.filter((bullet) => bullet.y < rect.height + 30);

      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (enemy.hp > 0 && hitCircleRect(bullet, enemy)) {
            bullet.dead = true;
            enemy.hp -= bullet.damage;
            explode(bullet.x, bullet.y, "#74e0ff");
            if (enemy.hp <= 0) {
              const points = enemy.w > 30 ? 180 : 100;
              score += points;
              smallEnemyScore += points;
              explode(enemy.x, enemy.y);
            }
          }
        });
        if (boss && hitCircleRect(bullet, boss)) {
          bullet.dead = true;
          boss.hp -= bullet.damage;
          explode(bullet.x, bullet.y, "#ffcf5a");
          if (boss.hp <= 0) {
            score += 500;
            explode(boss.x, boss.y, "#ff5448");
            boss = null;
            bossLevel += 1;
          }
        }
      });
      bullets = bullets.filter((bullet) => !bullet.dead);

      enemies.forEach((enemy) => {
        if (enemy.hp > 0 && hitRectRect(player, enemy)) {
          enemy.hp = 0;
          explode(enemy.x, enemy.y);
          damagePlayer();
        }
      });
      if (boss && hitRectRect(player, boss)) {
        damagePlayer();
      }
      enemies = enemies.filter((enemy) => enemy.hp > 0 && enemy.y < rect.height + 60);

      enemyBullets.forEach((bullet) => {
        if ((bullet.x - player.x) ** 2 + (bullet.y - player.y) ** 2 < (bullet.r + 16) ** 2) {
          bullet.dead = true;
          damagePlayer();
        }
      });
      enemyBullets = enemyBullets.filter((bullet) => !bullet.dead);

      particles.forEach((p) => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      });
      particles = particles.filter((p) => p.life > 0);
      syncHud();
    }

    function drawShip(x, y) {
      ctx.save();
      ctx.translate(x, y);
      const flame = 12 + Math.sin(performance.now() / 70) * 4;
      ctx.fillStyle = "rgba(255, 120, 28, .92)";
      ctx.beginPath();
      ctx.moveTo(-7, 20);
      ctx.lineTo(0, 20 + flame);
      ctx.lineTo(7, 20);
      ctx.closePath();
      ctx.fill();
      ctx.shadowColor = "#3cf2ff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#2ee7ff";
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(20, 24);
      ctx.lineTo(0, 12);
      ctx.lineTo(-20, 24);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#14315d";
      ctx.fillRect(-13, 2, 26, 13);
      ctx.fillStyle = "#e8f7ff";
      ctx.beginPath();
      ctx.ellipse(0, -6, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStation(rect) {
      const t = performance.now() / 1000;
      ctx.save();
      ctx.globalAlpha = .92;
      ctx.translate(rect.width / 2, 92 + Math.sin(t) * 6);
      ctx.rotate(-.2);

      const bodyGradient = ctx.createLinearGradient(-220, 0, 220, 0);
      bodyGradient.addColorStop(0, "#33465b");
      bodyGradient.addColorStop(.5, "#aeb8c0");
      bodyGradient.addColorStop(1, "#263848");
      ctx.fillStyle = bodyGradient;
      ctx.fillRect(-210, -34, 420, 68);
      ctx.strokeStyle = "rgba(255,255,255,.32)";
      ctx.lineWidth = 2;
      for (let x = -190; x <= 190; x += 38) {
        ctx.beginPath();
        ctx.moveTo(x, -34);
        ctx.lineTo(x + 16, 34);
        ctx.stroke();
      }
      ctx.fillStyle = "#121923";
      ctx.beginPath();
      ctx.arc(0, 0, 56, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#aeb8c0";
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.fillStyle = "#32d7ff";
      ctx.beginPath();
      ctx.arc(0, 0, 18 + Math.sin(t * 4) * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(rect.width * .16, rect.height - 92);
      ctx.rotate(.25);
      ctx.fillStyle = "#2f4357";
      ctx.fillRect(-180, -22, 360, 44);
      ctx.strokeStyle = "rgba(224, 235, 244, .3)";
      for (let x = -160; x <= 160; x += 42) {
        ctx.beginPath();
        ctx.moveTo(x, -22);
        ctx.lineTo(x - 12, 22);
        ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawStation(rect);
      stars.forEach((star) => {
        ctx.fillStyle = "rgba(232, 247, 255, .85)";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });

      bullets.forEach((bullet) => {
        ctx.strokeStyle = "rgba(255, 214, 91, .92)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#ffcf5a";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y + 14);
        ctx.lineTo(bullet.x, bullet.y - 14);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff2a6";
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      });

      enemies.forEach((enemy) => {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.shadowColor = enemy.w > 30 ? "#ff7b8e" : "#ffcf5a";
        ctx.shadowBlur = 10;
        ctx.fillStyle = enemy.w > 30 ? "#9e273d" : "#8f6b22";
        roundedRect(-enemy.w / 2, -enemy.h / 2, enemy.w, enemy.h, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#e7edf4";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#111722";
        ctx.fillRect(-enemy.w / 3, -5, enemy.w * 2 / 3, 10);
        ctx.fillStyle = "#ffcf5a";
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      if (boss) {
        ctx.save();
        ctx.translate(boss.x, boss.y);
        ctx.shadowColor = "#ff5448";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "#661b2a";
        roundedRect(-boss.w / 2, -boss.h / 2, boss.w, boss.h, 16);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#ffe6a0";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#101828";
        ctx.fillRect(-boss.w * .34, -12, boss.w * .68, 24);
        ctx.fillStyle = "#ffcf5a";
        [-.26, 0, .26].forEach((ratio) => {
          ctx.beginPath();
          ctx.arc(boss.w * ratio, 0, 8, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      enemyBullets.forEach((bullet) => {
        ctx.strokeStyle = "rgba(255, 149, 58, .92)";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#ff7b3a";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(bullet.x, bullet.y - 16);
        ctx.lineTo(bullet.x, bullet.y + 16);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe0a3";
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      });

      particles.forEach((p) => {
        const maxLife = p.maxLife || .45;
        ctx.globalAlpha = Math.max(0, p.life / maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });

      if (upgradeFlash > 0) {
        const progress = 1 - upgradeFlash / .9;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.globalAlpha = upgradeFlash / .9;
        ctx.strokeStyle = "#7cf7ff";
        ctx.lineWidth = 3;
        [28, 52, 76].forEach((radius, index) => {
          ctx.beginPath();
          ctx.arc(0, 0, radius + progress * 34 + index * 7, 0, Math.PI * 2);
          ctx.stroke();
        });
        ctx.fillStyle = "rgba(255, 223, 110, .18)";
        ctx.beginPath();
        ctx.arc(0, 0, 72 + progress * 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      drawShip(player.x, player.y);
    }

    function loop(time) {
      const dt = Math.min(.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      if (running && !paused) update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
      if (event.code === "KeyP") {
        event.preventDefault();
        togglePause();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "hub:arabic-metrics") return;
      const payload = event.data.payload || {};
      const tokens = Array.isArray(payload.completedTokens) ? payload.completedTokens : [];
      const newTokens = tokens.filter((token) => !completedArabicTokens.has(token));
      newTokens.forEach((token) => completedArabicTokens.add(token));
      if (Number.isFinite(Number(payload.lives))) {
        lives = Math.max(0, Number(payload.lives));
      } else if (newTokens.length) {
        lives += newTokens.length;
      }
      sourceCompleted = Boolean(payload.sourceCompleted);
      if (sourceCompleted && abilityHeld) {
        abilityHeld = false;
        activePlayTime = 0;
      } else if (newTokens.length) {
        if (abilityHeld) {
          abilityHeld = false;
          activePlayTime = 0;
        }
      }
      const previousMultiplier = powerMultiplier;
      arabicUnlocked = completedArabicTokens.size || payload.completedQuestions || payload.puzzleUnlocked || 0;
      arabicTotal = payload.totalQuestions || payload.puzzleTotal || 16;
      updatePowerFromArabic();
      if (newTokens.length && powerMultiplier > previousMultiplier) {
        triggerUpgradeEffect();
      }
      syncHud();
      if (!running && lives > 0 && !overlay.hidden) {
        setOverlay("星际雷电", `当前生命：${lives}。按开始进入游戏。`, "开始游戏");
      }
    });

    startButton.addEventListener("click", () => {
      if (lives <= 0) {
        setOverlay("需要生命", "先完成右侧阿语题目获得生命，生命大于 0 才能开始游戏。", "需要生命");
        return;
      }
      reset();
      running = true;
      paused = false;
      overlay.hidden = true;
      startButton.disabled = false;
      startMusic();
      lastTime = performance.now();
      window.parent.postMessage({
        type: "game:start",
        payload: { game: "space-shooter" }
      }, "*");
    });

    pauseButton.addEventListener("click", togglePause);

    window.addEventListener("resize", resize);
    resize();
    reset();
    setOverlay("需要生命", "先完成右侧阿语题目获得生命，生命大于 0 才能开始游戏。", "需要生命");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
