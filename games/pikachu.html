<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pikachu Volleyball</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #101827;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: #142033;
    }

    .wrap {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 8px;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 232, 110, .28), transparent 24%),
        radial-gradient(circle at 78% 12%, rgba(96, 190, 255, .22), transparent 28%),
        linear-gradient(180deg, #172235 0%, #0f1726 100%);
    }

    .game {
      position: relative;
      width: min(100%, 1180px);
      height: min(100%, 760px);
      border: 1px solid rgba(215, 222, 232, .75);
      border-radius: 10px;
      overflow: hidden;
      background: #8fd5ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, #83d9ff 0%, #bdefff 58%, #62bd67 58%, #4aa653 100%);
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 14px;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }

    .stat {
      min-width: 84px;
      padding: 8px 10px;
      border: 1px solid rgba(20, 32, 51, .24);
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
      font-weight: 900;
      box-shadow: 0 5px 16px rgba(20, 32, 51, .12);
    }

    .stat span {
      display: block;
      margin-bottom: 2px;
      color: #53627a;
      font-size: 12px;
      font-weight: 800;
    }

    .status {
      position: absolute;
      left: 50%;
      top: 16px;
      max-width: min(520px, calc(100% - 32px));
      transform: translateX(-50%);
      padding: 9px 14px;
      border: 1px solid rgba(20, 32, 51, .22);
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      color: #142033;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: none;
    }

    .key {
      min-width: 42px;
      padding: 7px 10px;
      border: 1px solid rgba(20, 32, 51, .24);
      border-bottom-width: 4px;
      border-radius: 7px;
      background: rgba(255, 255, 255, .78);
      font-weight: 900;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="game" aria-label="Pikachu volleyball">
      <canvas id="court" width="960" height="620"></canvas>
      <div class="hud">
        <div class="stat"><span>玩家</span><b id="playerScore">0</b></div>
        <div class="stat"><span>电脑</span><b id="cpuScore">0</b></div>
        <div class="stat"><span>资格</span><b id="credits">0</b></div>
      </div>
      <div id="status" class="status">先完成右侧阿语题目，获得打一球资格</div>
      <div class="controls">
        <div class="key">←</div>
        <div class="key">→</div>
        <div class="key">↑</div>
        <div class="key">Space</div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#court");
    const ctx = canvas.getContext("2d");
    const scoreEls = {
      player: document.querySelector("#playerScore"),
      cpu: document.querySelector("#cpuScore"),
      credits: document.querySelector("#credits"),
      status: document.querySelector("#status")
    };

    const W = canvas.width;
    const H = canvas.height;
    const ground = 520;
    const netX = W / 2;
    const netTop = 330;
    const gravity = 0.55;
    const keys = new Set();

    let credits = 0;
    let playerScore = 0;
    let cpuScore = 0;
    let baselineTokenCount = null;
    let rallyActive = false;
    let winnerContinues = false;
    let nextServeSide = "player";
    let roundMessageTimer = 0;

    const player = makePika(230, "#ffd84a", "player");
    const cpu = makePika(730, "#f6c243", "cpu");
    const ball = { x: 260, y: 250, vx: 0, vy: 0, r: 17 };

    function makePika(x, color, side) {
      return {
        x,
        y: ground - 42,
        vx: 0,
        vy: 0,
        r: 42,
        color,
        side,
        onGround: true,
        facing: side === "player" ? 1 : -1,
        cooldown: 0
      };
    }

    function updateHud(message) {
      scoreEls.player.textContent = playerScore;
      scoreEls.cpu.textContent = cpuScore;
      scoreEls.credits.textContent = credits;
      if (message) scoreEls.status.textContent = message;
    }

    function canStartRally() {
      return credits > 0 || winnerContinues;
    }

    function startRally() {
      if (rallyActive || !canStartRally()) return;
      if (!winnerContinues) credits = Math.max(0, credits - 1);
      rallyActive = true;
      winnerContinues = false;
      resetActors();
      serveBall();
      updateHud("进行中");
    }

    function resetActors() {
      player.x = 230;
      player.y = ground - player.r;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
      cpu.x = 730;
      cpu.y = ground - cpu.r;
      cpu.vx = 0;
      cpu.vy = 0;
      cpu.onGround = true;
    }

    function serveBall() {
      const fromPlayer = nextServeSide === "player";
      ball.x = fromPlayer ? player.x + 34 : cpu.x - 34;
      ball.y = 250;
      ball.vx = fromPlayer ? 4.5 : -4.2;
      ball.vy = -6.5;
    }

    function finishRally(winner) {
      rallyActive = false;
      roundMessageTimer = 90;
      if (winner === "player") {
        playerScore += 1;
        nextServeSide = "player";
        winnerContinues = true;
        updateHud("你赢了这一球，继续下一球");
      } else {
        cpuScore += 1;
        nextServeSide = "cpu";
        winnerContinues = false;
        updateHud("这一球输了，再完成一道阿语题");
      }
    }

    function grantCredit(count = 1) {
      credits += count;
      updateHud("获得打一球资格");
      if (!rallyActive) setTimeout(startRally, 450);
    }

    function handleArabicMetrics(payload) {
      const tokenCount = Array.isArray(payload?.completedTokens)
        ? payload.completedTokens.length
        : Number(payload?.completedQuestions || 0);
      if (!Number.isFinite(tokenCount)) return;
      if (baselineTokenCount === null) {
        baselineTokenCount = tokenCount;
        return;
      }
      const gained = tokenCount - baselineTokenCount;
      baselineTokenCount = tokenCount;
      if (gained > 0) grantCredit(gained);
    }

    function updatePlayer() {
      const speed = 5.2;
      player.vx = 0;
      if (keys.has("ArrowLeft")) player.vx -= speed;
      if (keys.has("ArrowRight")) player.vx += speed;
      if ((keys.has("ArrowUp") || keys.has("Space")) && player.onGround) {
        player.vy = -12.5;
        player.onGround = false;
      }
      movePika(player, 50, netX - 56);
    }

    function updateCpu() {
      const target = ball.x > netX ? ball.x : 730;
      const dx = target - cpu.x;
      cpu.vx = Math.max(-4.4, Math.min(4.4, dx * 0.055));
      if (rallyActive && ball.x > netX && ball.y < 350 && Math.abs(dx) < 70 && cpu.onGround) {
        cpu.vy = -11.5;
        cpu.onGround = false;
      }
      movePika(cpu, netX + 56, W - 50);
    }

    function movePika(pika, minX, maxX) {
      pika.cooldown = Math.max(0, pika.cooldown - 1);
      pika.x += pika.vx;
      pika.x = Math.max(minX, Math.min(maxX, pika.x));
      pika.y += pika.vy;
      pika.vy += gravity;
      if (pika.y >= ground - pika.r) {
        pika.y = ground - pika.r;
        pika.vy = 0;
        pika.onGround = true;
      }
      if (pika.vx !== 0) pika.facing = pika.vx > 0 ? 1 : -1;
    }

    function updateBall() {
      if (!rallyActive) return;
      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.vy += gravity;
      ball.vx *= 0.998;

      if (ball.x < ball.r) {
        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx);
      }
      if (ball.x > W - ball.r) {
        ball.x = W - ball.r;
        ball.vx = -Math.abs(ball.vx);
      }
      if (ball.y < ball.r) {
        ball.y = ball.r;
        ball.vy = Math.abs(ball.vy);
      }

      collidePika(player);
      collidePika(cpu);
      collideNet();

      if (ball.y + ball.r >= ground) {
        finishRally(ball.x < netX ? "cpu" : "player");
      }
    }

    function collidePika(pika) {
      if (pika.cooldown > 0) return;
      const dx = ball.x - pika.x;
      const dy = ball.y - pika.y;
      const dist = Math.hypot(dx, dy);
      const minDist = pika.r + ball.r;
      if (dist >= minDist) return;

      const nx = dx / (dist || 1);
      const ny = dy / (dist || 1);
      ball.x = pika.x + nx * minDist;
      ball.y = pika.y + ny * minDist;
      const force = pika.side === "player" ? 8.2 : 7.5;
      ball.vx = nx * force + pika.vx * 0.55;
      ball.vy = Math.min(-4.5, ny * force - 4.2);
      pika.cooldown = 8;
    }

    function collideNet() {
      const nearX = Math.abs(ball.x - netX) < ball.r + 8;
      const inY = ball.y + ball.r > netTop && ball.y - ball.r < ground;
      if (!nearX || !inY) return;
      ball.x = ball.x < netX ? netX - ball.r - 8 : netX + ball.r + 8;
      ball.vx *= -0.65;
      ball.vy -= 1.2;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawSky();
      drawCourt();
      drawNet();
      drawPika(player);
      drawPika(cpu);
      drawBall();
    }

    function drawSky() {
      ctx.fillStyle = "#82d8ff";
      ctx.fillRect(0, 0, W, ground);
      ctx.fillStyle = "rgba(255,255,255,.72)";
      for (const cloud of [[120, 84, 52], [720, 104, 66], [430, 70, 42]]) {
        ctx.beginPath();
        ctx.arc(cloud[0], cloud[1], cloud[2], 0, Math.PI * 2);
        ctx.arc(cloud[0] + cloud[2] * .75, cloud[1] + 8, cloud[2] * .75, 0, Math.PI * 2);
        ctx.arc(cloud[0] - cloud[2] * .7, cloud[1] + 10, cloud[2] * .66, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawCourt() {
      ctx.fillStyle = "#56af5c";
      ctx.fillRect(0, ground, W, H - ground);
      ctx.strokeStyle = "rgba(255,255,255,.45)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, ground);
      ctx.lineTo(W, ground);
      ctx.stroke();
    }

    function drawNet() {
      ctx.fillStyle = "#26364f";
      ctx.fillRect(netX - 5, netTop, 10, ground - netTop);
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = 2;
      for (let y = netTop + 12; y < ground; y += 18) {
        ctx.beginPath();
        ctx.moveTo(netX - 5, y);
        ctx.lineTo(netX + 5, y + 8);
        ctx.stroke();
      }
    }

    function drawPika(pika) {
      ctx.save();
      ctx.translate(pika.x, pika.y);
      ctx.fillStyle = pika.color;
      ctx.strokeStyle = "#24324a";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, 8, pika.r, pika.r * .9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawEar(-24, -32, -0.58, pika.color);
      drawEar(24, -32, 0.58, pika.color);
      ctx.fillStyle = "#24324a";
      ctx.beginPath();
      ctx.arc(-14, -2, 5, 0, Math.PI * 2);
      ctx.arc(14, -2, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ef4b45";
      ctx.beginPath();
      ctx.arc(-27, 13, 8, 0, Math.PI * 2);
      ctx.arc(27, 13, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#24324a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 14, 12, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      ctx.restore();
    }

    function drawEar(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.strokeStyle = "#24324a";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-10, -46);
      ctx.lineTo(14, -8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#24324a";
      ctx.beginPath();
      ctx.moveTo(-7, -35);
      ctx.lineTo(-10, -46);
      ctx.lineTo(1, -30);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawBall() {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#24324a";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#ef4b45";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r * .62, -0.25 * Math.PI, 1.2 * Math.PI);
      ctx.stroke();
    }

    function tick() {
      updatePlayer();
      updateCpu();
      updateBall();
      if (!rallyActive && roundMessageTimer > 0) {
        roundMessageTimer -= 1;
        if (roundMessageTimer === 0 && canStartRally()) startRally();
      }
      draw();
      requestAnimationFrame(tick);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
        if (event.code === "Space" && !rallyActive) startRally();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    window.addEventListener("message", (event) => {
      if (event.data?.type === "hub:arabic-metrics") {
        handleArabicMetrics(event.data.payload);
      }
    });

    resetActors();
    updateHud("先完成右侧阿语题目，获得打一球资格");
    draw();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
