<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pikachu Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #7bdcff 0%, #f7e77a 58%, #7bc66f 100%);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: #1d2433;
    }

    .stage {
      width: min(720px, calc(100vw - 32px));
      aspect-ratio: 4 / 3;
      border: 4px solid #1d2433;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 36%, #ffd84d 0 28px, transparent 29px),
        radial-gradient(circle at 72% 36%, #ffd84d 0 28px, transparent 29px),
        linear-gradient(#88d9ff 0 62%, #5cb85c 62% 100%);
      box-shadow: 0 18px 36px rgba(0, 0, 0, .22);
    }

    .net {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 5px;
      height: 42%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, #fff 0 8px, #1d2433 8px 12px);
    }

    .ball {
      position: absolute;
      left: 50%;
      top: 24%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid #1d2433;
      transform: translateX(-50%);
      background: #fff;
    }

    .player {
      position: absolute;
      bottom: 15%;
      width: 86px;
      height: 70px;
      border: 4px solid #1d2433;
      border-radius: 48% 48% 38% 38%;
      background: #ffd84d;
    }

    .player::before,
    .player::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1d2433;
    }

    .player::before {
      left: 24px;
    }

    .player::after {
      right: 24px;
    }

    .left {
      left: 18%;
    }

    .right {
      right: 18%;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Pikachu dummy game">
    <div class="ball"></div>
    <div class="net"></div>
    <div class="player left"></div>
    <div class="player right"></div>
  </main>
</body>
</html>
